   <div class="wide" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn primary" type="submit">Save trade</button><span class="note" id="j-preview"></span></div>
  </form></div></div>`;
  if(blocks.length){ h+=`<div class="sec">${secH('target','Blocks of 20',blocks.length+' block'+(blocks.length>1?'s':''))}<div class="tw"><table><thead><tr><th>Block</th><th class="num">Trades</th><th class="num">Win rate</th><th class="num">Avg win</th><th class="num">Avg loss</th><th class="num">Expectancy</th><th class="num">Sum</th><th class="num">Adherence</th><th>Verdict</th></tr></thead><tbody>${blocks.map((b,i)=>{ const s=stats(b); const ok=s.n>=20&&s.exp>0&&s.adh>90; return `<tr><td>${i===0?'Current':'Block '+(blocks.length-i)}</td><td class="num">${s.n}</td><td class="num">${fmtPct(s.win,0)}</td><td class="num">${s.aw.toFixed(2)}R</td><td class="num">${s.al.toFixed(2)}R</td><td class="num">${s.exp.toFixed(2)}R</td><td class="num">${s.sum.toFixed(1)}R</td><td class="num">${fmtPct(s.adh,0)}</td><td>${s.n<20?'<span class="tag">incomplete</span>':(ok?'<span class="tag ok">scale up allowed</span>':'<span class="tag warn">hold size</span>')}</td></tr>`; }).join('')}</tbody></table></div></div>`; }
  h+=`<div class="sec">${secH('list','Trades',state.journal.length+' entries')}`;
  if(!state.journal.length) h+=`<div class="empty">No trades yet. Back-fill your last five testnet trades to test the fields, then journal every trade from here on. Blocks of 20 appear once there are closed trades.</div>`;
  else h+=state.journal.map(t=>{ const r=t.r; const open=!Number.isFinite(r); const d=t.ts?t.ts.replace('T',' '):''; return `<div class="jrow" data-id="${t.id}"><div><div class="d">${esc(d)}</div><div class="t">${esc(t.market||'')} <span class="tag ${t.side==='short'?'bad':'ok'}">${t.side==='short'?'short':'long'}</span> <span class="tag ${t.grade==='A'?'ok':(t.grade==='B'?'warn':'bad')}">grade ${esc(t.grade||'')}</span></div><div class="meta">${esc(t.setup||'')}${t.setup?' · ':''}entry ${fmtNum(t.entry,4)} · stop ${fmtNum(t.stop,4)} · size ${fmtNum(t.size,6)}${open?' · open':' · exit '+fmtNum(t.exit,4)}${t.reason?' · '+esc(t.reason):''}${t.lesson?'<br>'+esc(t.lesson):''}</div></div><div style="display:grid;gap:6px;justify-items:end"><span class="r ${open?'':(r>0?'pos':'neg')}">${open?'open':(r>0?'+':'')+r.toFixed(2)+'R'}</span><button type="button" class="x" data-del="${t.id}">delete</button></div></div>`; }).join('');
  h+='</div>';
  return h;
}
function journalPreview(){ const g=id=>parseFloat(document.getElementById(id)?.value); const t={entry:g('j-entry'),stop:g('j-stop'),exit:g('j-exit'),size:g('j-size'),fees:g('j-fees')||0,funding:g('j-fund')||0,side:document.getElementById('j-side')?.value}; const r=rOf(t); const risk=Math.abs(t.entry-t.stop)*t.size; const el=document.getElementById('j-preview'); if(!el) return; el.textContent = Number.isFinite(risk)&&risk>0 ? `1R = ${fmtMoney(risk)}${Number.isFinite(r)?` · result ${r>0?'+':''}${r.toFixed(2)}R`:' · open'}` : ''; }
async function saveTrade(){
  const g=id=>document.getElementById(id)?.value; const n=id=>{ const v=parseFloat(g(id)); return Number.isFinite(v)?v:null; };
  const t={ts:g('j-ts'),market:(g('j-mkt')||'').trim(),side:g('j-side'),setup:(g('j-setup')||'').trim(),entry:n('j-entry'),stop:n('j-stop'),target:n('j-target'),size:n('j-size'),exit:n('j-exit'),fees:n('j-fees')||0,funding:n('j-fund')||0,grade:g('j-grade'),reason:(g('j-reason')||'').trim(),lesson:(g('j-lesson')||'').trim(),createdAt:new Date().toISOString()};
  if(!t.market||t.entry==null||t.stop==null||t.size==null){ toast('Market, entry, stop and size are required'); return; }
  const r=rOf(Object.assign({},t,{exit:t.exit==null?NaN:t.exit})); t.r = Number.isFinite(r)?r:null;
  const id='t'+Date.now().toString(36);
  if(db&&journalCol){ try{ await journalCol.doc(id).set(t); toast('Trade saved'); }catch(e){ toast('Store refused the write; saved locally'); state.journal.unshift(Object.assign({id},t)); lsSet('hlwb.journal',state.journal); renderCurrent(); } }
  else { state.journal.unshift(Object.assign({id},t)); state.journal.sort((a,b)=>(b.ts||'').localeCompare(a.ts||'')); lsSet('hlwb.journal',state.journal); toast('Trade saved in this browser'); renderCurrent(); }
}
async function deleteTrade(id){ if(db&&journalCol){ try{ await journalCol.doc(id).delete(); toast('Deleted'); }catch(e){ toast('Could not delete'); } } else { state.journal=state.journal.filter(t=>t.id!==id); lsSet('hlwb.journal',state.journal); renderCurrent(); } }
function renderSchedule(){ const done=SCHEDULE.filter(r=>state.items['week-'+r[0]]).length; return `<div class="lesson"><div class="top"><span class="tag p">8 weeks</span><span class="tag">${done} ticked</span></div><h1>Schedule</h1><p class="lead">Eight weeks to a journaled mainnet trader at minimum size. After week 8 the unit of progress is a 20-trade block, not a week. Tick a week when its graduation check is true, not when the reading is done.</p><div class="lp"><div class="bar"><i style="width:${done/SCHEDULE.length*100}%"></i></div><span>${done} of ${SCHEDULE.length} weeks</span></div></div>
  <div class="weeks">${SCHEDULE.map(r=>{ const on=!!state.items['week-'+r[0]]; return `<label class="week ${on?'done':''}" for="week-${r[0]}"><span class="wn">${on?ICONS.check.replace('<svg','<svg width="20" height="20"'):'W'+r[0]}</span><span><span class="wt">Week ${r[0]}: layers ${esc(r[1])} <span class="tag">${r[2]} h</span></span><span class="wg">${esc(r[3])}</span></span><span class="check" style="padding:0"><input type="checkbox" id="week-${r[0]}" data-item="week-${r[0]}" ${on?'checked':''} aria-label="Week ${r[0]} done"></span></label>`; }).join('')}</div>
  <p class="note" style="margin-top:14px">Then: repeat 20-trade blocks. Raise risk from 0.5% toward 1% only after a block that is both positive and above 90% adherence. Add HIP-3 markets or hyperps only after two such blocks on the main perps.</p>`; }
function renderGlossary(){ return `<div class="lesson"><div class="top"><span class="tag p">${GLOSSARY.length} terms</span></div><h1>Glossary</h1><p class="lead">One line each. If a term is not here, the docs define it.</p></div><div class="tw"><table><tbody>${GLOSSARY.map(r=>`<tr><td style="white-space:nowrap"><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>`; }
function renderSources(){
  const groups=[['Start here',[['About Hyperliquid','about-hyperliquid'],['Hyperliquid 101 for non-crypto audiences','about-hyperliquid/hyperliquid-101-for-non-crypto-audiences'],['How to start trading','onboarding/how-to-start-trading'],['Testnet faucet','onboarding/testnet-faucet'],['HyperCore overview','hypercore/overview']]],['Trading',[['Order book','trading/order-book'],['Order types','trading/order-types'],['Take profit and stop loss','trading/take-profit-and-stop-loss-orders-tp-sl'],['Fees','trading/fees'],['Perpetual assets','trading/perpetual-assets'],['Contract specifications','trading/contract-specifications'],['Margining','trading/margining'],['Margin tiers','trading/margin-tiers'],['Robust price indices','trading/robust-price-indices'],['Liquidations','trading/liquidations'],['Auto-deleveraging','trading/auto-deleveraging'],['Funding','trading/funding'],['Entry price and PnL','trading/entry-price-and-pnl'],['Hyperps','trading/hyperps'],['Delisting','trading/delisting'],['Portfolio graphs','trading/portfolio-graphs'],['Miscellaneous UI','trading/miscellaneous-ui'],['Self-trade prevention','trading/self-trade-prevention']]],['Support FAQ',[['Support guide','support/read-me-support-guide'],['Why was I liquidated?','support/faq/trade-outcome-looks-incorrect/why-was-i-liquidated'],['How does margining work?','support/faq/trade-outcome-looks-incorrect/how-does-margining-work'],['My TP/SL did not execute correctly','support/faq/trade-outcome-looks-incorrect/my-tp-sl-did-not-execute-correctly'],['Why was my chase order canceled?','support/faq/trade-outcome-looks-incorrect/why-was-my-chase-order-canceled'],['Trailing stops','support/faq/trailing-stops'],['I got scammed or hacked','support/faq/i-got-scammed-hacked']]],['Ecosystem',[['HIPs','hyperliquid-improvement-proposals-hips'],['HIP-1','hyperliquid-improvement-proposals-hips/hip-1-native-token-standard'],['HIP-2','hyperliquid-improvement-proposals-hips/hip-2-hyperliquidity'],['HIP-3','hyperliquid-improvement-proposals-hips/hip-3-builder-deployed-perpetuals'],['HIP-4','hyperliquid-improvement-proposals-hips/hip-4-outcome-markets'],['Vaults','hypercore/vaults'],['Protocol vaults (HLP)','hypercore/vaults/protocol-vaults'],['Staking','hypercore/staking'],['How to stake HYPE','onboarding/how-to-stake-hype'],['Referrals','referrals'],['Points','points']]],['Developers',[['API','for-developers/api'],['Info endpoint','for-developers/api/info-endpoint'],['Tick and lot size','for-developers/api/tick-and-lot-size'],['Activation gas fee','for-developers/api/activation-gas-fee'],['Historical data','historical-data']]]];
  return `<div class="lesson"><div class="top"><span class="tag ok">verified ${VERIFIED_ON}</span></div><h1>Sources and verification</h1><p class="lead">The official docs index comes from the GitBook sitemap read on ${VERIFIED_ON}. The pages that carry numbers (fees, funding, liquidations, order types, TP/SL, onboarding, faucet, entry price and PnL, HIP-3, protocol vaults) were opened that day, as were the BLS and Federal Reserve schedules behind the market clock, the NYSE hours page, and every media item marked opened.</p></div>
  ${groups.map(g=>`<div class="sec">${secH('doc',g[0],g[1].length+' pages')}<div class="links">${g[1].map(p=>`<a class="link" href="${D(p[1])}" target="_blank" rel="noopener"><span class="ic">${ICONS.doc}</span><span>${esc(p[0])}</span></a>`).join('')}</div></div>`).join('')}
  <div class="sec">${secH('flag','Could not be re-checked')}<div class="card"><ul><li>CME Globex hours page (timed out twice); hours are stated from the standard schedule.</li><li>Hyperdash and DefiLlama blocked automated access; both are confirmed by several independent sources.</li><li>X handles and the Discord invite: X blocks automated reads; verify from the links in app.hyperliquid.xyz.</li><li>The Mark Douglas seminar’s exact video IDs; the card links a YouTube search for the exact title.</li></ul></div></div>
  <div class="sec">${secH('check','Method')}<div class="card"><p class="small" style="margin:0">About 25 web searches and 60 page fetches on ${VERIFIED_ON}: founder interviews and podcasts, mechanism research on HLP, funding and liquidations, trading psychology sources, Hyperliquid analytics tools, YouTube tutorials, session and time-of-day studies, and the two incident post-mortems. Everything rejected is listed on the <a href="#noise">Noise filter</a> page with the reason.</p></div></div>`;
}
function renderCurrent(scroll){
  clearLive();
  const c=document.getElementById('content'); let html=''; const l=LAYERS.find(x=>x.id===current);
  if(l) html=renderLayer(l); else if(current==='media') html=renderMedia(); else if(current==='noise') html=renderNoise(); else if(current==='clock') html=renderClock(); else if(current==='tools') html=renderTools(); else if(current==='journal') html=renderJournal(); else if(current==='schedule') html=renderSchedule(); else if(current==='glossary') html=renderGlossary(); else if(current==='sources') html=renderSources(); else html=renderOverview();
  c.innerHTML=html;
  if(current==='clock') renderClockLive(); if(current==='tools') calcTools(); if(current==='journal') journalPreview();
  initWidgets();
  updateNav(); updateTop(); if(scroll) window.scrollTo({top:0});
}
function scrollToSlug(){ if(!currentSlug) return; const el=document.getElementById('sec-'+current+'-'+currentSlug); if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); } }
function rerenderQuiz(l){ const el=document.getElementById('quiz-'+l.id); if(el){ const tmp=document.createElement('div'); tmp.innerHTML=quizHtml(l); el.replaceWith(tmp.firstElementChild); } }
let currentSlug='';
function route(){ const raw=decodeURIComponent((location.hash||'#overview').slice(1)); const parts=raw.split('/'); const view=VIEWS.some(v=>v.id===parts[0])?parts[0]:'overview'; const same=(view===current)&&document.getElementById('content').childElementCount>0; current=view; currentSlug=parts[1]||''; if(!same) renderCurrent(!currentSlug); if(currentSlug) setTimeout(scrollToSlug,same?0:30); else if(same) window.scrollTo({top:0,behavior:'smooth'}); }

/* ============================ EVENTS ============================ */
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('input[type=checkbox][data-item]')){ toggleItem(t.dataset.item,t.checked); const row=t.closest('.check'); if(row) row.classList.toggle('done',t.checked); const wk=t.closest('.week'); if(wk) wk.classList.toggle('done',t.checked); const l=LAYERS.find(x=>x.id===current); if(l){ const p=layerProgress(l); const bar=document.querySelector('.lesson .lp .bar i'); if(bar) bar.style.width=p.pct+'%'; const sp=document.querySelector('.lesson .lp span'); if(sp) sp.textContent=`${p.done} of ${p.total} complete`; } if(current==='overview'||current==='schedule') renderCurrent(); }
  if(t.closest('#f-size,#f-liq,#f-fund,#f-fee,#f-exp')) calcTools(); if(t.closest('#f-j')) journalPreview();
});
document.addEventListener('input',e=>{ if(e.target.closest('#f-size,#f-liq,#f-fund,#f-fee,#f-exp')) calcTools(); if(e.target.closest('#f-j')) journalPreview(); });
document.addEventListener('submit',e=>{ e.preventDefault(); if(e.target.id==='f-j') saveTrade(); });
document.addEventListener('click',e=>{
  const an=e.target.closest('a.anchor'); if(an){ const url=location.href.split('#')[0]+'#'+an.dataset.copy; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(()=>toast('Link copied')).catch(()=>{}); }
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.qca!=null&&b.closest('.qc')){ const qc=b.closest('.qc'); if(qc.dataset.done) return; qc.dataset.done='1'; const [lid,slug]=qc.dataset.qc.split('/'); const sec=(((window.LESSONS||{})[lid]||{}).sections||[]).find(s=>s.id===slug); if(!sec) return; const pick=+b.dataset.qca, ans=sec.check.a; qc.querySelectorAll('.opt').forEach((o,i)=>{ o.disabled=true; if(i===ans) o.classList.add('right'); else if(i===pick) o.classList.add('wrong'); }); const f=qc.querySelector('.qf'); f.hidden=false; f.innerHTML=(pick===ans?'<b>Right.</b> ':'<b>Not quite.</b> The answer is '+['A','B','C','D'][ans]+'. ')+fmt(sec.check.why||''); return; }
  if(b.dataset.f){ mediaFilter=b.dataset.f; renderCurrent(); return; }
  if(b.dataset.del){ if(b.classList.contains('arm')){ deleteTrade(b.dataset.del); } else { b.classList.add('arm'); b.textContent='confirm delete'; setTimeout(()=>{ b.classList.remove('arm'); b.textContent='delete'; },3000); } return; }
  if(b.dataset.ql){ const l=LAYERS.find(x=>x.id===b.dataset.ql); const run=quizRun[l.id]; if(run.picks[run.i]!=null) return; run.picks[run.i]=+b.dataset.qo; rerenderQuiz(l); return; }
  if(b.dataset.qnext){ const l=LAYERS.find(x=>x.id===b.dataset.qnext); const run=quizRun[l.id]; run.i++; if(run.i>=l.quiz.length){ const score=run.picks.filter((p,qi)=>p===l.quiz[qi].a).length; state.quiz[l.id]=Math.max(state.quiz[l.id]||0,score); persistProgress(); updateNav(); updateTop(); const p=layerProgress(l); const bar=document.querySelector('.lesson .lp .bar i'); if(bar) bar.style.width=p.pct+'%'; const sp=document.querySelector('.lesson .lp span'); if(sp) sp.textContent=`${p.done} of ${p.total} complete`; } rerenderQuiz(l); return; }
  if(b.dataset.qretake){ const l=LAYERS.find(x=>x.id===b.dataset.qretake); quizRun[l.id]={i:0,picks:[]}; rerenderQuiz(l); return; }
});
window.addEventListener('hashchange',route);

/* ============================ BOOT ============================ */
loadLocal(); buildNav(); route(); tickStrip(); setInterval(tickStrip,1000); initDb();
