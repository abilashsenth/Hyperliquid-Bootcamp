<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A ten-layer manual perps-trading curriculum for Hyperliquid with a live market clock, calculators built on the docs' formulas, a vetted media track, quizzes and a trade journal.">
<title>Hyperliquid Workbench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230e9a86%27/%3E%3Cpath d=%27M9 9h4v5h6V9h4v14h-4v-5h-6v5H9z%27 fill=%27white%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: sticky course bar on top with overall progress; left rail with per-layer rings; one calm content column of lesson cards. Light-first, mint primary drawn from the venue's own palette. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef2f6; --ink:#0f1a2a; --muted:#5f6f82; --line:#e2e8f0; --line-2:#cbd5e1;
  --primary:#0e9a86; --primary-strong:#0b7f6e; --primary-ink:#ffffff; --primary-soft:#e3f6f1; --primary-glow:rgba(14,154,134,.18);
  --good:#15934f; --good-soft:#e5f6ec; --warn:#c07a0c; --warn-soft:#fdf1dc; --bad:#d0392b; --bad-soft:#fde8e5; --info:#3b5bdb; --info-soft:#e8ecfc;
  --shadow:0 1px 2px rgba(15,26,42,.05),0 10px 30px -12px rgba(15,26,42,.12);
  --shadow-lg:0 2px 4px rgba(15,26,42,.05),0 24px 60px -20px rgba(15,26,42,.22);
  --r:14px; --r-sm:10px;
  --sans:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1118; --surface:#121a24; --surface-2:#182230; --ink:#e7edf5; --muted:#93a3b6; --line:#243041; --line-2:#334257;
    --primary:#3dd6bc; --primary-strong:#5fe3cc; --primary-ink:#06211c; --primary-soft:#143a35; --primary-glow:rgba(61,214,188,.18);
    --good:#4ade80; --good-soft:#15301f; --warn:#fbbf24; --warn-soft:#3a2d0f; --bad:#f87171; --bad-soft:#3b1a17; --info:#8da2fb; --info-soft:#1b2347;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.5);
    --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 24px 60px -20px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1118; --surface:#121a24; --surface-2:#182230; --ink:#e7edf5; --muted:#93a3b6; --line:#243041; --line-2:#334257;
  --primary:#3dd6bc; --primary-strong:#5fe3cc; --primary-ink:#06211c; --primary-soft:#143a35; --primary-glow:rgba(61,214,188,.18);
  --good:#4ade80; --good-soft:#15301f; --warn:#fbbf24; --warn-soft:#3a2d0f; --bad:#f87171; --bad-soft:#3b1a17; --info:#8da2fb; --info-soft:#1b2347;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 24px 60px -20px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
a{color:var(--primary-strong);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
h1,h2,h3,h4{line-height:1.2;text-wrap:balance;margin:0;font-weight:800;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,2.6vw,2.15rem)}
h2{font-size:1.25rem}
h3{font-size:1.02rem;font-weight:700}
p{margin:.5rem 0}
ul,ol{margin:.4rem 0 .4rem 1.25rem;padding:0}
li{margin:.35rem 0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.note{color:var(--muted);font-size:.84rem;line-height:1.5}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(1.3) blur(12px);-webkit-backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--ink);white-space:nowrap}
.logo:hover{text-decoration:none}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary-strong));color:var(--primary-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:.78rem;box-shadow:0 6px 14px -6px var(--primary-glow)}
.cp{display:flex;align-items:center;gap:10px;flex:1;min-width:0;max-width:380px}
.cp .bar{flex:1}
.cp .pct{font-family:var(--mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.live{display:flex;gap:6px;margin-left:auto;flex-wrap:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:.76rem;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-family:var(--mono)}
.chip.accent{background:var(--primary-soft);color:var(--primary-strong)}
.chip .dotp{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
/* progress bar primitive */
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--primary-strong));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:5px}
.bar.good i{background:linear-gradient(90deg,var(--good),var(--primary))}
/* shell */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);gap:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;min-height:calc(100vh - 56px)}
.side{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 57px - env(safe-area-inset-top,0px));overflow:auto;padding:18px 14px 30px 0;border-right:1px solid var(--line)}
.side::-webkit-scrollbar{width:6px} .side::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sep{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 10px 6px}
.nav .sep:first-child{margin-top:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink);font-size:.9rem;font-weight:600;transition:background .15s}
.nav a:hover{background:var(--surface-2);text-decoration:none}
.nav a.active{background:var(--primary-soft);color:var(--primary-strong)}
.nav a .ring{flex:none}
.nav a .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav a .st{font-size:.68rem;font-weight:700;color:var(--muted)}
.nav a.active .st{color:var(--primary-strong)}
.nav a .ic{width:22px;height:22px;display:grid;place-items:center;color:var(--muted);flex:none}
.nav a.active .ic{color:var(--primary-strong)}
.main{min-width:0;padding:0 0 80px 32px}
.content{max-width:840px;padding-top:26px}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);margin:14px 0}
.card.flat{box-shadow:none}
.card.pad-sm{padding:14px 16px}
.sec{margin:26px 0}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.1rem}
.sec-h .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-strong);flex:none}
.sec-h .ico svg{width:16px;height:16px}
.sec-h .cnt{margin-left:auto;font-size:.78rem;color:var(--muted);font-family:var(--mono)}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(135deg,var(--primary-soft) 0%,var(--surface) 62%);border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:30px 30px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,var(--primary-glow),transparent 70%);pointer-events:none}
.hero h1{margin:6px 0 10px}
.hero p{max-width:60ch;color:var(--muted);margin:0 0 16px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;z-index:1}
.ringwrap .lbl{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ring{display:inline-grid;place-items:center;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none}
.ring .t{stroke:var(--surface-2)}
.ring .v{stroke:var(--primary);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring.done .v{stroke:var(--good)}
.ring .c{position:absolute;font-family:var(--mono);font-weight:600;color:var(--ink)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:.92rem;font-weight:700;padding:10px 16px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .12s,box-shadow .15s,background .15s;text-decoration:none}
.btn:hover{text-decoration:none;transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);box-shadow:0 8px 20px -8px var(--primary-glow)}
.btn.primary:hover{background:var(--primary-strong)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:.84rem;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.btn:focus-visible,.opt:focus-visible,.fchip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav a:focus-visible,.pathcard:focus-visible,.check:focus-within{outline:2px solid var(--primary);outline-offset:2px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .v{font-family:var(--mono);font-size:1.45rem;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tile .l{font-size:.78rem;color:var(--muted);font-weight:600}
.tile .bar{margin-top:4px}
/* learning path */
.path{list-style:none;margin:14px 0 0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:23px;top:28px;bottom:28px;width:2px;background:var(--line)}
.pathcard{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 12px;margin:10px 0;box-shadow:var(--shadow);color:var(--ink);position:relative;transition:transform .15s,box-shadow .15s}
.pathcard:hover{text-decoration:none;transform:translateX(2px);box-shadow:var(--shadow-lg)}
.pathcard .n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:600;background:var(--surface-2);color:var(--muted);border:2px solid var(--surface);position:relative;z-index:1}
.pathcard.done .n{background:var(--good);color:#fff}
.pathcard.next .n{background:var(--primary);color:var(--primary-ink);box-shadow:0 0 0 6px var(--primary-glow)}
.pathcard .t{font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pathcard .g{color:var(--muted);font-size:.86rem;margin-top:2px}
.pathcard .m{display:flex;align-items:center;gap:10px;margin-top:8px}
.pathcard .m .bar{flex:1;max-width:220px}
.pathcard .m span{font-size:.74rem;color:var(--muted);font-family:var(--mono)}
.pathcard .st{align-self:start}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.p{background:var(--primary-soft);color:var(--primary-strong)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}
/* lesson head */
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 28px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.lesson::after{content:"";position:absolute;right:-80px;bottom:-110px;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,var(--primary-glow),transparent 70%);pointer-events:none}
.lesson .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lesson h1{margin:8px 0 6px}
.lesson .lead{font-size:1.02rem;color:var(--muted);margin:0 0 14px;max-width:64ch}
.lesson .lp{display:flex;align-items:center;gap:12px}
.lesson .lp .bar{flex:1;max-width:360px}
.lesson .lp span{font-size:.78rem;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.callout{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);border-radius:var(--r);padding:16px 18px;margin:16px 0}
.callout .k{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--primary-strong);padding-top:3px;white-space:nowrap}
.callout .b{color:var(--ink);font-weight:500}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);margin:0;align-items:start}
.steps li:first-child{border-top:0}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:8px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-family:var(--mono);font-size:.74rem;font-weight:600;margin-top:2px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.link{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-weight:600;font-size:.9rem;transition:border-color .15s,transform .12s}
.link:hover{text-decoration:none;border-color:var(--primary);transform:translateY(-1px)}
.link .ic{width:20px;height:20px;color:var(--primary-strong);flex:none;margin-top:1px}
.link .ic svg{width:18px;height:18px}
.link small{display:block;font-weight:500;color:var(--muted);font-size:.76rem}
/* checklist */
.check{display:flex;gap:14px;align-items:flex-start;padding:13px 14px;border-radius:var(--r-sm);transition:background .15s;cursor:pointer}
.check:hover{background:var(--surface-2)}
.check+.check{border-top:1px solid var(--line)}
.check input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line-2);background:var(--surface);flex:none;margin:1px 0 0;cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s,transform .15s}
.check input::after{content:"";width:12px;height:7px;border:2.5px solid var(--primary-ink);border-top:0;border-right:0;transform:rotate(-45deg) scale(0);transition:transform .18s cubic-bezier(.2,.8,.2,1);margin-top:-3px}
.check input:checked{background:var(--good);border-color:var(--good)}
.check input:checked::after{transform:rotate(-45deg) scale(1)}
.check>span{cursor:pointer;flex:1}
.check.done>span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.passcard{display:grid;grid-template-columns:1fr;gap:10px;background:linear-gradient(135deg,var(--good-soft),var(--surface));border:1px solid color-mix(in srgb,var(--good) 35%,transparent)}
.passcard .k{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--good)}
/* media */
.media{display:grid;gap:10px}
.mcard{display:grid;grid-template-columns:6px 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.mcard .stripe{background:var(--muted)}
.mcard .stripe.video{background:var(--bad)} .mcard .stripe.podcast,.mcard .stripe.interview{background:var(--warn)} .mcard .stripe.research,.mcard .stripe.article,.mcard .stripe.case{background:var(--info)} .mcard .stripe.tool,.mcard .stripe.calendar{background:var(--good)} .mcard .stripe.book{background:var(--primary)} .mcard .stripe.official{background:var(--ink)}
.mcard .in{padding:13px 16px}
.mcard .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mcard .t{font-weight:800}
.mcard .by{color:var(--muted);font-size:.82rem}
.mcard .why{margin:.35rem 0 0;font-size:.92rem}
.mcard .flags{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:6px}
.mtype{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;transition:background .15s}
.fchip:hover{background:var(--surface-2)}
.fchip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* quiz */
.quiz .dots{display:flex;gap:6px;margin:4px 0 14px}
.quiz .dots i{width:28px;height:6px;border-radius:999px;background:var(--surface-2)}
.quiz .dots i.cur{background:var(--primary)} .quiz .dots i.ok{background:var(--good)} .quiz .dots i.no{background:var(--bad)}
.quiz .qt{font-weight:700;font-size:1.02rem;margin:4px 0 12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s,transform .12s}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:.74rem;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--primary);transform:translateY(-1px)}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin:12px 0 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fb .msg{font-weight:700}
.fb .msg.ok{color:var(--good)} .fb .msg.no{color:var(--bad)}
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.score .big{font-family:var(--mono);font-size:2rem;font-weight:600}
/* forms and tools */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 14px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:.76rem;font-weight:700;color:var(--muted);min-width:0;letter-spacing:.02em}
.form input,.form select,.form textarea{font:inherit;font-size:.95rem;font-weight:500;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;min-width:0;transition:border-color .15s}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-glow)}
.form textarea{min-height:64px;resize:vertical}
.form .wide{grid-column:1/-1}
.toolcard{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:22px}
.toolcard .form{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.out{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.out div{background:var(--surface-2);border-radius:10px;padding:9px 11px;min-width:0}
.out div b{display:block;font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.03em;margin-bottom:2px}
.out div span{font-family:var(--mono);font-size:.92rem;font-weight:600;word-break:break-word}
.out div.wide{grid-column:1/-1}
/* clock */
.evlist{display:grid;gap:0}
.ev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .n{font-weight:700}
.ev .n small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.ev .at{font-family:var(--mono);font-size:.8rem;color:var(--muted);white-space:nowrap;text-align:right}
.ev .in{font-family:var(--mono);font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary-strong);white-space:nowrap;justify-self:end}
.ev .in.soon{background:var(--warn-soft);color:var(--warn)}
.status{display:inline-flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 12%,transparent)}
.dot.on{background:var(--good)} .dot.off{background:var(--bad)} .dot.brk{background:var(--warn)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kv b{display:block;font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.03em}
.kv span{font-weight:700}
/* journal */
.jrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin:8px 0;box-shadow:var(--shadow)}
.jrow .d{font-family:var(--mono);color:var(--muted);font-size:.76rem}
.jrow .t{font-weight:800}
.jrow .meta{color:var(--muted);font-size:.84rem;margin-top:2px}
.jrow .r{font-family:var(--mono);font-weight:600;font-size:1.05rem;text-align:right}
.jrow .r.pos{color:var(--good)} .jrow .r.neg{color:var(--bad)}
.jrow .x{font:inherit;font-size:.74rem;font-weight:700;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0;justify-self:end}
.jrow .x.arm{color:var(--bad)}
.empty{color:var(--muted);padding:22px;border:1.5px dashed var(--line-2);border-radius:var(--r);text-align:center}
/* tables */
.tw{overflow-x:auto;margin:.6rem 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-weight:700;font-size:.74rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;background:var(--surface-2)}
td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
/* schedule */
.weeks{display:grid;gap:10px}
.week{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.week .wn{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-weight:600;color:var(--muted)}
.week.done .wn{background:var(--good);color:#fff}
.week .wt{font-weight:800}
.week .wg{color:var(--muted);font-size:.86rem}
.footnav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.86rem;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* lesson body: the chapter itself. Prose sits in one paper surface; figures and sandboxes are the only framed things inside it. */
.toc{margin:18px 0 10px;padding:16px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.toc .toc-h{font-weight:800;margin-bottom:6px}
.toc ol{margin:0;padding:0 0 0 22px;columns:2;column-gap:28px;font-size:.9rem}
.toc li{margin:3px 0;break-inside:avoid}
.toc li a{color:var(--ink);font-weight:600}
.toc li .tag{margin-left:6px;vertical-align:1px}
.toc .note{margin:8px 0 0}
.lsn{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 30px 18px;box-shadow:var(--shadow);margin:14px 0}
.lintro{font-size:1.05rem;color:var(--muted);margin:18px 0 6px;max-width:66ch;line-height:1.65}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:.84rem;color:var(--muted);margin:8px 0 4px}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .sw.bid{background:var(--good)} .legend .sw.ask{background:var(--bad)} .legend .sw.you{background:var(--info)}
.lsec{padding:26px 0 24px;border-top:1px solid var(--line);scroll-margin-top:76px}
.lsec:first-of-type{border-top:0}
.lsec h2{display:flex;align-items:baseline;gap:12px;font-size:1.32rem;margin:0 0 10px}
.lsec h2 .n{font-family:var(--mono);font-size:.78rem;font-weight:600;color:var(--primary-strong);background:var(--primary-soft);border-radius:8px;padding:3px 7px;line-height:1;flex:none;transform:translateY(-3px)}
.lsec h2 .ht{flex:1;min-width:0}
.lsec h2 .anchor{font-weight:600;color:var(--muted);opacity:0;transition:opacity .15s;font-size:1rem;padding:0 6px;flex:none}
.lsec:hover h2 .anchor,.lsec h2 .anchor:focus-visible{opacity:1}
@media (hover:none){ .lsec h2 .anchor{opacity:.6} }
.lsec p{max-width:68ch;font-size:1rem;line-height:1.72;margin:.6rem 0}
.lsec .lsteps{max-width:68ch;margin:10px 0}
.lsec .lsteps li{padding:9px 0}
.lsec code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.fig{margin:18px 0 6px;padding:14px 14px 12px;background:var(--surface-2);border-radius:14px}
.fig .fw{overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;min-width:min(100%,460px);color:var(--ink)}
.fig figcaption{font-size:.84rem;color:var(--muted);margin-top:10px;max-width:72ch;line-height:1.5}
.try{margin:18px 0 6px;border:1.5px solid color-mix(in srgb,var(--primary) 45%,transparent);border-radius:14px;overflow:hidden;background:var(--surface)}
.try .th{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--primary-soft);font-weight:800;font-size:.95rem}
.try .tb{padding:14px}
.try .tn{margin:0;padding:10px 14px;border-top:1px dashed var(--line);font-size:.84rem;color:var(--muted);line-height:1.5}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;margin-bottom:12px}
.ctrls label{display:flex;flex-direction:column;gap:5px;font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.ctrls label .mono{color:var(--ink);font-size:.86rem;font-weight:600}
.ctrls input[type=range]{accent-color:var(--primary);width:200px;max-width:100%;margin:4px 0}
.ctrls select,.ctrls input[type=text],.ctrls input[type=number]{font:inherit;font-size:.92rem;padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);min-width:0}
.ctrls input[type=text],.ctrls input[type=number]{width:150px}
.ctrls .btn{margin-bottom:2px}
.wrow{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px;align-items:start}
.wviz{overflow-x:auto}
.wviz svg{display:block;width:100%;height:auto;min-width:min(100%,320px);color:var(--ink);max-width:560px}
.wfull svg{max-width:none}
.readout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.readout div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.readout div.wide{grid-column:1/-1}
.readout b{display:block;font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.03em;margin-bottom:2px}
.readout span{font-family:var(--mono);font-size:.88rem;font-weight:600;word-break:break-word}
.readout span .tag{font-family:var(--sans)}
.wside .note{margin:10px 0 0}
.wlog{list-style:none;margin:10px 0 0;padding:0;font-size:.84rem;color:var(--muted)}
.wlog li{padding:4px 0;border-top:1px solid var(--line)}
.wlog li:first-child{border-top:0;color:var(--ink);font-weight:600}
.tape{list-style:none;margin:10px 0 0;padding:0;font-size:.82rem;max-height:160px;overflow:auto}
.tape li{display:flex;gap:10px;padding:3px 0;border-top:1px solid var(--line)}
.tape li.buy .mono:first-child{color:var(--good)} .tape li.sell .mono:first-child{color:var(--bad)}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
.checks li:first-child{border-top:0}
.checks li .m{font-weight:800;width:18px;flex:none}
.checks li.ok .m{color:var(--good)} .checks li.no .m{color:var(--bad)}
.verdict{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:700}
.verdict.ok{background:var(--good-soft);color:var(--good)} .verdict.no{background:var(--bad-soft);color:var(--bad)}
.key{margin:16px 0 0;padding:12px 16px;border-left:3px solid var(--primary);background:var(--primary-soft);border-radius:0 12px 12px 0;font-weight:700;max-width:68ch;line-height:1.5}
.qc{margin:16px 0 0;padding:14px 16px;border:1px dashed var(--line-2);border-radius:12px;max-width:68ch}
.qc .qh{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.qc .qq{font-weight:700;margin-bottom:10px}
.qc .opts{gap:6px}
.qc .opt{padding:9px 12px;font-size:.92rem}
.qc .qf{margin-top:10px;font-size:.92rem;line-height:1.5}
.qc .qf b{font-weight:800}
.btn.sm.ghost{border-color:transparent}
.codeblock{background:var(--surface-2);border-radius:12px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:.82rem;line-height:1.55;margin:14px 0;max-width:100%;white-space:pre}
.thesis{margin-top:8px;padding:12px 14px;border-radius:10px;background:var(--surface-2);font-weight:700;line-height:1.5}
.wlog .grade{font:inherit;font-size:.8rem;padding:3px 6px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);margin-left:6px}
.wlog .x{font:inherit;font-size:.74rem;border:0;background:transparent;color:var(--muted);cursor:pointer;margin-left:6px}
@media (max-width: 940px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 0 8px}
  .nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;flex:none;padding:7px 10px}
  .nav .sep{display:none}
  .nav a .st{display:none}
  .main{padding-left:0}
  .hero{grid-template-columns:1fr;padding:22px 20px}
  .hero .ringwrap{justify-self:start}
  .toolcard{grid-template-columns:1fr}
  .cp{display:none}
  .live .chip:nth-child(2){display:none}
  .lesson{padding:20px 18px}
  .toc ol{columns:1}
  .lsn{padding:4px 16px 12px}
  .lsec h2{font-size:1.15rem}
  .wrow{grid-template-columns:minmax(0,1fr)}
  .content,.wviz,.wside,.fig,.try,.lsec,.lsn,.toc{min-width:0}
  .fig{padding:10px}
}
@media (max-width: 520px){
  .live .chip:first-child{display:none}
  .topbar-in{gap:10px}
  .logo{min-width:0}
  .logo span:last-child{overflow:hidden;text-overflow:ellipsis}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

<script>

const MEDIA = {
  thiccy:{type:'article',t:'Perpetuals 101',by:'Thiccy (Substack), Jun 2023, 4 min',u:'https://thiccy.substack.com/p/perpetuals-101',v:'opened',why:'The cleanest short explanation of why a perp needs funding and how basis arbitrage pulls it back to the index. Read it before the Hyperliquid docs, then read the docs for the exact formulas.',flags:['No promotion, no paywall','One worked example has a $5 vs $1 typo; the logic is right']},

  wublock:{type:'interview',t:'Exclusive interview with Hyperliquid founder Jeff',by:'WuBlockchain (Colin Wu), 17 Aug 2025, text',u:'https://wublock.substack.com/p/exclusive-interview-with-hyperliquid',v:'opened',why:'Why the team is small, why there was no venture or market-maker deal, and why the core is meant to run itself. Explains the design choices you will trade against.',flags:['Free, no paywall seen']},
  empire:{type:'podcast',t:'Jeff Yan on Hyperliquid’s plan to bring all finance onchain, Empire',by:'Blockworks, 7 Oct 2026, about 30 min',u:'https://blockworks.com/podcast/empire/bc375300-c276-11f1-925c-cbee0c7ea3ff',v:'opened',why:'Institutional access, the cost of speed, options and whether transparent books give better execution. Listen after Odd Lots if you want the builder-side view.',flags:['Episode page carries conference discount codes; no product pitch in the content']},
  glassnode:{type:'research',t:'Inferring leveraged positioning from price and open interest',by:'Frederik Theissen, Glassnode Research, 3 Jul 2025, 8 min',u:'https://research.glassnode.com/leverage-position-openings-and-closures',v:'opened',why:'The OI matrix in Layer 6, done properly: long openings, long closures, short openings, short closures, with the caveats (short-side signals are weaker, the metric lags intraday). Free.',flags:['No paywall; newsletter prompt only']},
  arkham:{type:'case',t:'JELLYJELLY exploit on Hyperliquid',by:'Arkham Research, 26 Mar 2025',u:'https://info.arkm.com/research/jellyjelly-exploit-on-hyperliquid',v:'opened',why:'The forensic account of a self-liquidation attack: three accounts, a $4.1M short pushed onto HLP, and a delisting that settled everything at one price. The case study for how backstop liquidations and HLP exposure actually work.',flags:['Ends with a sign-up call to action; the research itself is the primary source']},

  k33:{type:'research',t:'Trading activity in bitcoin far higher during U.S. trading hours',by:'Vetle Lunde, K33 Research, 18 Jan 2022',u:'https://k33.com/research/archive/articles/trading-activity-in-bitcoin-far-higher-during-us-trading-hours',v:'opened',why:'Numbers behind the session map: US cash hours are under 30% of the day but carried 36% to 43% of spot volume, and about 40% even on weekends. Old, but the shape has not changed.',flags:['No promotion']},
  arxiv:{type:'research',t:'Intraday patterns in crypto: activity, volatility and spreads follow US hours',by:'arXiv 2109.12142 (academic paper, 2021)',u:'https://arxiv.org/pdf/2109.12142v2.pdf',v:'listed',why:'Academic confirmation that the highest activity, highest volatility and lowest spreads on US exchanges coincide with US market hours, and that European venues follow their own local time.',flags:['Seen in search results, not opened today']},

  nfp:{type:'calendar',t:'Employment Situation (nonfarm payrolls) schedule',by:'US Bureau of Labor Statistics',u:'https://www.bls.gov/schedule/news_release/empsit.htm',v:'opened',why:'08:30 ET, usually the first Friday. Loaded into the market clock through Dec 2027.',flags:[]},

  cg_hl:{type:'tool',t:'Hyperliquid whale tracker',by:'Coinglass',u:'https://www.coinglass.com/hyperliquid',v:'opened',why:'Large Hyperliquid positions, long/short ratios, unrealized PnL and funding paid, read straight from the chain.',flags:['Login prompts and Pro tier; the public view works']},

  explorer:{type:'tool',t:'Hyperliquid explorer',by:'Official app',u:'https://app.hyperliquid.xyz/explorer',v:'memory',why:'Every fill and liquidation, by address and block.',flags:[]},

const LAYERS = [
{id:'layer-0',n:0,name:'The order book',tag:'HTML',
 goal:'Read a live book and know, before you click, the price you will get and what it will cost.',
 surprise:'Most of what traders later call manipulation is just depth. A market order does not have a price. It has a path through the book.',
 concepts:[
  'Bid, ask, spread, mid. The spread is your first cost. On BTC it is usually one tick.',
  'Depth: the size resting at each level. A market order walks through levels, and the walk is slippage.',
  'Maker and taker. A limit order that rests is a maker and pays 0.015% at the base tier. Anything that crosses the spread is a taker and pays 0.045%. Market orders are always takers.',
  'Price-time priority: at one price, the earliest order fills first. Cancel and re-place and you go to the back of the queue.',
  'Tick and lot: prices must be multiples of the tick (perp prices carry at most 5 significant figures), sizes multiples of the lot, and every order is worth at least $10. Wrong rounding is rejected, not fixed.',
  'Candles and volume are the book’s history: a candle is the open, high, low and close of the trades in its window; volume is how much size crossed.'],
 read:[{t:'Order book (trading rules)',u:D('trading/order-book')},{t:'Order book under HyperCore (why it is on-chain, how orders are sequenced)',u:D('hypercore/order-book')},{t:'Tick and lot size',u:D('for-developers/api/tick-and-lot-size')}],
 media:['b_harris'],
 drills:['Open BTC, then HYPE, on testnet. Watch each book for 10 minutes. Write down the spread, the size at the top three levels, and how often the best bid changes.','Place a limit buy 1% below mid, then a market buy of the same size. Compare the fill price with the ask you saw, and the fee on each fill in trade history.','Place a Post Only buy at the best ask. The rejection message is the maker/taker line in one sentence.'],

{id:'layer-1',n:1,name:'Perpetuals',tag:'CSS',
 goal:'Know what a perp is as a contract, and compute notional, margin, entry price and PnL by hand.',
 surprise:'A perp is a futures contract that never settles. Funding, not expiry, keeps it near spot, and everything odd about perps follows from that one substitution.',
 concepts:[
  'Spot: you own the coin. Dated future: a contract to settle on a date; it trades above or below spot (the basis) and converges at expiry. Perp: a future with no date; an hourly payment between longs and shorts (Layer 3) replaces convergence.',
  'Long and short are symmetric. A short is a position whose PnL rises as price falls. Nothing is borrowed, nothing is lent.',
  'Notional = size × price. Margin = what you post. Leverage = notional / margin. On Hyperliquid leverage is an integer from 1 to the asset’s maximum (BTC 40x, ETH 25x, SOL 20x, HYPE and most alts 10x as of November 2026) and is checked only when you open.',
  'Entry price is the size-weighted average of your opening fills; closing fills never change it. Unrealized PnL = side × (mark − entry) × size, with side +1 for a long and −1 for a short. Closed PnL includes the fee.',
  'Collateral is USDC but most oracle prices are quoted in USDT, so contracts are technically quanto. That is the tiny permanent gap between mark and the spot price you see elsewhere.',
  'Why perps won crypto: no expiry to roll, one book per asset, leverage both ways, 24/7.'],
 read:[{t:'Perpetual assets',u:D('trading/perpetual-assets')},{t:'Contract specifications',u:D('trading/contract-specifications')},{t:'Entry price and PnL',u:D('trading/entry-price-and-pnl')},{t:'Hyperliquid 101 for non-crypto audiences',u:D('about-hyperliquid/hyperliquid-101-for-non-crypto-audiences')}],
 media:['thiccy','oddlots','wublock','empire'],
 drills:['Open a 0.01 BTC long and a 0.5 SOL short at 3x on testnet. Before looking at the position panel, compute notional, margin, and PnL at +1% and −1%. Check.','Add to the long at a different price. Recompute the entry price by hand. Check.','Close half the long. Confirm the entry price did not move and that closed PnL includes the fee.'],

  {q:'A perp differs from a dated future mainly because:',o:['It settles every day','It has no expiry and funding keeps it near spot','It allows less leverage'],a:1},
  {q:'Notional of 0.5 BTC at $80,000:',o:['$160,000','$20,000','$40,000'],a:2},
  {q:'Your entry price changes on:',o:['Opening fills','Funding payments','Closing fills'],a:0},
  {q:'Unrealized PnL on Hyperliquid is computed from:',o:['Last trade','Mark price','Oracle price'],a:1},

{id:'layer-2',n:2,name:'The Hyperliquid machine',tag:'JavaScript',

 orders:[['Market','Fills now against the book','Always a taker; set your slippage tolerance'],['Limit (GTC)','Rests until filled or cancelled','Maker if it rests, taker if it crosses'],['Post Only (ALO)','Rests, or is rejected','Never pays the taker fee'],['IOC','Fills what it can now, cancels the rest','The honest market order'],['Reduce Only','Can only shrink a position','Use it on every exit'],['Stop market / stop limit','Fires when mark hits the trigger','Buy stops sit above the mid, sell stops below'],['Take market / take limit','Fires when mark hits the trigger','Buy takes sit below the mid, sell takes above'],['TP/SL on a position','Market order on trigger, 10% slippage tolerance, mark-triggered','Market unless you have a reason; a limit TP/SL caps slippage but may not fill'],['Trailing stop','Follows the best mark by a distance or percent','Perps only; never moves backwards'],['Scale','A ladder of limits across a price range','Spreads entries without babysitting'],['TWAP','Slices every 30 s or more, 5 min to 7 days, $100 minimum, 3% slippage per slice','Catch-up slices grow to 3x; pauses during network upgrades'],['Chase','Post Only that re-prices to sit one tick inside the best bid or ask (at it when the spread is one tick)','Runs in your browser tab; 5 at a time']],
 fees:'0.045% taker and 0.015% maker at tier 0; spot 0.07% and 0.04%. Tiers step at $5M, $25M, $100M, $500M, $2B and $7B of 14-day volume (spot counts double), recomputed at the end of each UTC day. Staking HYPE discounts fees from 5% (more than 10 HYPE) to 40% (more than 500,000). A referral code discounts your first $25M of volume. Fees go to HLP and the assistance fund, not to a team.',
 concepts:[],

{id:'layer-3',n:3,name:'Prices and funding',tag:'',
 goal:'Know which of the three prices does what, and compute what a position costs to hold.',
 surprise:'Your stop can fire at a price that never traded here. Triggers and liquidations use mark, and mark is built mostly from other exchanges.',
 concepts:[
  'Oracle price: every validator publishes, about every 3 seconds, a weighted median of spot prices on Binance (weight 3), OKX (2), Bybit (2), Kraken, KuCoin, Gate, MEXC and Hyperliquid (1 each). Used for funding and as one input to mark.',
  'Mark price: the median of three inputs. The oracle plus a 150-second average of Hyperliquid’s own premium; the median of best bid, best ask and last trade here; and a weighted median of the large centralised exchanges’ (CEX) perp prices. Mark drives liquidations, TP/SL triggers and unrealized PnL.',
  'Mid and last: what the book shows. They can sit a few ticks from mark for minutes at a time.',
  'Funding: paid every hour on the hour as one eighth of an 8-hour rate. Rate = premium + clamp(0.01% − premium, −0.05%, +0.05%). The premium is sampled every 5 seconds and averaged over the hour, measured on impact prices (what 20,000 USDC of BTC or ETH, or 6,000 USDC of anything else, would move the book). Positive means longs pay shorts. Capped at 4% an hour. Paid on oracle notional, peer to peer, no fee taken. When the book sits at the oracle the rate is 0.00125% an hour, about 11% a year paid by longs.',
  'Open interest: total size held, counted once for both sides. It is the how-many-people-are-positioned counter; Layer 6 reads it together with price.',
  'Premium, or basis: perp price minus oracle. A persistent premium means crowded longs and expensive carry.',
  'Hyperps: pre-launch perps with no external oracle; mark is an 8-hour average of their own prints. A different animal. Leave them until you have a positive 20-trade block.'],
 read:[{t:'Robust price indices (mark price)',u:D('trading/robust-price-indices')},{t:'Oracle',u:D('hypercore/oracle')},{t:'Funding',u:D('trading/funding')},{t:'Contract specifications',u:D('trading/contract-specifications')},{t:'Hyperps',u:D('trading/hyperps')}],
 media:['cg_fund','screener'],
 drills:['For BTC and one alt, write down the hourly funding for 24 hours from the funding history tab. Compute what a $1,000 long would have paid (the funding tool on the Tools page does the arithmetic).','Find a moment where mark and last differ by more than a tick and name which input moved.','Hold a 1x long on testnet across a funding print and watch the payment land at :00 UTC.'],
 pass:'You can state what a position pays per day at today’s rate, and which price would trigger your stop.',
 quiz:[
  {q:'Hyperliquid pays funding every:',o:['Hour','Day','8 hours'],a:0},
  {q:'Positive funding means:',o:['Shorts pay longs','Longs pay shorts','The exchange pays both'],a:1},
  {q:'The funding payment is computed on:',o:['Entry notional','Mark notional','Oracle notional'],a:2},
  {q:'Mark price is:',o:['The median of three inputs including other exchanges’ prices','The best bid','The last trade'],a:0},
  {q:'The fixed interest component of funding, per 8 hours:',o:['1%','0.01%','0.1%'],a:1}]},
{id:'layer-4',n:4,name:'Margin, liquidation and sizing',tag:'React',
 goal:'Never be surprised by a liquidation, and size every trade from risk rather than from leverage.',
 surprise:'Leverage does not change how much you make on a move. It changes how far away the cliff is.',
 concepts:[
  'Initial margin = notional / leverage. Maintenance margin = half the initial margin at the asset’s maximum leverage: 1.25% of notional on a 40x asset like BTC, 2% on 25x, 2.5% on 20x, 5% on 10x, up to 16.7% on 3x.',
  'Cross: all your USDC backs all cross positions, so one bad position can take the account. Isolated: only the margin you assigned, and a liquidation touches only that position. Learn on isolated.',
  'Liquidation price, isolated: liq = entry − side × margin_available ÷ size ÷ (1 − side × maintenance rate), where margin_available = margin posted − maintenance margin, side is +1 for a long and −1 for a short, and the maintenance rate is 1.25% on BTC. As a distance from the entry: (1 ÷ leverage − maintenance) ÷ (1 − maintenance) for a long and ÷ (1 + maintenance) for a short. A 5x BTC long liquidates about 19% below the entry, a 10x long about 9%, a 10x short about 8.6% above. The Tools page runs this for you.',
  'How a liquidation runs, all on mark price: equity below maintenance, and the engine sends a market order for the whole position (20% slices with a 30-second cooldown above 100k USDC, 10k on testnet). If equity falls below two thirds of maintenance, the backstop liquidator, a part of HLP, takes the position and its margin, and the maintenance margin is not returned. No clearance fee.',
  'ADL: if the backstop cannot absorb a position, the most profitable and most levered positions on the other side are closed against it at mark. You can be closed while winning. No position means no exposure.',
  'Unrealized profit is withdrawable only while remaining margin is at least the larger of initial margin and 10% of notional.',
  'Sizing: choose the stop first. Risk per trade = 0.5% to 1% of the account. Size = risk / distance to stop. Leverage is an output, not an input. Keep liquidation at least three times further away than the stop.'],
 read:[{t:'Margining',u:D('trading/margining')},{t:'Margin tiers',u:D('trading/margin-tiers')},{t:'Liquidations',u:D('trading/liquidations')},{t:'Auto-deleveraging',u:D('trading/auto-deleveraging')},{t:'FAQ: Why was I liquidated?',u:D('support/faq/trade-outcome-looks-incorrect/why-was-i-liquidated')},{t:'FAQ: How does margining work?',u:D('support/faq/trade-outcome-looks-incorrect/how-does-margining-work')}],
 media:['arkham'],
 drills:['Isolated, $20 margin, 10x short on a volatile alt, on testnet. Compute the liquidation price first. Let it happen. Compare the fill, what margin came back, and how long it took.','Rebuild the same idea as a sized trade: 1% risk, stop 2% away. Note how different the position looks.','Switch a position from cross to isolated and back. Note what the UI does to margin each way.'],
 pass:'You state liquidation price, dollars at risk and stop distance for every trade before you send it.',
 quiz:[
  {q:'Maintenance margin on an asset whose maximum leverage is 40x:',o:['2.5%','1.25%','0.5%'],a:1},
  {q:'In cross margin, a liquidation can:',o:['Do nothing to margin','Only touch that position','Take all cross positions and the cross margin'],a:2},
  {q:'The backstop liquidator takes over when equity falls below:',o:['Two thirds of maintenance margin','Half of initial margin','Maintenance margin'],a:0},
  {q:'Auto-deleveraging can close:',o:['Only losing positions','Profitable positions on the other side','Only HLP’s positions'],a:1},
  {q:'Risk $10 with a stop 2% away. Notional:',o:['$1,000','$200','$500'],a:2}]},
{id:'layer-5',n:5,name:'Time, sessions and timezones',tag:'',
 goal:'Know what hour it is in the market, what happens at :00, and which scheduled events can move your position.',
 surprise:'Crypto trades 24/7 but is moved by things on clocks. Hourly funding, the 00:00 UTC daily close, the US cash open, the CME weekend, Friday 08:00 UTC options expiry and 08:30 ET data releases give most days their shape.',
 concepts:[
  'Exchanges run on UTC. IST is UTC+5:30 all year. US clocks move twice a year (in 2026 daylight time ran from 8 March to 1 November), so every US-anchored event shifts by an hour in IST while funding and UTC levels stay put. London moves too. Tokyo and India never move.',
  'Funding settles every hour at :00 UTC, which is :30 past the hour in IST. Whoever holds a position at that second pays or receives.',
  'Fee tier is recomputed at the end of each UTC day (05:30 IST) on rolling 14-day volume.',
  'The daily candle closes at 00:00 UTC (05:30 IST), the most watched level in crypto. Binance and Bybit pay funding then too, and at 08:00 and 16:00 UTC (some pairs every 4 hours); flows around those prints spill into every venue.',
  'Network upgrades are announced on Discord and X. During the upgrade window only Post Only orders are accepted and nothing matches; TWAP slices pause.',
  'Sessions as regimes: Asia (00:00 to 08:00 UTC) is usually the quietest. Europe (07:00 to 16:00 UTC) builds. The US cash session (from the 09:30 ET open, 14:30 UTC in winter and 13:30 in summer, to the 16:00 ET close) carries the most volume and the macro moves; the Europe/US overlap, roughly 19:00 to 22:00 IST depending on the season, is the loudest stretch of the day. Weekends are thin: bigger wicks on less size.',
  'CME is closed from Friday night to Sunday night, so bitcoin’s Monday open on CME often sits away from Friday’s close, the CME gap that traders watch.',
  'HIP-3 stock, index and commodity perps trade 24/7 while their underlyings are closed. The deployer’s oracle freezes or drifts with the book, premiums and funding build, and both snap at the underlying’s open. Do not hold one through an open unless that is the trade (Layer 8).'],
 calendar:[['Hyperliquid funding','every :00','every :30','every :30'],['Daily close, Binance/Bybit funding, Tokyo open','00:00','05:30','05:30'],['NSE India session','03:45 to 10:00','09:15 to 15:30','09:15 to 15:30'],['London open','08:00 (07:00 summer)','13:30','12:30'],['Binance/Bybit funding','08:00, 16:00','13:30, 21:30','13:30, 21:30'],['Deribit options expiry (Fridays; monthly on the last Friday)','08:00','13:30','13:30'],['US CPI and NFP (08:30 ET)','13:30 (12:30 summer)','19:00','18:00'],['NYSE open (09:30 ET)','14:30 (13:30 summer)','20:00','19:00'],['FOMC statement (14:00 ET), press conference 30 min later','19:00 (18:00 summer)','00:30 next day','23:30'],['NYSE close (16:00 ET)','21:00 (20:00 summer)','02:30 next day','01:30 next day'],['CME daily break (16:00 to 17:00 CT)','22:00 to 23:00 (21:00 to 22:00 summer)','03:30 to 04:30','02:30 to 03:30'],['CME weekly close, Friday (16:00 CT)','22:00 (21:00 summer)','03:30 Saturday','02:30 Saturday'],['CME weekly open, Sunday (17:00 CT)','23:00 (22:00 summer)','04:30 Monday','03:30 Monday']],
 read:[{t:'Funding (the hourly cadence)',u:D('trading/funding')},{t:'Fees (the UTC day)',u:D('trading/fees')}],
 media:['k33','arxiv','nyse','cme','cpi','nfp','fomc','ff'],
 drills:['Put the calendar into your own calendar as recurring events in IST, plus this month’s CPI, NFP and FOMC dates (the Market clock page lists the next ones).','Sit through one US open and one 00:00 UTC close on the 1-minute BTC chart with the book open. Note spread and range before, during and after.','Hold a small testnet position across a Friday 08:00 UTC expiry and a weekend. Note Monday’s CME gap.'],

  {q:'Hyperliquid funding settles at:',o:['00:00, 08:00 and 16:00 UTC','08:00 UTC daily',':00 UTC every hour'],a:2},
  {q:'IST is:',o:['UTC+5:30','UTC+4:30','UTC+5'],a:0},
  {q:'NYSE opens, in IST, during US winter time:',o:['19:00','20:00','21:00'],a:1},

{id:'layer-6',n:6,name:'Reading the market',tag:'',
 goal:'Form a one-sentence thesis from the chart, the book, open interest and funding, and know what would prove it wrong.',
 surprise:'On Hyperliquid the positioning data other venues hide is public. Who is long, how levered, and where they get liquidated is on-chain, and the explorers show it.',
 concepts:[
  'Timeframes: daily for context, 4-hour for structure, 1-hour for timing, 5- and 15-minute for entries. The higher timeframe wins a disagreement.',
  'Structure: higher highs and higher lows make an uptrend; the last higher low is the invalidation. Support and resistance are zones where the book got heavy before. Prior daily closes at 00:00 UTC matter most.',
  'Volume confirms: a break on rising volume holds more often than one on thin volume. Weekend breaks are suspect.',
  'The OI matrix. Price up with OI up: new longs, a trend that is also crowding. Price up with OI down: shorts covering, fuel running out. Price down with OI up: new shorts. Price down with OI down: longs liquidating, often the end of a move. Funding tells you who is paying to stay.',
  'Liquidation levels: leveraged positions cluster at round leverage and get liquidated in clusters, so price is drawn to them. Heatmaps estimate the clusters; the trades tape and explorers show the prints.',
  'Hyperliquid tells: the funding history tab, open interest in the asset header, the leaderboard, and the largest positions on the explorers.'],
 read:[{t:'Portfolio graphs',u:D('trading/portfolio-graphs')},{t:'Miscellaneous UI',u:D('trading/miscellaneous-ui')}],

function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function loadLocal(){ const p=lsGet('hlwb.progress'); if(p){ state.items=p.items||{}; state.quiz=p.quiz||{}; } const j=lsGet('hlwb.journal'); if(Array.isArray(j)) state.journal=j; }
function persistProgress(){ lsSet('hlwb.progress',{items:state.items,quiz:state.quiz}); if(!db) return; dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flushProgress,500); }
async function flushProgress(){ if(saving||!dirty||!db) return; saving=true; dirty=false; try{ await progressRef.set({items:state.items,quiz:state.quiz,updatedAt:new Date().toISOString()}); }catch(e){ toast('Could not save to the store; kept locally'); } saving=false; if(dirty) flushProgress(); }
function toggleItem(id,on){ if(on) state.items[id]=true; else delete state.items[id]; persistProgress(); updateNav(); updateTop(); }

async function initDb(){
  try{
    if(!window.claude||!window.claude.use) return;
    db=await claude.use('db'); if(!db) return;
    state.dbMode='db'; progressRef=db.doc('progress/main'); journalCol=db.collection('journal');
    let t=setTimeout(()=>{ toast('Store not reached yet; showing the local copy'); },10000);
    progressRef.onSnapshot(snap=>{ if(!snap.metadata.fromCache) clearTimeout(t); if(snap.exists){ const d=snap.data(); state.items=d.items||{}; state.quiz=d.quiz||{}; lsSet('hlwb.progress',{items:state.items,quiz:state.quiz}); renderCurrent(); } },err=>{ clearTimeout(t); state.dbMode='local'; });
    journalCol.orderBy('ts','desc').limit(400).onSnapshot(snap=>{ state.journal=snap.docs.map(d=>Object.assign({id:d.id},d.data())); lsSet('hlwb.journal',state.journal); if(current==='journal'||current==='overview') renderCurrent(); },err=>{ state.dbMode='local'; });
    updateDbBadge();
  }catch(e){ db=null; }
}
function dbText(){ return state.dbMode==='db'?'Progress and the journal are saved to this page’s store and follow you across devices.':'Progress and the journal are saved in this browser only.'; }

/* ============================ HELPERS ============================ */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* Mini markup for lesson prose: **bold**, `code`, [text](url). Escaped first, so the data cannot inject markup. */
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>`<a href="${u}"${/^https?:/.test(u)?' target="_blank" rel="noopener"':''}>${t}</a>`); }
const PAL = (typeof FigLib!=='undefined') ? FigLib.pal('css') : null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtMoney(x,d=2){ if(!isFinite(x)) return '—'; return (x<0?'-':'')+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtPct(x,d=2){ if(!isFinite(x)) return '—'; return x.toFixed(d)+'%'; }
function fmtNum(x,d=4){ if(!isFinite(x)) return '—'; return x.toLocaleString('en-US',{maximumFractionDigits:d}); }
function ring(pct,size,stroke,label){ const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.min(100,Math.max(0,pct))/100); const fs=Math.max(10,Math.round(size/4.2)); return `<span class="ring ${pct>=100?'done':''}" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle class="t" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/><circle class="v" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/></svg>${label!==false?`<span class="c" style="font-size:${fs}px">${Math.round(pct)}%</span>`:''}</span>`; }
const fmtCache={};
function zfmt(tz){ return fmtCache[tz]||(fmtCache[tz]=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short',timeZoneName:'short'})); }
function zparts(d,tz){ const o={}; for(const p of zfmt(tz).formatToParts(d)) o[p.type]=p.value; return {y:+o.year,m:+o.month,d:+o.day,h:+o.hour,mi:+o.minute,s:+o.second,wd:o.weekday,tzn:o.timeZoneName}; }
function tzOffsetMin(d,tz){ const p=zparts(d,tz); const asUtc=Date.UTC(p.y,p.m-1,p.d,p.h,p.mi,p.s); return Math.round((asUtc-d.getTime())/60000); }
function zonedToUtc(y,m,d,h,mi,tz){ let g=Date.UTC(y,m-1,d,h,mi); for(let i=0;i<2;i++){ const off=tzOffsetMin(new Date(g),tz); g=Date.UTC(y,m-1,d,h,mi)-off*60000; } return new Date(g); }
function istStr(d,withDate){ const p=zparts(d,'Asia/Kolkata'); return (withDate?`${p.wd} ${pad(p.d)}/${pad(p.m)} `:'')+`${pad(p.h)}:${pad(p.mi)}`; }
function utcStr(d,withDate){ return (withDate?`${pad(d.getUTCDate())}/${pad(d.getUTCMonth()+1)} `:'')+`${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; }
function countdown(ms){ if(ms<0) ms=0; const s=Math.floor(ms/1000); const dd=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60), ss=s%60; if(dd>0) return `${dd}d ${pad(h)}h ${pad(m)}m`; if(h>0) return `${pad(h)}:${pad(m)}:${pad(ss)}`; return `${pad(m)}:${pad(ss)}`; }

/* ============================ MARKET CLOCK ============================ */
function nextTopOfHour(now){ const d=new Date(now); d.setUTCMinutes(0,0,0); d.setUTCHours(d.getUTCHours()+1); return d; }
function nextUtcHours(now,hours){ const base=new Date(now); base.setUTCMinutes(0,0,0); for(let i=0;i<30;i++){ const d=new Date(base.getTime()+i*3600000); if(d>now && hours.includes(d.getUTCHours())) return d; } return null; }
function nextDailyClose(now){ const d=new Date(now); d.setUTCHours(24,0,0,0); return d; }
function sessionLabel(now){ const wd=now.getUTCDay(); const h=now.getUTCHours()+now.getUTCMinutes()/60; if(wd===6||wd===0) return 'Weekend (thin books, CME closed)'; if(h<7) return 'Asia'; if(h<13.5) return 'Europe'; if(h<16) return 'Europe/US overlap (loudest)'; if(h<21) return 'US cash session'; return 'Late US (post-close)'; }
function nyseStatus(now){ const p=zparts(now,'America/New_York'); const mins=p.h*60+p.mi; const wk=['Mon','Tue','Wed','Thu','Fri'].includes(p.wd); const open = wk && mins>=570 && mins<960; let d=new Date(now); let next=null; for(let i=0;i<8;i++){ const q=zparts(d,'America/New_York'); const cand=zonedToUtc(q.y,q.m,q.d,9,30,'America/New_York'); if(cand>now && ['Mon','Tue','Wed','Thu','Fri'].includes(zparts(cand,'America/New_York').wd)){ next=cand; break; } d=new Date(d.getTime()+86400000); } let close=null; if(open){ close=zonedToUtc(p.y,p.m,p.d,16,0,'America/New_York'); } return {open,next,close,tzn:p.tzn}; }
function cmeStatus(now){ const p=zparts(now,'America/Chicago'); const mins=p.h*60+p.mi; const wd=p.wd; let open=false, label=''; if(wd==='Sat'){ open=false; label='Weekend close'; } else if(wd==='Sun'){ open = mins>=1020; label= open?'Open (Sunday session)':'Weekend close'; } else if(wd==='Fri'){ open = mins<960; label= open?'Open':'Weekend close'; } else { if(mins>=960 && mins<1020){ open=false; label='Daily maintenance break'; } else { open=true; label='Open'; } } let nextAt=null, nextLabel=''; const mk=(dayOffset,h,m)=>{ const d=new Date(now.getTime()+dayOffset*86400000); const q=zparts(d,'America/Chicago'); return zonedToUtc(q.y,q.m,q.d,h,m,'America/Chicago'); }; for(let i=0;i<8 && !nextAt;i++){ const d=new Date(now.getTime()+i*86400000); const q=zparts(d,'America/Chicago'); const cands=[]; if(['Mon','Tue','Wed','Thu'].includes(q.wd)){ cands.push([mk(i,16,0),'Daily break starts'],[mk(i,17,0),'Reopens']); } if(q.wd==='Fri'){ cands.push([mk(i,16,0),'Weekly close']); } if(q.wd==='Sun'){ cands.push([mk(i,17,0),'Weekly open']); } cands.sort((a,b)=>a[0]-b[0]); for(const c of cands){ if(c[0]>now){ nextAt=c[0]; nextLabel=c[1]; break; } } } return {open,label,nextAt,nextLabel,tzn:p.tzn}; }
function nextDeribit(now){ const d=new Date(now); d.setUTCHours(8,0,0,0); while(d<=now||d.getUTCDay()!==5) d.setUTCDate(d.getUTCDate()+1); const m=d.getUTCMonth(); const n=new Date(d); n.setUTCDate(n.getUTCDate()+7); return {at:d,monthly:n.getUTCMonth()!==m}; }
function nextRelease(list,h,mi){ const now=new Date(); for(const s of list){ const [y,m,d]=s.split('-').map(Number); const at=zonedToUtc(y,m,d,h,mi,'America/New_York'); if(at>now) return at; } return null; }
function usDst(now){ const p=zparts(now,'America/New_York'); return p.tzn==='EDT'?'Daylight time (EDT, UTC−4)':'Standard time (EST, UTC−5)'; }

uthor history.'],['Link rot and summary farms','A well-cited Mirador Finance piece on backstop liquidations now redirects to an expired-domain page. Video summary sites (recapio, chattube, videohighlight) outrank the Mark Douglas seminar itself.','If the source is gone, the summaries of it are not evidence. Go to the recording.'],['Course funnels','Adam Grimes’ once-free "Art and Science of Trading" course now sits inside a subscription site with a $7 trial and $97 to $172 monthly plans. The book stays on the list; the site does not.','"Free" leads to a trial. Anything that needs a card number to learn the basics is a funnel.'],['Dashboard upsells','HyperTracker: the free wallet dashboard is genuinely useful, so it stays, flagged; its landing page sells an API from $179 a month with unsourced claims.','Use the free view, ignore the pricing page, never pay for "alpha alerts".'],['Harmless but noted','Blockworks podcasts carry conference discount codes; Arkham’s post-mortem ends with a sign-up button; Coinglass has a Pro tier. Kept, with the flag on the card.','A promo for the publisher’s own event is not a reason to lose a good episode.']];
