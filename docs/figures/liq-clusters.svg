<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-label="A vertical price axis with clusters of estimated liquidation levels above and below the current price at round leverage multiples; price is drawn being pulled toward the nearest cluster" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="249" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg56-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg56-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg56-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg56-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg56-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg56-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg56-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><line x1="300" y1="30" x2="300" y2="220" style="stroke:#6a6b6b;stroke-width:2;stroke-linecap:round"/><circle cx="300" cy="125" r="6" style="fill:#00b3dd"/><text x="314" y="129" style="fill:#00b3dd;font-size:11px;font-weight:700">price now</text><rect x="282" y="44.79" width="36" height="10" rx="3" style="fill:#f47067;opacity:0.7"/><text x="272" y="53.79" text-anchor="end" style="fill:#f47067;font-size:10.5px;font-weight:700">shorts at ~10x</text><rect x="270" y="82" width="60" height="10" rx="3" style="fill:#f47067;opacity:0.7"/><text x="260" y="91" text-anchor="end" style="fill:#f47067;font-size:10.5px;font-weight:700">shorts at ~20x</text><rect x="268" y="155.63" width="64" height="10" rx="3" style="fill:#4fce8f;opacity:0.7"/><text x="258" y="164.63" text-anchor="end" style="fill:#4fce8f;font-size:10.5px;font-weight:700">longs at ~20x</text><rect x="280" y="191.25" width="40" height="10" rx="3" style="fill:#4fce8f;opacity:0.7"/><text x="270" y="200.25" text-anchor="end" style="fill:#4fce8f;font-size:10.5px;font-weight:700">longs at ~10x</text><rect x="290" y="135.83" width="20" height="10" rx="3" style="fill:#4fce8f;opacity:0.7"/><text x="280" y="144.83" text-anchor="end" style="fill:#4fce8f;font-size:10.5px;font-weight:700">longs at ~40x</text><line x1="340" y1="113" x2="340" y2="168.63" marker-end="url(#fg56-muted)" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><text x="350" y="144.83" style="fill:#9f9fa0;font-size:10.5px">the nearest big cluster is below: a dip there</text><text x="350" y="158.83" style="fill:#9f9fa0;font-size:10.5px">forces sellers to sell, which is why price gets pulled to it</text><text x="20" y="240" style="fill:#9f9fa0;font-size:10.5px">bar width = estimated size that would be liquidated there. Heatmaps estimate; the explorers show the real prints afterwards.</text></svg>