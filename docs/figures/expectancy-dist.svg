<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" role="img" aria-label="A histogram of the total R earned in two hundred simulated blocks of twenty trades for a system that wins forty-five percent of the time with two-R winners and one-R losers; most blocks are positive, a meaningful minority are negative" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="279" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg61-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg61-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg61-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg61-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg61-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg61-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg61-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><rect x="64" y="201.9" width="42.91" height="8.1" rx="4" style="fill:#f47067;opacity:0.8"/><text x="85.45" y="226" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:9.5px">-14R</text><rect x="114.91" y="185.71" width="42.91" height="24.29" rx="4" style="fill:#f47067;opacity:0.8"/><text x="136.36" y="226" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:9.5px">-10R</text><rect x="165.82" y="153.33" width="42.91" height="56.67" rx="4" style="fill:#f47067;opacity:0.8"/><text x="187.27" y="226" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:9.5px">-6R</text><rect x="216.73" y="104.76" width="42.91" height="105.24" rx="4" style="fill:#f47067;opacity:0.8"/><text x="238.18" y="226" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:9.5px">-2R</text><rect x="267.64" y="56.19" width="42.91" height="153.81" rx="4" style="fill:#4fce8f;opacity:0.8"/><text x="289.09" y="226" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:9.5px">+2R</text><rect x="318.55" y="40" width="42.91" height="170" rx="4" style="fill:#4fce8f;opacity:0.8"/><text x="340" y="226" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:9.5px">+6R</text><rect x="369.45" y="72.38" width="42.91" height="137.62" rx="4" style="fill:#4fce8f;opacity:0.8"/><text x="390.91" y="226" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:9.5px">+10R</text><rect x="420.36" y="120.95" width="42.91" height="89.05" rx="4" style="fill:#4fce8f;opacity:0.8"/><text x="441.82" y="226" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:9.5px">+14R</text><rect x="471.27" y="169.52" width="42.91" height="40.48" rx="4" style="fill:#4fce8f;opacity:0.8"/><text x="492.73" y="226" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:9.5px">+18R</text><rect x="522.18" y="189.76" width="42.91" height="20.24" rx="4" style="fill:#4fce8f;opacity:0.8"/><text x="543.64" y="226" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:9.5px">+22R</text><rect x="573.09" y="205.95" width="42.91" height="4.05" rx="4" style="fill:#4fce8f;opacity:0.8"/><text x="594.55" y="226" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:9.5px">+26R</text><line x1="60" y1="210" x2="620" y2="210" style="stroke:#6a6b6b;stroke-width:1.5;stroke-linecap:round"/><text x="60" y="26" style="fill:#f5f5f7;font-size:11px;font-weight:700">total R per block of 20 trades · 45% win rate · winners +2R · losers −1R · expectancy +0.35R per trade, +7R per block</text><text x="60" y="248" style="fill:#9f9fa0;font-size:10.5px">about one block in seven loses money even though the system is sound. One trade says nothing; one block says a little; three blocks say something.</text><text x="60" y="266" style="fill:#00b3dd;font-size:10.5px;font-weight:700">the sandbox runs this simulation live with your own numbers</text></svg>