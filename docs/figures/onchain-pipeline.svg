<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" role="img" aria-label="An order travels from your wallet into a block, where the chain sorts other actions first, then cancels, then new orders, into the HyperCore book, where it matches after a second margin check, and the committed result returns to you while positions, fills and liquidations become public state" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="240" rx="12" style="fill:#ffffff"/><defs><marker id="fg11-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg11-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg11-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg11-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg11-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg11-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg11-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><rect x="16" y="70" width="96" height="70" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.2"/><text x="64" y="92" text-anchor="middle" style="fill:#0f1a2a;font-size:12px;font-weight:800">you</text><text x="64" y="109" text-anchor="middle" style="fill:#5f6f82;font-size:11px">sign an action</text><text x="64" y="124" text-anchor="middle" style="fill:#5f6f82;font-size:11px">no gas</text><line x1="112" y1="105" x2="150" y2="105" marker-end="url(#fg11-ink)" style="stroke:#0f1a2a;stroke-width:1.5;stroke-linecap:round"/><rect x="152" y="30" width="200" height="150" rx="12" style="fill:#eef2f6;stroke:#cbd5e1;stroke-width:1.2"/><text x="252" y="50" text-anchor="middle" style="fill:#0f1a2a;font-size:12.5px;font-weight:800">one block, sorted</text><rect x="164" y="62" width="176" height="28" rx="7" style="fill:#ffffff;stroke:#cbd5e1"/><text x="174" y="80" style="fill:#0f1a2a;font-size:11.5px;font-weight:700">1  actions that are not new orders</text><rect x="164" y="98" width="176" height="28" rx="7" style="fill:#ffffff;stroke:#cbd5e1"/><text x="174" y="116" style="fill:#0f1a2a;font-size:11.5px;font-weight:700">2  cancels</text><rect x="164" y="134" width="176" height="28" rx="7" style="fill:#3b5bdb;stroke:#3b5bdb"/><text x="174" y="152" style="fill:#ffffff;font-size:11.5px;font-weight:700">3  new orders (GTC, IOC)</text><line x1="352" y1="105" x2="390" y2="105" marker-end="url(#fg11-ink)" style="stroke:#0f1a2a;stroke-width:1.5;stroke-linecap:round"/><rect x="392" y="48" width="150" height="114" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.2"/><text x="467" y="70" text-anchor="middle" style="fill:#0f1a2a;font-size:12px;font-weight:800">HyperCore book</text><text x="467" y="87" text-anchor="middle" style="fill:#5f6f82;font-size:11px">price-time priority</text><text x="467" y="102" text-anchor="middle" style="fill:#5f6f82;font-size:11px">margin checked again</text><text x="467" y="117" text-anchor="middle" style="fill:#5f6f82;font-size:11px">for the resting side</text><text x="467" y="132" text-anchor="middle" style="fill:#5f6f82;font-size:11px">at the match</text><line x1="542" y1="90" x2="580" y2="90" marker-end="url(#fg11-ink)" style="stroke:#0f1a2a;stroke-width:1.5;stroke-linecap:round"/><rect x="582" y="60" width="66" height="60" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.2"/><text x="615" y="82" text-anchor="middle" style="fill:#0f1a2a;font-size:12px;font-weight:800">fill</text><text x="615" y="99" text-anchor="middle" style="fill:#5f6f82;font-size:11px">committed</text><path d="M615 120 C615 200 60 200 64 142" marker-end="url(#fg11-muted)" style="fill:none;stroke:#5f6f82;stroke-width:1.3;stroke-dasharray:5 4;stroke-linecap:round;stroke-linejoin:round"/><text x="330" y="205" text-anchor="middle" style="fill:#5f6f82;font-size:11.5px">the response you get is the result, not a promise (median 0.2 s for a well-placed client)</text><text x="330" y="228" text-anchor="middle" style="fill:#5f6f82;font-size:11.5px;font-weight:700">and the whole state is public: every position, fill and liquidation, readable by anyone</text></svg>