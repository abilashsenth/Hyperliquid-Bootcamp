there. Buying $20,000 walks</text><text x="310" y="88" style="fill:#0f1a2a;font-size:11.5px">through 77,251, 77,252 and part of 77,253; the</text><text x="310" y="103" style="fill:#0f1a2a;font-size:11.5px">average, about 77,251.6, is the impact ask.</text><text x="310" y="140" style="fill:#5f6f82;font-size:11px">the funding premium compares the impact bid and</text><text x="310" y="154" style="fill:#5f6f82;font-size:11px">impact ask to the oracle, sampled every 5 seconds</text><text x="310" y="168" style="fill:#5f6f82;font-size:11px">and averaged over the hour. A tiny order at the</text><text x="310" y="182" style="fill:#5f6f82;font-size:11px">touch cannot fake a premium; it takes real size on</text><text x="310" y="196" style="fill:#5f6f82;font-size:11px">the book to move it.</text><text x="310" y="232" style="fill:#5f6f82;font-size:11px;font-weight:700">BTC and ETH use 20,000 USDC; every other asset 6,000 USDC.</text></svg>