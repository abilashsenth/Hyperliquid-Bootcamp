<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" role="img" aria-label="A trade drawn as a timeline: the decisions a plan makes before entry sit above the line in blue, and the decisions an unplanned trader makes in the moment sit below the line crossed out in red" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="240" rx="12" style="fill:#ffffff"/><defs><marker id="fg58-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg58-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg58-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg58-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg58-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg58-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg58-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><line x1="40" y1="120" x2="620" y2="120" marker-end="url(#fg58-muted)" style="stroke:#cbd5e1;stroke-width:2;stroke-linecap:round"/><circle cx="200" cy="120" r="6" style="fill:#3b5bdb"/><text x="200" y="142" text-anchor="middle" style="fill:#3b5bdb;font-size:10.5px;font-weight:700">entry</text><circle cx="520" cy="120" r="6" style="fill:#0f1a2a"/><text x="520" y="142" text-anchor="middle" style="fill:#0f1a2a;font-size:10.5px;font-weight:700">exit</text><text x="40" y="28" style="fill:#3b5bdb;font-size:11.5px;font-weight:800">decided before the trade, when you are calm</text><rect x="40" y="40" width="76" height="26" rx="7" style="fill:rgba(59,91,219,.16)"/><text x="78" y="57" text-anchor="middle" style="fill:#3b5bdb;font-size:10px;font-weight:700">setup</text><line x1="78" y1="66" x2="78" y2="110" style="stroke:#e2e8f0;stroke-width:1;stroke-dasharray:2 3;stroke-linecap:round"/><rect x="122" y="40" width="76" height="26" rx="7" style="fill:rgba(59,91,219,.16)"/><text x="160" y="57" text-anchor="middle" style="fill:#3b5bdb;font-size:10px;font-weight:700">entry price</text><line x1="160" y1="66" x2="160" y2="110" style="stroke:#e2e8f0;stroke-width:1;stroke-dasharray:2 3;stroke-linecap:round"/><rect x="204" y="40" width="76" height="26" rx="7" style="fill:rgba(59,91,219,.16)"/><text x="242" y="57" text-anchor="middle" style="fill:#3b5bdb;font-size:10px;font-weight:700">stop</text><line x1="242" y1="66" x2="242" y2="110" style="stroke:#e2e8f0;stroke-width:1;stroke-dasharray:2 3;stroke-linecap:round"/><rect x="286" y="40" width="76" height="26" rx="7" style="fill:rgba(59,91,219,.16)"/><text x="324" y="57" text-anchor="middle" style="fill:#3b5bdb;font-size:10px;font-weight:700">target</text><line x1="324" y1="66" x2="324" y2="110" style="stroke:#e2e8f0;stroke-width:1;stroke-dasharray:2 3;stroke-linecap:round"/><rect x="368" y="40" width="76" height="26" rx="7" style="fill:rgba(59,91,219,.16)"/><text x="406" y="57" text-anchor="middle" style="fill:#3b5bdb;font-size:10px;font-weight:700">size from risk</text><line x1="406" y1="66" x2="406" y2="110" style="stroke:#e2e8f0;stroke-width:1;stroke-dasharray:2 3;stroke-linecap:round"/><rect x="450" y="40" width="76" height="26" rx="7" style="fill:rgba(59,91,219,.16)"/><text x="488" y="57" text-anchor="middle" style="fill:#3b5bdb;font-size:10px;font-weight:700">time stop</text><line x1="488" y1="66" x2="488" y2="110" style="stroke:#e2e8f0;stroke-width:1;stroke-dasharray:2 3;stroke-linecap:round"/><rect x="532" y="40" width="76" height="26" rx="7" style="fill:rgba(59,91,219,.16)"/><text x="570" y="57" text-anchor="middle" style="fill:#3b5bdb;font-size:10px;font-weight:700">early-exit rule</text><line x1="570" y1="66" x2="570" y2="110" style="stroke:#e2e8f0;stroke-width:1;stroke-dasharray:2 3;stroke-linecap:round"/><text x="40" y="170" style="fill:#d0392b;font-size:11.5px;font-weight:800">decided in the moment, with money on the line</text><rect x="40" y="182" width="140" height="26" rx="7" style="fill:rgba(208,57,43,.18)"/><text x="110" y="199" text-anchor="middle" style="fill:#d0392b;font-size:10px;font-weight:700">“move the stop a bit”</text><line x1="48" y1="208" x2="172" y2="182" style="stroke:#d0392b;stroke-width:1.5;stroke-linecap:round"/><rect x="188" y="182" width="140" height="26" rx="7" style="fill:rgba(208,57,43,.18)"/><text x="258" y="199" text-anchor="middle" style="fill:#d0392b;font-size:10px;font-weight:700">“add, it will come back”</text><line x1="196" y1="208" x2="320" y2="182" style="stroke:#d0392b;stroke-width:1.5;stroke-linecap:round"/><rect x="336" y="182" width="140" height="26" rx="7" style="fill:rgba(208,57,43,.18)"/><text x="406" y="199" text-anchor="middle" style="fill:#d0392b;font-size:10px;font-weight:700">“take profit now”</text><line x1="344" y1="208" x2="468" y2="182" style="stroke:#d0392b;stroke-width:1.5;stroke-linecap:round"/><rect x="484" y="182" width="140" height="26" rx="7" style="fill:rgba(208,57,43,.18)"/><text x="554" y="199" text-anchor="middle" style="fill:#d0392b;font-size:10px;font-weight:700">“one more trade to get it back”</text><line x1="492" y1="208" x2="616" y2="182" style="stroke:#d0392b;stroke-width:1.5;stroke-linecap:round"/><text x="40" y="230" style="fill:#5f6f82;font-size:10.5px">every rule in this layer exists to move one decision from the second row to the first</text></svg>