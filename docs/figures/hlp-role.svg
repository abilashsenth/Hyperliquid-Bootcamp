<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" role="img" aria-label="HLP drawn as a vault with three jobs: quoting on the books as a market maker, taking over positions as the backstop liquidator, and supplying USDC to Earn, funded by depositors who share its PnL and a portion of trading fees, with a four-day lock on deposits" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="260" rx="12" style="fill:#ffffff"/><defs><marker id="fg68-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg68-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg68-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg68-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg68-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg68-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg68-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><rect x="230" y="30" width="200" height="90" rx="14" style="fill:rgba(59,91,219,.16);stroke:#3b5bdb;stroke-width:1.6"/><text x="330" y="60" text-anchor="middle" style="fill:#3b5bdb;font-size:16px;font-weight:800">HLP</text><text x="330" y="80" text-anchor="middle" style="fill:#5f6f82;font-size:11px">Hyperliquidity Provider</text><text x="330" y="100" text-anchor="middle" style="fill:#5f6f82;font-size:11px">community-owned vault</text><rect x="20" y="160" width="190" height="60" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="115" y="184" text-anchor="middle" style="fill:#0f1a2a;font-size:11.5px;font-weight:800">market making</text><text x="115" y="204" text-anchor="middle" style="fill:#5f6f82;font-size:10px">quotes on the books, both sides</text><line x1="330" y1="120" x2="115" y2="158" marker-end="url(#fg68-muted)" style="stroke:#5f6f82;stroke-width:1.3;stroke-linecap:round"/><rect x="235" y="160" width="190" height="60" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="330" y="184" text-anchor="middle" style="fill:#0f1a2a;font-size:11.5px;font-weight:800">backstop liquidations</text><text x="330" y="204" text-anchor="middle" style="fill:#5f6f82;font-size:10px">inherits positions the book cannot</text><line x1="330" y1="120" x2="330" y2="158" marker-end="url(#fg68-muted)" style="stroke:#5f6f82;stroke-width:1.3;stroke-linecap:round"/><rect x="450" y="160" width="190" height="60" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="545" y="184" text-anchor="middle" style="fill:#0f1a2a;font-size:11.5px;font-weight:800">supplies USDC to Earn</text><text x="545" y="204" text-anchor="middle" style="fill:#5f6f82;font-size:10px">lends idle collateral</text><line x1="330" y1="120" x2="545" y2="158" marker-end="url(#fg68-muted)" style="stroke:#5f6f82;stroke-width:1.3;stroke-linecap:round"/><line x1="150" y1="108" x2="228" y2="108" marker-end="url(#fg68-bid)" style="stroke:#15934f;stroke-width:1.4;stroke-linecap:round"/><text x="20" y="56" style="fill:#15934f;font-size:11px;font-weight:700">depositors’ USDC</text><text x="20" y="72" style="fill:#5f6f82;font-size:10px">share the PnL; 4-day lock</text><text x="20" y="86" style="fill:#5f6f82;font-size:10px">from the last deposit</text><line x1="510" y1="108" x2="432" y2="108" marker-end="url(#fg68-bid)" style="stroke:#15934f;stroke-width:1.4;stroke-linecap:round"/><text x="640" y="56" text-anchor="end" style="fill:#15934f;font-size:11px;font-weight:700">a share of trading fees</text><text x="640" y="72" text-anchor="end" style="fill:#5f6f82;font-size:10px">every fee you pay feeds it</text><text x="330" y="246" text-anchor="middle" style="fill:#5f6f82;font-size:10.5px">when your liquidation goes to the backstop, HLP is who takes the other side. JELLY (Layer 4) is what happens when that is attacked.</text></svg>