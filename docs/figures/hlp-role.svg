<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" role="img" aria-label="HLP drawn as a vault with three jobs: quoting on the books as a market maker, taking over positions as the backstop liquidator, and supplying USDC to Earn, funded by depositors who share its PnL and a portion of trading fees, with a four-day lock on deposits" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="259" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg68-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg68-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg68-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg68-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg68-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg68-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg68-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><rect x="230" y="30" width="200" height="90" rx="14" style="fill:rgba(0,179,221,.16);stroke:#00b3dd;stroke-width:1.6"/><text x="330" y="60" text-anchor="middle" style="fill:#00b3dd;font-size:16px;font-weight:800">HLP</text><text x="330" y="80" text-anchor="middle" style="fill:#9f9fa0;font-size:11px">Hyperliquidity Provider</text><text x="330" y="100" text-anchor="middle" style="fill:#9f9fa0;font-size:11px">community-owned vault</text><rect x="20" y="160" width="190" height="60" rx="10" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.3"/><text x="115" y="184" text-anchor="middle" style="fill:#f5f5f7;font-size:11.5px;font-weight:800">market making</text><text x="115" y="204" text-anchor="middle" style="fill:#9f9fa0;font-size:10px">quotes on the books, both sides</text><line x1="330" y1="120" x2="115" y2="158" marker-end="url(#fg68-muted)" style="stroke:#9f9fa0;stroke-width:1.3;stroke-linecap:round"/><rect x="235" y="160" width="190" height="60" rx="10" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.3"/><text x="330" y="184" text-anchor="middle" style="fill:#f5f5f7;font-size:11.5px;font-weight:800">backstop liquidations</text><text x="330" y="204" text-anchor="middle" style="fill:#9f9fa0;font-size:10px">inherits positions the book cannot</text><line x1="330" y1="120" x2="330" y2="158" marker-end="url(#fg68-muted)" style="stroke:#9f9fa0;stroke-width:1.3;stroke-linecap:round"/><rect x="450" y="160" width="190" height="60" rx="10" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.3"/><text x="545" y="184" text-anchor="middle" style="fill:#f5f5f7;font-size:11.5px;font-weight:800">supplies USDC to Earn</text><text x="545" y="204" text-anchor="middle" style="fill:#9f9fa0;font-size:10px">lends idle collateral</text><line x1="330" y1="120" x2="545" y2="158" marker-end="url(#fg68-muted)" style="stroke:#9f9fa0;stroke-width:1.3;stroke-linecap:round"/><line x1="150" y1="108" x2="228" y2="108" marker-end="url(#fg68-bid)" style="stroke:#4fce8f;stroke-width:1.4;stroke-linecap:round"/><text x="20" y="56" style="fill:#4fce8f;font-size:11px;font-weight:700">depositors’ USDC</text><text x="20" y="72" style="fill:#9f9fa0;font-size:10px">share the PnL; 4-day lock</text><text x="20" y="86" style="fill:#9f9fa0;font-size:10px">from the last deposit</text><line x1="510" y1="108" x2="432" y2="108" marker-end="url(#fg68-bid)" style="stroke:#4fce8f;stroke-width:1.4;stroke-linecap:round"/><text x="640" y="56" text-anchor="end" style="fill:#4fce8f;font-size:11px;font-weight:700">a share of trading fees</text><text x="640" y="72" text-anchor="end" style="fill:#9f9fa0;font-size:10px">every fee you pay feeds it</text><text x="330" y="246" text-anchor="middle" style="fill:#9f9fa0;font-size:10.5px">when your liquidation goes to the backstop, HLP is who takes the other side. JELLY (Layer 4) is what happens when that is attacked.</text></svg>