<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" role="img" aria-label="Cross margin drawn as one pool of USDC backing three positions, which one losing position can drain; isolated margin drawn as three separate buckets, where a loss empties only its own bucket" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="279" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg40-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg40-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg40-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg40-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg40-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg40-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg40-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><text x="20" y="24" style="fill:#f5f5f7;font-size:13px;font-weight:800">Cross: one pool backs everything</text><text x="350" y="24" style="fill:#f5f5f7;font-size:13px;font-weight:800">Isolated: a bucket per position</text><rect x="20" y="40" width="300" height="60" rx="10" style="fill:rgba(0,179,221,.16);stroke:#00b3dd;stroke-width:1.3"/><text x="170" y="64" text-anchor="middle" style="fill:#00b3dd;font-size:12px;font-weight:800">all your USDC</text><text x="170" y="82" text-anchor="middle" style="fill:#9f9fa0;font-size:10px">plus unrealized PnL of every cross position</text><line x1="66" y1="100" x2="66" y2="126" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><rect x="20" y="128" width="92" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.3"/><text x="66" y="148" text-anchor="middle" style="fill:#f5f5f7;font-size:11.5px;font-weight:700">BTC long</text><text x="66" y="162" text-anchor="middle" style="fill:#9f9fa0;font-size:10px">fine</text><line x1="170" y1="100" x2="170" y2="126" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><rect x="124" y="128" width="92" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.3"/><text x="170" y="148" text-anchor="middle" style="fill:#f5f5f7;font-size:11.5px;font-weight:700">ETH short</text><text x="170" y="162" text-anchor="middle" style="fill:#9f9fa0;font-size:10px">fine</text><line x1="274" y1="100" x2="274" y2="126" style="stroke:#f47067;stroke-width:1.4;stroke-linecap:round"/><rect x="228" y="128" width="92" height="40" rx="8" style="fill:#2e2e2e;stroke:#f47067;stroke-width:1.3"/><text x="274" y="148" text-anchor="middle" style="fill:#f5f5f7;font-size:11.5px;font-weight:700">SOL long</text><text x="274" y="162" text-anchor="middle" style="fill:#f47067;font-size:10px">losing badly</text><text x="20" y="194" style="fill:#9f9fa0;font-size:10.5px">the SOL loss eats the shared pool. When the whole</text><text x="20" y="207" style="fill:#9f9fa0;font-size:10.5px">account’s value falls below the sum of all</text><text x="20" y="220" style="fill:#9f9fa0;font-size:10.5px">maintenance margins, every cross position is</text><text x="20" y="233" style="fill:#9f9fa0;font-size:10.5px">liquidated together. Efficient, and how accounts</text><text x="20" y="246" style="fill:#9f9fa0;font-size:10.5px">die.</text><rect x="350" y="40" width="92" height="60" rx="10" style="fill:rgba(0,179,221,.16);stroke:#00b3dd;stroke-width:1.3"/><text x="396" y="64" text-anchor="middle" style="fill:#00b3dd;font-size:11px;font-weight:800">its margin</text><text x="396" y="80" text-anchor="middle" style="fill:#9f9fa0;font-size:10px">untouched</text><line x1="396" y1="100" x2="396" y2="126" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><rect x="350" y="128" width="92" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.3"/><text x="396" y="148" text-anchor="middle" style="fill:#f5f5f7;font-size:11.5px;font-weight:700">BTC long</text><text x="396" y="162" text-anchor="middle" style="fill:#9f9fa0;font-size:10px">fine</text><rect x="454" y="40" width="92" height="60" rx="10" style="fill:rgba(0,179,221,.16);stroke:#00b3dd;stroke-width:1.3"/><text x="500" y="64" text-anchor="middle" style="fill:#00b3dd;font-size:11px;font-weight:800">its margin</text><text x="500" y="80" text-anchor="middle" style="fill:#9f9fa0;font-size:10px">untouched</text><line x1="500" y1="100" x2="500" y2="126" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><rect x="454" y="128" width="92" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.3"/><text x="500" y="148" text-anchor="middle" style="fill:#f5f5f7;font-size:11.5px;font-weight:700">ETH short</text><text x="500" y="162" text-anchor="middle" style="fill:#9f9fa0;font-size:10px">fine</text><rect x="558" y="40" width="92" height="60" rx="10" style="fill:rgba(0,179,221,.16);stroke:#00b3dd;stroke-width:1.3"/><text x="604" y="64" text-anchor="middle" style="fill:#00b3dd;font-size:11px;font-weight:800">its margin</text><text x="604" y="80" text-anchor="middle" style="fill:#f47067;font-size:10px">draining</text><line x1="604" y1="100" x2="604" y2="126" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><rect x="558" y="128" width="92" height="40" rx="8" style="fill:#2e2e2e;stroke:#f47067;stroke-width:1.3"/><text x="604" y="148" text-anchor="middle" style="fill:#f5f5f7;font-size:11.5px;font-weight:700">SOL long</text><text x="604" y="162" text-anchor="middle" style="fill:#f47067;font-size:10px">liquidated alone</text><text x="350" y="194" style="fill:#9f9fa0;font-size:10.5px">only the SOL bucket is at risk; you can top it up</text><text x="350" y="207" style="fill:#9f9fa0;font-size:10.5px">or let it go. Strict isolated is the same bucket</text><text x="350" y="220" style="fill:#9f9fa0;font-size:10.5px">with the tap welded shut: margin cannot be removed,</text><text x="350" y="233" style="fill:#9f9fa0;font-size:10.5px">only released as the position closes.</text><text x="20" y="268" style="fill:#f5f5f7;font-size:11px;font-weight:700">learn on isolated. Switch to cross only when you can say, before a trade, what every open position does to every other.</text></svg>