nospace;font-size:11px;font-weight:700">30%</text><text x="470" y="172" style="fill:#f5f5f7;font-size:11px;font-weight:700">Diamond</text><text x="548" y="172" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:10.5px">&gt;500,000</text><text x="640" y="172" text-anchor="end" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">40%</text><text x="470" y="206" style="fill:#9f9fa0;font-size:10.5px">referral code: 4% off your first $25M</text><text x="470" y="222" style="fill:#9f9fa0;font-size:10.5px">maker rebates: biggest makers only</text><rect x="20" y="252" width="620" height="88" rx="10" style="fill:rgba(245,245,247,.09)"/><text x="32" y="272" style="fill:#f5f5f7;font-size:11px">Where it goes: to HLP (the community market-making vault) and the assistance fund, which buys</text><text x="32" y="287" style="fill:#f5f5f7;font-size:11px">and burns HYPE. No team takes a cut. One fee tier covers perps, HIP-3 and spot; spot rates are</text><text x="32" y="302" style="fill:#f5f5f7;font-size:11px">higher, 0.07% taker and 0.04% maker at the base. HIP-3 builder markets add a deployer share, and</text><text x="32" y="317" style="fill:#f5f5f7;font-size:11px">growth-mode markets cut the all-in fee by at least 90% (taker 0.0045% to 0.009%).</text></svg>