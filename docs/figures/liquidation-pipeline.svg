<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" role="img" aria-label="A flow from equity falling below maintenance margin, to a market order on the book, to the backstop liquidator taking the position when equity is below two thirds of maintenance, to auto-deleveraging if the account goes negative" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="329" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg41-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg41-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg41-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg41-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg41-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg41-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg41-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><rect x="20" y="20" width="300" height="86" rx="10" style="fill:#2e2e2e;stroke:#e3a63d;stroke-width:1.4"/><text x="32" y="40" style="fill:#e3a63d;font-size:12px;font-weight:800">1 · equity falls below maintenance margin</text><text x="32" y="56" style="fill:#9f9fa0;font-size:10.5px">measured on the mark price, every ~3 seconds</text><text x="32" y="69" style="fill:#9f9fa0;font-size:10.5px">cross: whole account against all positions;</text><text x="32" y="82" style="fill:#9f9fa0;font-size:10.5px">isolated: that bucket alone</text><line x1="170" y1="106" x2="170" y2="126" marker-end="url(#fg41-muted)" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><rect x="20" y="128" width="300" height="96" rx="10" style="fill:#2e2e2e;stroke:#f47067;stroke-width:1.4"/><text x="32" y="148" style="fill:#f47067;font-size:12px;font-weight:800">2 · a market order for the whole position</text><text x="32" y="164" style="fill:#9f9fa0;font-size:10.5px">above 100k USDC (10k on testnet): 20% slices</text><text x="32" y="177" style="fill:#9f9fa0;font-size:10.5px">with a 30-second cooldown</text><text x="32" y="190" style="fill:#9f9fa0;font-size:10.5px">if enough closes to restore maintenance, the</text><text x="32" y="203" style="fill:#9f9fa0;font-size:10.5px">rest stays yours</text><text x="32" y="216" style="fill:#9f9fa0;font-size:10.5px">no clearance fee</text><line x1="320" y1="176" x2="350" y2="176" marker-end="url(#fg41-muted)" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><rect x="352" y="128" width="290" height="96" rx="10" style="fill:#2e2e2e;stroke:#f47067;stroke-width:1.4"/><text x="364" y="148" style="fill:#f47067;font-size:12px;font-weight:800">3 · backstop, if equity &lt; ⅔ of maintenance</text><text x="364" y="164" style="fill:#9f9fa0;font-size:10.5px">HLP’s liquidator vault takes the position and</text><text x="364" y="177" style="fill:#9f9fa0;font-size:10.5px">its margin</text><text x="364" y="190" style="fill:#9f9fa0;font-size:10.5px">the maintenance margin is not returned to you</text><line x1="497" y1="224" x2="497" y2="244" marker-end="url(#fg41-muted)" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><rect x="352" y="246" width="290" height="70" rx="10" style="fill:#2e2e2e;stroke:#f47067;stroke-width:1.4"/><text x="364" y="266" style="fill:#f47067;font-size:12px;font-weight:800">4 · ADL, if the account goes negative</text><text x="364" y="282" style="fill:#9f9fa0;font-size:10.5px">profitable traders on the other side are</text><text x="364" y="295" style="fill:#9f9fa0;font-size:10.5px">closed against it at the previous mark</text><text x="20" y="250" style="fill:#9f9fa0;font-size:10.5px">most liquidations end at step 2: the position is</text><text x="20" y="263" style="fill:#9f9fa0;font-size:10.5px">sold on the book and whatever equity is left stays</text><text x="20" y="276" style="fill:#9f9fa0;font-size:10.5px">in your account. Steps 3 and 4 are for markets that</text><text x="20" y="289" style="fill:#9f9fa0;font-size:10.5px">gap or go illiquid.</text></svg>