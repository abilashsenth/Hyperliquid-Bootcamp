<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" role="img" aria-label="A notional bar with the initial margin slice at 5x and the much thinner maintenance margin floor beneath it, next to a table of maintenance margin by maximum leverage from 40x to 3x" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="279" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg38-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg38-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg38-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg38-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg38-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg38-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg38-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><text x="20" y="24" style="fill:#f5f5f7;font-size:13px;font-weight:800">0.1 BTC at 77,250 = $7,725 notional, opened at 5x</text><rect x="20" y="40" width="360" height="30" rx="7" style="fill:rgba(245,245,247,.09)"/><text x="380" y="88" text-anchor="end" style="fill:#9f9fa0;font-size:11px">notional $7,725</text><rect x="20" y="40" width="72" height="30" rx="7" style="fill:#00b3dd"/><text x="26" y="59" style="fill:#2e2e2e;font-size:11px;font-weight:700">initial margin</text><text x="20" y="88" style="fill:#00b3dd;font-size:11px;font-weight:700">$1,545 = notional ÷ 5</text><rect x="20" y="110" width="360" height="30" rx="7" style="fill:rgba(245,245,247,.09)"/><rect x="20" y="110" width="4.5" height="30" rx="3" style="fill:#f47067"/><text x="32" y="129" style="fill:#f47067;font-size:11px;font-weight:700">maintenance margin $96.56 = 1.25% of notional (BTC, max 40x)</text><text x="20" y="164" style="fill:#9f9fa0;font-size:11px">your equity in the position starts at the initial margin</text><text x="20" y="178" style="fill:#9f9fa0;font-size:11px">and moves with the mark. When it falls to the red sliver,</text><text x="20" y="192" style="fill:#9f9fa0;font-size:11px">liquidation begins. The gap between the two is your whole</text><text x="20" y="206" style="fill:#9f9fa0;font-size:11px">buffer.</text><text x="420" y="24" style="fill:#f5f5f7;font-size:12.5px;font-weight:800">maintenance margin by asset</text><text x="420" y="42" style="fill:#9f9fa0;font-size:10px">half the initial margin at the asset’s max leverage</text><text x="420" y="66" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">40x</text><text x="464" y="66" style="fill:#9f9fa0;font-size:11px">BTC</text><text x="640" y="66" text-anchor="end" style="fill:#f47067;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">1.25%</text><line x1="420" y1="74" x2="640" y2="74" style="stroke:#3f4041;stroke-width:1.5;stroke-linecap:round"/><text x="420" y="92" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">25x</text><text x="464" y="92" style="fill:#9f9fa0;font-size:11px">ETH</text><text x="640" y="92" text-anchor="end" style="fill:#f47067;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">2%</text><line x1="420" y1="100" x2="640" y2="100" style="stroke:#3f4041;stroke-width:1.5;stroke-linecap:round"/><text x="420" y="118" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">20x</text><text x="464" y="118" style="fill:#9f9fa0;font-size:11px">SOL, XRP</text><text x="640" y="118" text-anchor="end" style="fill:#f47067;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">2.5%</text><line x1="420" y1="126" x2="640" y2="126" style="stroke:#3f4041;stroke-width:1.5;stroke-linecap:round"/><text x="420" y="144" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">10x</text><text x="464" y="144" style="fill:#9f9fa0;font-size:11px">HYPE, most alts</text><text x="640" y="144" text-anchor="end" style="fill:#f47067;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">5%</text><line x1="420" y1="152" x2="640" y2="152" style="stroke:#3f4041;stroke-width:1.5;stroke-linecap:round"/><text x="420" y="170" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">5x</text><text x="464" y="170" style="fill:#9f9fa0;font-size:11px">some small caps</text><text x="640" y="170" text-anchor="end" style="fill:#f47067;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">10%</text><line x1="420" y1="178" x2="640" y2="178" style="stroke:#3f4041;stroke-width:1.5;stroke-linecap:round"/><text x="420" y="196" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">3x</text><text x="464" y="196" style="fill:#9f9fa0;font-size:11px">the smallest</text><text x="640" y="196" text-anchor="end" style="fill:#f47067;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">16.7%</text><line x1="420" y1="204" x2="640" y2="204" style="stroke:#3f4041;stroke-width:1.5;stroke-linecap:round"/><text x="420" y="236" style="fill:#9f9fa0;font-size:10.5px">you choose the leverage; the asset fixes the floor</text></svg>