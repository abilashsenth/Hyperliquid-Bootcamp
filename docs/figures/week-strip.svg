<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 210" role="img" aria-label="A week from Monday to Sunday showing CME futures open from Sunday evening to Friday afternoon Chicago time with a daily hour-long break, and the weekend gap when only crypto trades" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="210" rx="12" style="fill:#ffffff"/><defs><marker id="fg49-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg49-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg49-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg49-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg49-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg49-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg49-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><text x="110.71" y="30" text-anchor="middle" style="fill:#5f6f82;font-size:11px;font-weight:700">Mon</text><line x1="70" y1="40" x2="70" y2="150" style="stroke:#e2e8f0;stroke-width:1.5;stroke-linecap:round"/><text x="192.14" y="30" text-anchor="middle" style="fill:#5f6f82;font-size:11px;font-weight:700">Tue</text><line x1="151.43" y1="40" x2="151.43" y2="150" style="stroke:#e2e8f0;stroke-width:1.5;stroke-linecap:round"/><text x="273.57" y="30" text-anchor="middle" style="fill:#5f6f82;font-size:11px;font-weight:700">Wed</text><line x1="232.86" y1="40" x2="232.86" y2="150" style="stroke:#e2e8f0;stroke-width:1.5;stroke-linecap:round"/><text x="355" y="30" text-anchor="middle" style="fill:#5f6f82;font-size:11px;font-weight:700">Thu</text><line x1="314.29" y1="40" x2="314.29" y2="150" style="stroke:#e2e8f0;stroke-width:1.5;stroke-linecap:round"/><text x="436.43" y="30" text-anchor="middle" style="fill:#5f6f82;font-size:11px;font-weight:700">Fri</text><line x1="395.71" y1="40" x2="395.71" y2="150" style="stroke:#e2e8f0;stroke-width:1.5;stroke-linecap:round"/><text x="517.86" y="30" text-anchor="middle" style="fill:#5f6f82;font-size:11px;font-weight:700">Sat</text><line x1="477.14" y1="40" x2="477.14" y2="150" style="stroke:#e2e8f0;stroke-width:1.5;stroke-linecap:round"/><text x="599.29" y="30" text-anchor="middle" style="fill:#5f6f82;font-size:11px;font-weight:700">Sun</text><line x1="558.57" y1="40" x2="558.57" y2="150" style="stroke:#e2e8f0;stroke-width:1.5;stroke-linecap:round"/><text x="20" y="70" style="fill:#0f1a2a;font-size:11px;font-weight:800">crypto</text><rect x="70" y="58" width="570" height="22" rx="6" style="fill:rgba(59,91,219,.16)"/><text x="355" y="73" text-anchor="middle" style="fill:#3b5bdb;font-size:10.5px;font-weight:700">24 hours, every day, funding every hour</text><text x="20" y="112" style="fill:#0f1a2a;font-size:11px;font-weight:800">CME</text><rect x="70" y="100" width="77.36" height="22" rx="6" style="fill:rgba(192,122,12,.20)"/><rect x="147.36" y="100" width="4.07" height="22" style="fill:rgba(208,57,43,.18)"/><rect x="151.43" y="100" width="77.36" height="22" rx="6" style="fill:rgba(192,122,12,.20)"/><rect x="228.79" y="100" width="4.07" height="22" style="fill:rgba(208,57,43,.18)"/><rect x="232.86" y="100" width="77.36" height="22" rx="6" style="fill:rgba(192,122,12,.20)"/><rect x="310.21" y="100" width="4.07" height="22" style="fill:rgba(208,57,43,.18)"/><rect x="314.29" y="100" width="77.36" height="22" rx="6" style="fill:rgba(192,122,12,.20)"/><rect x="391.64" y="100" width="4.07" height="22" style="fill:rgba(208,57,43,.18)"/><rect x="395.71" y="100" width="77.36" height="22" rx="6" style="fill:rgba(192,122,12,.20)"/><rect x="473.07" y="100" width="4.07" height="22" style="fill:rgba(208,57,43,.18)"/><rect x="477.14" y="100" width="150.64" height="22" rx="6" style="fill:rgba(208,57,43,.18)"/><text x="552.06" y="115" text-anchor="middle" style="fill:#d0392b;font-size:9px;font-weight:700">closed Fri 16:00 → Sun 17:00 CT</text><rect x="627.79" y="100" width="12.21" height="22" rx="6" style="fill:rgba(192,122,12,.20)"/><text x="70" y="142" style="fill:#5f6f82;font-size:10px">the thin red slices are the daily 16:00–17:00 CT maintenance break (03:30–04:30 IST in winter)</text><text x="70" y="164" style="fill:#5f6f82;font-size:10.5px">bitcoin keeps trading through the CME weekend, so Monday’s CME open often sits away from</text><text x="70" y="177" style="fill:#5f6f82;font-size:10.5px">Friday’s close: the “CME gap” traders watch, and a weekend when books are thin and wicks are</text><text x="70" y="190" style="fill:#5f6f82;font-size:10.5px">big.</text></svg>