<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-label="A simplified diagram of the JELLY incident: an attacker’s under-margined short is liquidated, the backstop inherits it, the price is pushed up so the inherited short loses, and the market is delisted and settled at a single price" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="249" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg45-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg45-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg45-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg45-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg45-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg45-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg45-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><rect x="20" y="30" width="200" height="80" rx="10" style="fill:#2e2e2e;stroke:#f5f5f7;stroke-width:1.4"/><text x="32" y="50" style="fill:#f5f5f7;font-size:12px;font-weight:800">1 · the attacker</text><text x="32" y="68" style="fill:#9f9fa0;font-size:10.5px">a big JELLY short, thin margin,</text><text x="32" y="82" style="fill:#9f9fa0;font-size:10.5px">in one account; longs elsewhere</text><text x="32" y="96" style="fill:#9f9fa0;font-size:10.5px">on a coin with a tiny spot market</text><line x1="220" y1="70" x2="250" y2="70" marker-end="url(#fg45-muted)" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><rect x="252" y="30" width="180" height="80" rx="10" style="fill:#2e2e2e;stroke:#f47067;stroke-width:1.4"/><text x="264" y="50" style="fill:#f47067;font-size:12px;font-weight:800">2 · self-liquidation</text><text x="264" y="68" style="fill:#9f9fa0;font-size:10.5px">the spot price is pushed up,</text><text x="264" y="82" style="fill:#9f9fa0;font-size:10.5px">the short is liquidated,</text><text x="264" y="96" style="fill:#9f9fa0;font-size:10.5px">the book cannot absorb it</text><line x1="432" y1="70" x2="462" y2="70" marker-end="url(#fg45-muted)" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><rect x="464" y="30" width="180" height="80" rx="10" style="fill:#2e2e2e;stroke:#f47067;stroke-width:1.4"/><text x="476" y="50" style="fill:#f47067;font-size:12px;font-weight:800">3 · backstop inherits</text><text x="476" y="68" style="fill:#9f9fa0;font-size:10.5px">HLP’s liquidator vault now</text><text x="476" y="82" style="fill:#9f9fa0;font-size:10.5px">holds the short, about $4M,</text><text x="476" y="96" style="fill:#9f9fa0;font-size:10.5px">and bleeds as price rises</text><line x1="554" y1="110" x2="554" y2="140" marker-end="url(#fg45-muted)" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><rect x="300" y="142" width="344" height="66" rx="10" style="fill:#2e2e2e;stroke:#e3a63d;stroke-width:1.4"/><text x="312" y="162" style="fill:#e3a63d;font-size:12px;font-weight:800">4 · validators delist JELLY</text><text x="312" y="180" style="fill:#9f9fa0;font-size:10.5px">all positions are settled at a single price, open orders cancelled;</text><text x="312" y="194" style="fill:#9f9fa0;font-size:10.5px">the attack is unwound, and the design questions stay</text><text x="20" y="232" style="fill:#9f9fa0;font-size:10.5px">simplified from Arkham’s account of 26 March 2025 (linked below). The point for you: the backstop and HLP</text><text x="20" y="245" style="fill:#9f9fa0;font-size:10.5px">are the counterparty of last resort, and thin markets can be weaponised against them.</text></svg>