<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" role="img" aria-label="Open interest drawn as the level in a tank, positions currently held and counted once, next to volume drawn as flow through a pipe; a gauge shows premium as the perp price minus the oracle" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="240" rx="12" style="fill:#ffffff"/><defs><marker id="fg35-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg35-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg35-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg35-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg35-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg35-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg35-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><rect x="30" y="50" width="150" height="150" rx="12" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5"/><rect x="34" y="120" width="142" height="76" rx="8" style="fill:rgba(59,91,219,.16)"/><text x="105" y="34" text-anchor="middle" style="fill:#0f1a2a;font-size:13px;font-weight:800">open interest</text><text x="105" y="150" text-anchor="middle" style="fill:#3b5bdb;font-size:11px;font-weight:700">positions held now</text><text x="105" y="166" text-anchor="middle" style="fill:#5f6f82;font-size:10px">each pair counted once</text><text x="30" y="216" style="fill:#5f6f82;font-size:10px">a level: rises when</text><text x="30" y="228" style="fill:#5f6f82;font-size:10px">positions open, falls when</text><text x="30" y="240" style="fill:#5f6f82;font-size:10px">they close</text><rect x="230" y="110" width="180" height="30" rx="15" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5"/><line x1="240" y1="125" x2="262" y2="125" marker-end="url(#fg35-muted)" style="stroke:#5f6f82;stroke-width:2;stroke-linecap:round"/><line x1="276" y1="125" x2="298" y2="125" marker-end="url(#fg35-muted)" style="stroke:#5f6f82;stroke-width:2;stroke-linecap:round"/><line x1="312" y1="125" x2="334" y2="125" marker-end="url(#fg35-muted)" style="stroke:#5f6f82;stroke-width:2;stroke-linecap:round"/><line x1="348" y1="125" x2="370" y2="125" marker-end="url(#fg35-muted)" style="stroke:#5f6f82;stroke-width:2;stroke-linecap:round"/><line x1="384" y1="125" x2="406" y2="125" marker-end="url(#fg35-muted)" style="stroke:#5f6f82;stroke-width:2;stroke-linecap:round"/><text x="320" y="34" text-anchor="middle" style="fill:#0f1a2a;font-size:13px;font-weight:800">volume</text><text x="320" y="90" text-anchor="middle" style="fill:#5f6f82;font-size:11px">size that traded in a window</text><text x="230" y="216" style="fill:#5f6f82;font-size:10px">a flow: resets daily; opening</text><text x="230" y="228" style="fill:#5f6f82;font-size:10px">and closing both count</text><circle cx="540" cy="125" r="60" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5"/><line x1="540" y1="125" x2="578" y2="92" style="stroke:#d0392b;stroke-width:2.5;stroke-linecap:round"/><circle cx="540" cy="125" r="4" style="fill:#0f1a2a"/><text x="540" y="34" text-anchor="middle" style="fill:#0f1a2a;font-size:13px;font-weight:800">premium (basis)</text><text x="540" y="60" text-anchor="middle" style="fill:#5f6f82;font-size:11px">perp price − oracle</text><text x="500" y="170" style="fill:#15934f;font-size:12px;font-weight:800">−</text><text x="578" y="170" style="fill:#d0392b;font-size:12px;font-weight:800">+</text><text x="462" y="216" style="fill:#5f6f82;font-size:10px">a persistent plus: crowded</text><text x="462" y="228" style="fill:#5f6f82;font-size:10px">longs, paying funding to stay</text></svg>