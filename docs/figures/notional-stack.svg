<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-label="Three bars for the same 0.1 BTC position worth 7,725 dollars at 1x, 5x and 20x leverage; the bar is the same length each time, only the margin slice shrinks" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="250" rx="12" style="fill:#ffffff"/><defs><marker id="fg15-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg15-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg15-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg15-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg15-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg15-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg15-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><text x="20" y="28" style="fill:#0f1a2a;font-size:14px;font-weight:800">The same position, 0.1 BTC at 77,250 = $7,725 notional</text><text x="20" y="79" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:14px;font-weight:800">1x</text><rect x="150" y="60" width="460" height="28" rx="7" style="fill:rgba(15,26,42,.09)"/><rect x="150" y="60" width="460" height="28" rx="7" style="fill:#3b5bdb"/><text x="158" y="78" style="fill:#ffffff;font-size:11.5px;font-weight:700">margin $7,725</text><text x="610" y="78" text-anchor="end" style="fill:#5f6f82;font-size:11.5px">notional $7,725</text><text x="20" y="129" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:14px;font-weight:800">5x</text><rect x="150" y="110" width="460" height="28" rx="7" style="fill:rgba(15,26,42,.09)"/><rect x="150" y="110" width="92" height="28" rx="7" style="fill:#3b5bdb"/><text x="250" y="128" style="fill:#3b5bdb;font-size:11.5px;font-weight:700">margin $1,545</text><text x="610" y="128" text-anchor="end" style="fill:#5f6f82;font-size:11.5px">notional $7,725</text><text x="20" y="179" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:14px;font-weight:800">20x</text><rect x="150" y="160" width="460" height="28" rx="7" style="fill:rgba(15,26,42,.09)"/><rect x="150" y="160" width="23" height="28" rx="7" style="fill:#3b5bdb"/><text x="181" y="178" style="fill:#3b5bdb;font-size:11.5px;font-weight:700">margin $386</text><text x="610" y="178" text-anchor="end" style="fill:#5f6f82;font-size:11.5px">notional $7,725</text><text x="20" y="216" style="fill:#5f6f82;font-size:11.5px">a 1% move is $77.25 in every row. What changes is the deposit, and how far away the liquidation sits (Layer 4).</text><text x="20" y="236" style="fill:#5f6f82;font-size:11.5px">leverage = notional ÷ margin. On Hyperliquid it is a whole number from 1 to the asset’s maximum, 3x to 40x.</text></svg>