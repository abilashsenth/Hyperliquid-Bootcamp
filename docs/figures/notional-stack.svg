<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-label="Three bars for the same 0.1 BTC position worth 7,725 dollars at 1x, 5x and 20x leverage; the bar is the same length each time, only the margin slice shrinks" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="249" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg15-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg15-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg15-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg15-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg15-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg15-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg15-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><text x="20" y="28" style="fill:#f5f5f7;font-size:14px;font-weight:800">The same position, 0.1 BTC at 77,250 = $7,725 notional</text><text x="20" y="79" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:14px;font-weight:800">1x</text><rect x="150" y="60" width="460" height="28" rx="7" style="fill:rgba(245,245,247,.09)"/><rect x="150" y="60" width="460" height="28" rx="7" style="fill:#00b3dd"/><text x="158" y="78" style="fill:#2e2e2e;font-size:11.5px;font-weight:700">margin $7,725</text><text x="610" y="78" text-anchor="end" style="fill:#9f9fa0;font-size:11.5px">notional $7,725</text><text x="20" y="129" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:14px;font-weight:800">5x</text><rect x="150" y="110" width="460" height="28" rx="7" style="fill:rgba(245,245,247,.09)"/><rect x="150" y="110" width="92" height="28" rx="7" style="fill:#00b3dd"/><text x="250" y="128" style="fill:#00b3dd;font-size:11.5px;font-weight:700">margin $1,545</text><text x="610" y="128" text-anchor="end" style="fill:#9f9fa0;font-size:11.5px">notional $7,725</text><text x="20" y="179" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:14px;font-weight:800">20x</text><rect x="150" y="160" width="460" height="28" rx="7" style="fill:rgba(245,245,247,.09)"/><rect x="150" y="160" width="23" height="28" rx="7" style="fill:#00b3dd"/><text x="181" y="178" style="fill:#00b3dd;font-size:11.5px;font-weight:700">margin $386</text><text x="610" y="178" text-anchor="end" style="fill:#9f9fa0;font-size:11.5px">notional $7,725</text><text x="20" y="216" style="fill:#9f9fa0;font-size:11.5px">a 1% move is $77.25 in every row. What changes is the deposit, and how far away the liquidation sits (Layer 4).</text><text x="20" y="236" style="fill:#9f9fa0;font-size:11.5px">leverage = notional ÷ margin. On Hyperliquid it is a whole number from 1 to the asset’s maximum, 3x to 40x.</text></svg>