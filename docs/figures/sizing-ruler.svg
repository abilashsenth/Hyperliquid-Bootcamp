<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-label="A price ruler for the worked trade: entry at 77,250, the stop 2 percent below at 75,705, and the liquidation 19 percent below at about 62,600, nine and a half stop distances away" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="250" rx="12" style="fill:#ffffff"/><defs><marker id="fg43-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg43-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg43-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg43-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg43-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg43-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg43-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><text x="20" y="24" style="fill:#0f1a2a;font-size:12.5px;font-weight:800">account $1,000 · risk 1% = $10 · stop 2% away → notional $500 → at 5x, margin $100</text><line x1="60" y1="120" x2="620" y2="120" style="stroke:#cbd5e1;stroke-width:2;stroke-linecap:round"/><rect x="508" y="110" width="44.8" height="20" rx="4" style="fill:rgba(59,91,219,.16)"/><circle cx="552.8" cy="120" r="6" style="fill:#3b5bdb"/><text x="552.8" y="102" text-anchor="middle" style="fill:#3b5bdb;font-size:10.5px;font-weight:700">entry 77,250</text><line x1="508" y1="104" x2="508" y2="136" style="stroke:#0f1a2a;stroke-width:2.5;stroke-linecap:round"/><text x="508" y="152" text-anchor="middle" style="fill:#0f1a2a;font-size:10.5px;font-weight:700">stop −2% (75,705)</text><text x="508" y="166" text-anchor="middle" style="fill:#5f6f82;font-size:10px">you lose $10 here, on purpose</text><line x1="127.48" y1="104" x2="127.48" y2="136" style="stroke:#d0392b;stroke-width:2.5;stroke-linecap:round"/><text x="127.48" y="152" text-anchor="middle" style="fill:#d0392b;font-size:10.5px;font-weight:700">liquidation −19% (62,582)</text><text x="127.48" y="166" text-anchor="middle" style="fill:#5f6f82;font-size:10px">you never get here</text><line x1="127.48" y1="84" x2="508" y2="84" marker-end="url(#fg43-muted)" style="stroke:#5f6f82;stroke-width:1.2;stroke-linecap:round"/><line x1="508" y1="84" x2="127.48" y2="84" marker-end="url(#fg43-muted)" style="stroke:#5f6f82;stroke-width:1.2;stroke-linecap:round"/><text x="317.74" y="76" text-anchor="middle" style="fill:#5f6f82;font-size:11px;font-weight:700">9.5× the stop distance</text><line x1="60" y1="200" x2="620" y2="200" style="stroke:#cbd5e1;stroke-width:1.5;stroke-linecap:round"/><line x1="104.8" y1="196" x2="104.8" y2="204" style="stroke:#5f6f82;stroke-width:1;stroke-linecap:round"/><text x="104.8" y="218" text-anchor="middle" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">-20%</text><line x1="216.8" y1="196" x2="216.8" y2="204" style="stroke:#5f6f82;stroke-width:1;stroke-linecap:round"/><text x="216.8" y="218" text-anchor="middle" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">-15%</text><line x1="328.8" y1="196" x2="328.8" y2="204" style="stroke:#5f6f82;stroke-width:1;stroke-linecap:round"/><text x="328.8" y="218" text-anchor="middle" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">-10%</text><line x1="440.8" y1="196" x2="440.8" y2="204" style="stroke:#5f6f82;stroke-width:1;stroke-linecap:round"/><text x="440.8" y="218" text-anchor="middle" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">-5%</text><line x1="552.8" y1="196" x2="552.8" y2="204" style="stroke:#5f6f82;stroke-width:1;stroke-linecap:round"/><text x="552.8" y="218" text-anchor="middle" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">0%</text><text x="60" y="238" style="fill:#5f6f82;font-size:10.5px">the rule of thumb in this course: keep the liquidation at least three stop-distances away. Here it is nine.</text></svg>