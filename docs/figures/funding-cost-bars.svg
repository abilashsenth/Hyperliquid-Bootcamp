<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" role="img" aria-label="What a 1,000 dollar long pays per day at three hourly funding rates: 30 cents at the neutral rate, 2.40 dollars when crowded, and 960 dollars at the 4 percent cap" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="239" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg33-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg33-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg33-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg33-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg33-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg33-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg33-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><text x="20" y="26" style="fill:#f5f5f7;font-size:13px;font-weight:800">a $1,000 long, held, at three funding rates</text><text x="20" y="52" style="fill:#f5f5f7;font-size:12px;font-weight:700">neutral: 0.00125% an hour</text><rect x="20" y="60" width="34.52" height="18" rx="5" style="fill:#4fce8f;opacity:0.85"/><text x="62.52" y="73" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">$0.30 a day</text><text x="145.02" y="73" style="fill:#9f9fa0;font-size:10.5px">· $9 a month, 11% a year</text><text x="20" y="106" style="fill:#f5f5f7;font-size:12px;font-weight:700">crowded: 0.01% an hour</text><rect x="20" y="114" width="87.71" height="18" rx="5" style="fill:#e3a63d;opacity:0.85"/><text x="115.71" y="127" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">$2.40 a day</text><text x="198.21" y="127" style="fill:#9f9fa0;font-size:10.5px">· $72 a month, 88% a year</text><text x="20" y="160" style="fill:#f5f5f7;font-size:12px;font-weight:700">the cap: 4% an hour</text><rect x="20" y="168" width="400" height="18" rx="5" style="fill:#f47067;opacity:0.85"/><text x="428" y="181" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">$960 a day</text><text x="503" y="181" style="fill:#9f9fa0;font-size:10.5px">· the position is gone in a day</text><text x="20" y="222" style="fill:#9f9fa0;font-size:10.5px">bars are on a log scale. Funding is paid on the oracle notional, every hour, straight to the other side; the exchange keeps none of it.</text></svg>