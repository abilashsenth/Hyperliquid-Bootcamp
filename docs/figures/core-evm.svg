<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="One chain with two halves: HyperCore holds the order books, margin engine, spot, staking and vaults; HyperEVM runs apps; both sit on HyperBFT consensus, and a trader only needs HyperCore" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="640"><rect x="0.5" y="0.5" width="639" height="249" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg19-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg19-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg19-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg19-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg19-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg19-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg19-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><rect x="20" y="20" width="360" height="150" rx="14" style="fill:rgba(0,179,221,.16);stroke:#00b3dd;stroke-width:1.5"/><text x="36" y="46" style="fill:#00b3dd;font-size:15px;font-weight:800">HyperCore</text><text x="130" y="46" style="fill:#9f9fa0;font-size:11.5px">where trading happens</text><rect x="36" y="62" width="160" height="42" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b"/><text x="46" y="79" style="fill:#f5f5f7;font-size:12px;font-weight:700">order books</text><text x="46" y="95" style="fill:#9f9fa0;font-size:10px">one per asset, price-time priority</text><rect x="206" y="62" width="160" height="42" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b"/><text x="216" y="79" style="fill:#f5f5f7;font-size:12px;font-weight:700">clearinghouse</text><text x="216" y="95" style="fill:#9f9fa0;font-size:10px">margin, positions, liquidations</text><rect x="36" y="112" width="160" height="42" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b"/><text x="46" y="129" style="fill:#f5f5f7;font-size:12px;font-weight:700">oracle</text><text x="46" y="145" style="fill:#9f9fa0;font-size:10px">validators publish every ~3 s</text><rect x="206" y="112" width="160" height="42" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b"/><text x="216" y="129" style="fill:#f5f5f7;font-size:12px;font-weight:700">spot · staking · vaults</text><text x="216" y="145" style="fill:#9f9fa0;font-size:10px">HIP-1 tokens, HYPE staking, HLP</text><rect x="420" y="20" width="200" height="150" rx="14" style="fill:#3f4041;stroke:#6a6b6b;stroke-width:1.5"/><text x="436" y="46" style="fill:#f5f5f7;font-size:15px;font-weight:800">HyperEVM</text><text x="436" y="64" style="fill:#9f9fa0;font-size:11.5px">apps, lending, bridges</text><text x="436" y="96" style="fill:#9f9fa0;font-size:11.5px">an Ethereum-style chain</text><text x="436" y="112" style="fill:#9f9fa0;font-size:11.5px">that can read and write Core</text><text x="436" y="150" style="fill:#f5f5f7;font-size:12px;font-weight:800">not needed to trade</text><line x1="380" y1="95" x2="420" y2="95" marker-end="url(#fg19-muted)" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><line x1="420" y1="105" x2="380" y2="105" marker-end="url(#fg19-muted)" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><rect x="20" y="186" width="600" height="50" rx="10" style="fill:rgba(245,245,247,.09)"/><text x="320" y="206" text-anchor="middle" style="fill:#f5f5f7;font-size:11.5px;font-weight:700">HyperBFT consensus: one agreed order of every transaction</text><text x="320" y="224" text-anchor="middle" style="fill:#9f9fa0;font-size:10.5px">about 200,000 orders a second · median 0.2 s round trip · validators weighted by staked HYPE</text></svg>