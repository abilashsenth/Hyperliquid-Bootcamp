<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="One chain with two halves: HyperCore holds the order books, margin engine, spot, staking and vaults; HyperEVM runs apps; both sit on HyperBFT consensus, and a trader only needs HyperCore" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="640"><rect x="0" y="0" width="640" height="250" rx="12" style="fill:#ffffff"/><defs><marker id="fg19-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg19-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg19-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg19-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg19-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg19-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg19-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><rect x="20" y="20" width="360" height="150" rx="14" style="fill:rgba(59,91,219,.16);stroke:#3b5bdb;stroke-width:1.5"/><text x="36" y="46" style="fill:#3b5bdb;font-size:15px;font-weight:800">HyperCore</text><text x="130" y="46" style="fill:#5f6f82;font-size:11.5px">where trading happens</text><rect x="36" y="62" width="160" height="42" rx="8" style="fill:#ffffff;stroke:#cbd5e1"/><text x="46" y="79" style="fill:#0f1a2a;font-size:12px;font-weight:700">order books</text><text x="46" y="95" style="fill:#5f6f82;font-size:10px">one per asset, price-time priority</text><rect x="206" y="62" width="160" height="42" rx="8" style="fill:#ffffff;stroke:#cbd5e1"/><text x="216" y="79" style="fill:#0f1a2a;font-size:12px;font-weight:700">clearinghouse</text><text x="216" y="95" style="fill:#5f6f82;font-size:10px">margin, positions, liquidations</text><rect x="36" y="112" width="160" height="42" rx="8" style="fill:#ffffff;stroke:#cbd5e1"/><text x="46" y="129" style="fill:#0f1a2a;font-size:12px;font-weight:700">oracle</text><text x="46" y="145" style="fill:#5f6f82;font-size:10px">validators publish every ~3 s</text><rect x="206" y="112" width="160" height="42" rx="8" style="fill:#ffffff;stroke:#cbd5e1"/><text x="216" y="129" style="fill:#0f1a2a;font-size:12px;font-weight:700">spot · staking · vaults</text><text x="216" y="145" style="fill:#5f6f82;font-size:10px">HIP-1 tokens, HYPE staking, HLP</text><rect x="420" y="20" width="200" height="150" rx="14" style="fill:#eef2f6;stroke:#cbd5e1;stroke-width:1.5"/><text x="436" y="46" style="fill:#0f1a2a;font-size:15px;font-weight:800">HyperEVM</text><text x="436" y="64" style="fill:#5f6f82;font-size:11.5px">apps, lending, bridges</text><text x="436" y="96" style="fill:#5f6f82;font-size:11.5px">an Ethereum-style chain</text><text x="436" y="112" style="fill:#5f6f82;font-size:11.5px">that can read and write Core</text><text x="436" y="150" style="fill:#0f1a2a;font-size:12px;font-weight:800">not needed to trade</text><line x1="380" y1="95" x2="420" y2="95" marker-end="url(#fg19-muted)" style="stroke:#5f6f82;stroke-width:1.4;stroke-linecap:round"/><line x1="420" y1="105" x2="380" y2="105" marker-end="url(#fg19-muted)" style="stroke:#5f6f82;stroke-width:1.4;stroke-linecap:round"/><rect x="20" y="186" width="600" height="50" rx="10" style="fill:rgba(15,26,42,.09)"/><text x="320" y="206" text-anchor="middle" style="fill:#0f1a2a;font-size:11.5px;font-weight:700">HyperBFT consensus: one agreed order of every transaction</text><text x="320" y="224" text-anchor="middle" style="fill:#5f6f82;font-size:10.5px">about 200,000 orders a second · median 0.2 s round trip · validators weighted by staked HYPE</text></svg>