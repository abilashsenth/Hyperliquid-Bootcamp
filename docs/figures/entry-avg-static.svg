<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Four fills in a table: three opening buys move the entry price to their size-weighted average, 77,062.5, and a closing sell leaves it unchanged while realising 8.75 dollars before fees" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="640"><rect x="0" y="0" width="640" height="230" rx="12" style="fill:#ffffff"/><defs><marker id="fg16-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg16-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg16-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg16-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg16-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg16-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg16-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><text x="20" y="24" style="fill:#5f6f82;font-size:10.5px;font-weight:700">fill</text><text x="220" y="24" style="fill:#5f6f82;font-size:10.5px;font-weight:700">kind</text><text x="300" y="24" style="fill:#5f6f82;font-size:10.5px;font-weight:700">position after</text><text x="430" y="24" style="fill:#5f6f82;font-size:10.5px;font-weight:700">entry after</text><text x="540" y="24" style="fill:#5f6f82;font-size:10.5px;font-weight:700">closed PnL</text><line x1="20" y1="34" x2="620" y2="34" style="stroke:#e2e8f0;stroke-width:1;stroke-linecap:round"/><text x="20" y="54" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:500">buy 0.01 @ 77,250</text><text x="220" y="54" style="fill:#5f6f82;font-size:12px;font-weight:500">opening</text><text x="300" y="54" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:500">0.01 long</text><text x="430" y="54" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">77,250.0</text><text x="540" y="54" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:500"></text><line x1="20" y1="68" x2="620" y2="68" style="stroke:#e2e8f0;stroke-width:1;stroke-linecap:round"/><text x="20" y="88" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:500">buy 0.01 @ 78,000</text><text x="220" y="88" style="fill:#5f6f82;font-size:12px;font-weight:500">opening</text><text x="300" y="88" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:500">0.02 long</text><text x="430" y="88" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">77,625.0</text><text x="540" y="88" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:500"></text><line x1="20" y1="102" x2="620" y2="102" style="stroke:#e2e8f0;stroke-width:1;stroke-linecap:round"/><text x="20" y="122" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:500">buy 0.02 @ 76,500</text><text x="220" y="122" style="fill:#5f6f82;font-size:12px;font-weight:500">opening</text><text x="300" y="122" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:500">0.04 long</text><text x="430" y="122" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">77,062.5</text><text x="540" y="122" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:500"></text><line x1="20" y1="136" x2="620" y2="136" style="stroke:#e2e8f0;stroke-width:1;stroke-linecap:round"/><text x="20" y="156" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:500">sell 0.02 @ 77,500</text><text x="220" y="156" style="fill:#5f6f82;font-size:12px;font-weight:500">closing</text><text x="300" y="156" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:500">0.02 long</text><text x="430" y="156" style="fill:#3b5bdb;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:700">77,062.5</text><text x="540" y="156" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px;font-weight:500">+$8.75, less fee</text><text x="20" y="196" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11.5px">77,062.5 = (0.01 × 77,250 + 0.01 × 78,000 + 0.02 × 76,500) ÷ 0.04</text><text x="20" y="218" style="fill:#3b5bdb;font-size:11.5px;font-weight:700">the closing sell does not touch the entry price; it only turns part of the position into closed PnL</text></svg>