<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 256" role="img" aria-label="One journal entry drawn as a row of fields: when, market, setup, side, entry, stop, target, size, exit, fees, funding, the result in R, the adherence grade kept separate from PnL, the exit reason and one lesson" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="255" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg62-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg62-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg62-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg62-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg62-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg62-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg62-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><rect x="20" y="40" width="126" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="28" y="55" style="fill:#9f9fa0;font-size:9px;font-weight:700">when</text><text x="28" y="71" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">03/11 19:12 IST</text><rect x="152" y="40" width="54" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="160" y="55" style="fill:#9f9fa0;font-size:9px;font-weight:700">market</text><text x="160" y="71" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">BTC</text><rect x="212" y="40" width="104.4" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="220" y="55" style="fill:#9f9fa0;font-size:9px;font-weight:700">setup</text><text x="220" y="71" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">4h HL retest</text><rect x="322.4" y="40" width="54" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="330.4" y="55" style="fill:#9f9fa0;font-size:9px;font-weight:700">side</text><text x="330.4" y="71" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">long</text><rect x="382.4" y="40" width="61.2" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="390.4" y="55" style="fill:#9f9fa0;font-size:9px;font-weight:700">entry</text><text x="390.4" y="71" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">76,350</text><rect x="449.6" y="40" width="61.2" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="457.6" y="55" style="fill:#9f9fa0;font-size:9px;font-weight:700">stop</text><text x="457.6" y="71" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">75,900</text><rect x="516.8" y="40" width="61.2" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="524.8" y="55" style="fill:#9f9fa0;font-size:9px;font-weight:700">target</text><text x="524.8" y="71" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">77,700</text><rect x="20" y="98" width="61.2" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="28" y="113" style="fill:#9f9fa0;font-size:9px;font-weight:700">size</text><text x="28" y="129" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">0.0222</text><rect x="87.2" y="98" width="61.2" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="95.2" y="113" style="fill:#9f9fa0;font-size:9px;font-weight:700">exit</text><text x="95.2" y="129" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">77,700</text><rect x="154.4" y="98" width="54" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="162.4" y="113" style="fill:#9f9fa0;font-size:9px;font-weight:700">fees</text><text x="162.4" y="129" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">0.64</text><rect x="214.4" y="98" width="54" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="222.4" y="113" style="fill:#9f9fa0;font-size:9px;font-weight:700">funding</text><text x="222.4" y="129" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">0.11</text><rect x="274.4" y="98" width="54" height="40" rx="8" style="fill:rgba(79,206,143,.20);stroke:#6a6b6b;stroke-width:1.2"/><text x="282.4" y="113" style="fill:#9f9fa0;font-size:9px;font-weight:700">R</text><text x="282.4" y="129" style="fill:#4fce8f;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">+2.95</text><rect x="334.4" y="98" width="54" height="40" rx="8" style="fill:rgba(0,179,221,.16);stroke:#00b3dd;stroke-width:1.2"/><text x="342.4" y="113" style="fill:#9f9fa0;font-size:9px;font-weight:700">grade</text><text x="342.4" y="129" style="fill:#00b3dd;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">A</text><rect x="394.4" y="98" width="61.2" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="402.4" y="113" style="fill:#9f9fa0;font-size:9px;font-weight:700">reason</text><text x="402.4" y="129" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">target</text><rect x="20" y="156" width="277.2" height="40" rx="8" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="28" y="171" style="fill:#9f9fa0;font-size:9px;font-weight:700">lesson</text><text x="28" y="187" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">waited for the 4h close; no fiddling</text><text x="20" y="218" style="fill:#9f9fa0;font-size:10.5px">the grade is for following the plan, not for making money: an A on a −1R trade is a good trade; a C on a</text><text x="20" y="231" style="fill:#9f9fa0;font-size:10.5px">+3R trade is a lucky one. The Journal page computes R net of fees and funding and judges each block of</text><text x="20" y="244" style="fill:#9f9fa0;font-size:10.5px">20.</text></svg>