<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 190" role="img" aria-label="HYPE moving between the spot account, the staking account and validators: transfers in are instant, delegation locks for one day, and moving back to spot takes a seven-day queue; a link to the trading account is permanent" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="189" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg69-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg69-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg69-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg69-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg69-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg69-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg69-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><rect x="20" y="50" width="150" height="70" rx="10" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="95" y="72" text-anchor="middle" style="fill:#f5f5f7;font-size:12px;font-weight:800">spot account</text><text x="95" y="89" text-anchor="middle" style="fill:#9f9fa0;font-size:11px">HYPE you bought</text><line x1="170" y1="75" x2="230" y2="75" marker-end="url(#fg69-bid)" style="stroke:#4fce8f;stroke-width:1.5;stroke-linecap:round"/><text x="200" y="66" text-anchor="middle" style="fill:#4fce8f;font-size:10px;font-weight:700">instant</text><line x1="230" y1="96" x2="170" y2="96" marker-end="url(#fg69-ask)" style="stroke:#f47067;stroke-width:1.5;stroke-linecap:round"/><text x="200" y="126" text-anchor="middle" style="fill:#f47067;font-size:10px;font-weight:700">7-day queue</text><rect x="232" y="50" width="170" height="70" rx="10" style="fill:#2e2e2e;stroke:#00b3dd;stroke-width:1.2"/><text x="317" y="72" text-anchor="middle" style="fill:#f5f5f7;font-size:12px;font-weight:800">staking account</text><text x="317" y="89" text-anchor="middle" style="fill:#9f9fa0;font-size:11px">fee discount applies here</text><line x1="402" y1="85" x2="462" y2="85" marker-end="url(#fg69-muted)" style="stroke:#9f9fa0;stroke-width:1.5;stroke-linecap:round"/><text x="432" y="76" text-anchor="middle" style="fill:#9f9fa0;font-size:10px;font-weight:700">delegate</text><text x="432" y="104" text-anchor="middle" style="fill:#9f9fa0;font-size:9.5px">1-day lock</text><rect x="464" y="50" width="176" height="70" rx="10" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.2"/><text x="552" y="72" text-anchor="middle" style="fill:#f5f5f7;font-size:12px;font-weight:800">validators</text><text x="552" y="89" text-anchor="middle" style="fill:#9f9fa0;font-size:11px">rewards ≈ 2.4% a year</text><text x="552" y="104" text-anchor="middle" style="fill:#9f9fa0;font-size:11px">at 400M staked</text><text x="20" y="150" style="fill:#9f9fa0;font-size:10.5px">discounts: 5% at more than 10 HYPE up to 40% at more than 500,000. Linking a staking address to a trading</text><text x="20" y="163" style="fill:#9f9fa0;font-size:10.5px">address is permanent. Only worth it if you hold HYPE anyway.</text></svg>