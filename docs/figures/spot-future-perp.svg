<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" role="img" aria-label="Three rows: spot, where you own the coin now; a dated future, whose price converges to spot at expiry; and a perp, which never expires and is held near spot by hourly funding" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="270" rx="12" style="fill:#ffffff"/><defs><marker id="fg12-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg12-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg12-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg12-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg12-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg12-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg12-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><text x="20" y="58" style="fill:#0f1a2a;font-size:14px;font-weight:800">Spot</text><text x="20" y="75" style="fill:#5f6f82;font-size:11px">you own the coin</text><circle cx="170" cy="60" r="14" style="fill:rgba(192,122,12,.20);stroke:#c07a0c;stroke-width:1.5"/><text x="170" y="64" text-anchor="middle" style="fill:#c07a0c;font-size:11px;font-weight:800">1</text><text x="196" y="58" style="fill:#5f6f82;font-size:11.5px">one BTC in your wallet. Its price is whatever the market says today.</text><text x="196" y="74" style="fill:#5f6f82;font-size:11.5px">nothing to roll, nothing to settle, no leverage, no funding.</text><text x="20" y="138" style="fill:#0f1a2a;font-size:14px;font-weight:800">Dated future</text><text x="20" y="155" style="fill:#5f6f82;font-size:11px">a contract with an end date</text><line x1="150" y1="150" x2="630" y2="150" style="stroke:#c07a0c;stroke-width:1.5;stroke-dasharray:4 4;stroke-linecap:round"/><text x="630" y="146" text-anchor="end" style="fill:#c07a0c;font-size:10.5px">spot</text><path d="M150 118 C 300 118, 450 140, 550 150" style="fill:none;stroke:#0f1a2a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><line x1="550" y1="104" x2="550" y2="166" style="stroke:#5f6f82;stroke-width:1.2;stroke-linecap:round"/><text x="550" y="178" text-anchor="middle" style="fill:#5f6f82;font-size:10.5px">expiry: settles at spot</text><line x1="190" y1="122" x2="190" y2="150" marker-end="url(#fg12-you)" style="stroke:#3b5bdb;stroke-width:1.2;stroke-linecap:round"/><text x="198" y="166" style="fill:#3b5bdb;font-size:10.5px">basis: the gap to spot, shrinks to zero by the date</text><text x="20" y="228" style="fill:#0f1a2a;font-size:14px;font-weight:800">Perp</text><text x="20" y="245" style="fill:#5f6f82;font-size:11px">a future with no date</text><line x1="150" y1="240" x2="630" y2="240" style="stroke:#c07a0c;stroke-width:1.5;stroke-dasharray:4 4;stroke-linecap:round"/><text x="630" y="236" text-anchor="end" style="fill:#c07a0c;font-size:10.5px">spot</text><path d="M150 232 C 210 220, 260 252, 320 236 S 440 228, 490 246 S 590 232, 630 238" style="fill:none;stroke:#0f1a2a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><line x1="210" y1="212" x2="210" y2="230" marker-end="url(#fg12-muted)" style="stroke:#5f6f82;stroke-width:1.2;stroke-linecap:round"/><line x1="380" y1="268" x2="380" y2="250" marker-end="url(#fg12-muted)" style="stroke:#5f6f82;stroke-width:1.2;stroke-linecap:round"/><line x1="545" y1="212" x2="545" y2="230" marker-end="url(#fg12-muted)" style="stroke:#5f6f82;stroke-width:1.2;stroke-linecap:round"/><text x="220" y="212" style="fill:#5f6f82;font-size:10.5px">funding, every hour, nudges it back toward spot</text><text x="630" y="266" text-anchor="end" style="fill:#5f6f82;font-size:10.5px">no expiry: it runs forever</text></svg>