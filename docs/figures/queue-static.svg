<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="One price level drawn as a queue of resting orders; market sells eat from the front; cancelling and re-placing sends your order to the back behind newer orders" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="640"><rect x="0.5" y="0.5" width="639" height="229" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg7-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg7-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg7-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg7-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg7-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg7-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg7-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><text x="20" y="22" style="fill:#9f9fa0;font-size:12px">Bids resting at 77,249, oldest on the left</text><text x="20" y="44" style="fill:#f5f5f7;font-size:13px;font-weight:800">You join the back of the line</text><rect x="20" y="58" width="60" height="34" rx="7" style="fill:rgba(79,206,143,.20);stroke:#4fce8f;stroke-width:1.2"/><text x="50" y="79" text-anchor="middle" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px;font-weight:700">0.4</text><rect x="86" y="58" width="100" height="34" rx="7" style="fill:rgba(79,206,143,.20);stroke:#4fce8f;stroke-width:1.2"/><text x="136" y="79" text-anchor="middle" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px;font-weight:700">1.2</text><rect x="192" y="58" width="52.5" height="34" rx="7" style="fill:rgba(79,206,143,.20);stroke:#4fce8f;stroke-width:1.2"/><text x="218.25" y="79" text-anchor="middle" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px;font-weight:700">0.25</text><rect x="250.5" y="58" width="80" height="34" rx="7" style="fill:rgba(79,206,143,.20);stroke:#4fce8f;stroke-width:1.2"/><text x="290.5" y="79" text-anchor="middle" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px;font-weight:700">0.8</text><rect x="336.5" y="58" width="65" height="34" rx="7" style="fill:#00b3dd;stroke:#00b3dd;stroke-width:1.2"/><text x="369" y="79" text-anchor="middle" style="fill:#2e2e2e;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px;font-weight:700">you 0.5</text><line x1="8" y1="75" x2="18" y2="75" marker-end="url(#fg7-ask)" style="stroke:#f47067;stroke-width:2;stroke-linecap:round"/><text x="20" y="112" style="fill:#f47067;font-size:11.5px">market sells arrive here and eat from the front: 1.6 BTC of sells fills the first two orders, you still wait</text><text x="20" y="136" style="fill:#f5f5f7;font-size:13px;font-weight:800">After you cancel and re-place: back behind two newer orders</text><rect x="20" y="150" width="52.5" height="34" rx="7" style="fill:rgba(79,206,143,.20);stroke:#4fce8f;stroke-width:1.2"/><text x="46.25" y="171" text-anchor="middle" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px;font-weight:700">0.25</text><rect x="78.5" y="150" width="80" height="34" rx="7" style="fill:rgba(79,206,143,.20);stroke:#4fce8f;stroke-width:1.2"/><text x="118.5" y="171" text-anchor="middle" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px;font-weight:700">0.8</text><rect x="164.5" y="150" width="140" height="34" rx="7" style="fill:rgba(79,206,143,.20);stroke:#4fce8f;stroke-width:1.2"/><text x="234.5" y="171" text-anchor="middle" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px;font-weight:700">2</text><rect x="310.5" y="150" width="70" height="34" rx="7" style="fill:rgba(79,206,143,.20);stroke:#4fce8f;stroke-width:1.2"/><text x="345.5" y="171" text-anchor="middle" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px;font-weight:700">0.6</text><rect x="386.5" y="150" width="65" height="34" rx="7" style="fill:#00b3dd;stroke:#00b3dd;stroke-width:1.2"/><text x="419" y="171" text-anchor="middle" style="fill:#2e2e2e;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px;font-weight:700">you 0.5</text><text x="20" y="210" style="fill:#9f9fa0;font-size:11.5px">the order that was third in line is now fifth, at the same price, for the same size</text></svg>