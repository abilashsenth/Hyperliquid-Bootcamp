<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="The two PnL formulas as boxes with a worked example: unrealized PnL equals side times mark minus entry times size, closed PnL adds the fee" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="640"><rect x="0.5" y="0.5" width="639" height="209" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg17-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg17-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg17-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg17-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg17-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg17-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg17-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><text x="20" y="28" style="fill:#f5f5f7;font-size:14px;font-weight:800">unrealized PnL</text><rect x="20" y="42" width="90" height="46" rx="9" style="fill:#2e2e2e;stroke:#00b3dd;stroke-width:1.3"/><text x="65" y="60" text-anchor="middle" style="fill:#9f9fa0;font-size:10.5px">side</text><text x="65" y="79" text-anchor="middle" style="fill:#00b3dd;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:13px;font-weight:700">+1 (long)</text><text x="120" y="72" text-anchor="middle" style="fill:#f5f5f7;font-size:16px">×</text><rect x="130" y="42" width="110" height="46" rx="9" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.3"/><text x="185" y="60" text-anchor="middle" style="fill:#9f9fa0;font-size:10.5px">mark</text><text x="185" y="79" text-anchor="middle" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:13px;font-weight:700">78,000</text><text x="250" y="72" text-anchor="middle" style="fill:#f5f5f7;font-size:16px">−</text><rect x="260" y="42" width="110" height="46" rx="9" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.3"/><text x="315" y="60" text-anchor="middle" style="fill:#9f9fa0;font-size:10.5px">entry</text><text x="315" y="79" text-anchor="middle" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:13px;font-weight:700">77,062.5</text><text x="380" y="72" text-anchor="middle" style="fill:#f5f5f7;font-size:16px">×</text><rect x="390" y="42" width="90" height="46" rx="9" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.3"/><text x="435" y="60" text-anchor="middle" style="fill:#9f9fa0;font-size:10.5px">size</text><text x="435" y="79" text-anchor="middle" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:13px;font-weight:700">0.02</text><text x="490" y="72" text-anchor="middle" style="fill:#f5f5f7;font-size:16px">=</text><rect x="500" y="42" width="120" height="46" rx="9" style="fill:#2e2e2e;stroke:#4fce8f;stroke-width:1.3"/><text x="560" y="60" text-anchor="middle" style="fill:#9f9fa0;font-size:10.5px">unrealized</text><text x="560" y="79" text-anchor="middle" style="fill:#4fce8f;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:13px;font-weight:700">+$18.75</text><text x="20" y="122" style="fill:#f5f5f7;font-size:14px;font-weight:800">closed PnL on a closing fill</text><text x="20" y="148" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12.5px">closed PnL = side × (fill price − entry) × size closed − fee</text><text x="20" y="170" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:12px">sell 0.02 at 77,500 as a taker: (77,500 − 77,062.5) × 0.02 − $0.70 fee = +$8.05</text><text x="20" y="196" style="fill:#9f9fa0;font-size:11.5px">mark, not the last trade, feeds the unrealized number. That is why it can move while the book does not.</text></svg>