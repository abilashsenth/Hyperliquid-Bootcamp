<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="The two PnL formulas as boxes with a worked example: unrealized PnL equals side times mark minus entry times size, closed PnL adds the fee" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="640"><rect x="0" y="0" width="640" height="210" rx="12" style="fill:#ffffff"/><defs><marker id="fg17-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg17-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg17-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg17-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg17-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg17-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg17-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><text x="20" y="28" style="fill:#0f1a2a;font-size:14px;font-weight:800">unrealized PnL</text><rect x="20" y="42" width="90" height="46" rx="9" style="fill:#ffffff;stroke:#3b5bdb;stroke-width:1.3"/><text x="65" y="60" text-anchor="middle" style="fill:#5f6f82;font-size:10.5px">side</text><text x="65" y="79" text-anchor="middle" style="fill:#3b5bdb;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:13px;font-weight:700">+1 (long)</text><text x="120" y="72" text-anchor="middle" style="fill:#0f1a2a;font-size:16px">×</text><rect x="130" y="42" width="110" height="46" rx="9" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="185" y="60" text-anchor="middle" style="fill:#5f6f82;font-size:10.5px">mark</text><text x="185" y="79" text-anchor="middle" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:13px;font-weight:700">78,000</text><text x="250" y="72" text-anchor="middle" style="fill:#0f1a2a;font-size:16px">−</text><rect x="260" y="42" width="110" height="46" rx="9" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="315" y="60" text-anchor="middle" style="fill:#5f6f82;font-size:10.5px">entry</text><text x="315" y="79" text-anchor="middle" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:13px;font-weight:700">77,062.5</text><text x="380" y="72" text-anchor="middle" style="fill:#0f1a2a;font-size:16px">×</text><rect x="390" y="42" width="90" height="46" rx="9" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="435" y="60" text-anchor="middle" style="fill:#5f6f82;font-size:10.5px">size</text><text x="435" y="79" text-anchor="middle" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:13px;font-weight:700">0.02</text><text x="490" y="72" text-anchor="middle" style="fill:#0f1a2a;font-size:16px">=</text><rect x="500" y="42" width="120" height="46" rx="9" style="fill:#ffffff;stroke:#15934f;stroke-width:1.3"/><text x="560" y="60" text-anchor="middle" style="fill:#5f6f82;font-size:10.5px">unrealized</text><text x="560" y="79" text-anchor="middle" style="fill:#15934f;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:13px;font-weight:700">+$18.75</text><text x="20" y="122" style="fill:#0f1a2a;font-size:14px;font-weight:800">closed PnL on a closing fill</text><text x="20" y="148" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12.5px">closed PnL = side × (fill price − entry) × size closed − fee</text><text x="20" y="170" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:12px">sell 0.02 at 77,500 as a taker: (77,500 − 77,062.5) × 0.02 − $0.70 fee = +$8.05</text><text x="20" y="196" style="fill:#5f6f82;font-size:11.5px">mark, not the last trade, feeds the unrealized number. That is why it can move while the book does not.</text></svg>