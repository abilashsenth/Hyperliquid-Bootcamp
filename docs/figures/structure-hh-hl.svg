<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" role="img" aria-label="A price path making higher highs and higher lows with each swing labelled; the most recent higher low is marked as the level that invalidates the uptrend" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="260" rx="12" style="fill:#ffffff"/><defs><marker id="fg53-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg53-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg53-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg53-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg53-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg53-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg53-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><path d="M40 200 L120 120 L170 160 L260 90 L320 140 L410 60 L470 110 L560 40 L620 80" style="fill:none;stroke:#0f1a2a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><circle cx="120" cy="120" r="4.5" style="fill:#15934f"/><text x="120" y="110" text-anchor="middle" style="fill:#15934f;font-size:10.5px;font-weight:800">HH</text><circle cx="170" cy="160" r="4.5" style="fill:#d0392b"/><text x="170" y="178" text-anchor="middle" style="fill:#d0392b;font-size:10.5px;font-weight:800">HL</text><circle cx="260" cy="90" r="4.5" style="fill:#15934f"/><text x="260" y="80" text-anchor="middle" style="fill:#15934f;font-size:10.5px;font-weight:800">HH</text><circle cx="320" cy="140" r="4.5" style="fill:#d0392b"/><text x="320" y="158" text-anchor="middle" style="fill:#d0392b;font-size:10.5px;font-weight:800">HL</text><circle cx="410" cy="60" r="4.5" style="fill:#15934f"/><text x="410" y="50" text-anchor="middle" style="fill:#15934f;font-size:10.5px;font-weight:800">HH</text><circle cx="470" cy="110" r="4.5" style="fill:#d0392b"/><text x="470" y="128" text-anchor="middle" style="fill:#d0392b;font-size:10.5px;font-weight:800">HL</text><circle cx="560" cy="40" r="4.5" style="fill:#15934f"/><text x="560" y="30" text-anchor="middle" style="fill:#15934f;font-size:10.5px;font-weight:800">HH</text><line x1="440" y1="110" x2="640" y2="110" style="stroke:#3b5bdb;stroke-width:1.5;stroke-dasharray:6 4;stroke-linecap:round"/><rect x="435" y="117.75" width="210" height="20.5" rx="10.25" style="fill:#3b5bdb"/><text x="540" y="131.78" text-anchor="middle" style="fill:#ffffff;font-size:10.5px;font-weight:700">invalidation: the last higher low</text><rect x="236" y="84" width="180" height="12" rx="3" style="fill:rgba(192,122,12,.20)"/><text x="222" y="60" text-anchor="end" style="fill:#c07a0c;font-size:9.5px">a zone where the book got heavy</text><text x="222" y="71" text-anchor="end" style="fill:#c07a0c;font-size:9.5px">before: resistance, then</text><text x="222" y="82" text-anchor="end" style="fill:#c07a0c;font-size:9.5px">support</text><text x="40" y="234" style="fill:#5f6f82;font-size:10.5px">higher highs and higher lows make an uptrend. The trend is wrong, by definition, the moment price</text><text x="40" y="247" style="fill:#5f6f82;font-size:10.5px">closes below the last higher low.</text></svg>