<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 150" role="img" aria-label="A sentence template for a daily market note with four blanks: the bias, the level that holds it, the evidence from open interest and funding, and the invalidation level" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="149" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg57-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg57-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg57-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg57-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg57-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg57-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg57-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><text x="22" y="60" style="fill:#9f9fa0;font-size:13px;font-weight:500">BTC is</text><rect x="74.4" y="42" width="58.4" height="26" rx="7" style="fill:rgba(0,179,221,.16)"/><text x="81.4" y="60" style="fill:#00b3dd;font-size:13px;font-weight:800">[bias]</text><text x="140.8" y="60" style="fill:#9f9fa0;font-size:13px;font-weight:500">while</text><rect x="185.8" y="42" width="65.8" height="26" rx="7" style="fill:rgba(0,179,221,.16)"/><text x="192.8" y="60" style="fill:#00b3dd;font-size:13px;font-weight:800">[level]</text><text x="259.6" y="60" style="fill:#9f9fa0;font-size:13px;font-weight:500">holds, because</text><rect x="371.2" y="42" width="199" height="26" rx="7" style="fill:rgba(0,179,221,.16)"/><text x="378.2" y="60" style="fill:#00b3dd;font-size:13px;font-weight:800">[what OI and funding say]</text><text x="578.2" y="60" style="fill:#9f9fa0;font-size:13px;font-weight:500">. Wrong below</text><rect x="682.4" y="42" width="117.6" height="26" rx="7" style="fill:rgba(244,112,103,.18)"/><text x="689.4" y="60" style="fill:#f47067;font-size:13px;font-weight:800">[invalidation]</text><text x="808" y="60" style="fill:#9f9fa0;font-size:13px;font-weight:500">.</text><text x="20" y="108" style="fill:#9f9fa0;font-size:11px">example: “BTC is bullish while 76,200 holds, because OI is rising with price and funding is still</text><text x="20" y="122" style="fill:#9f9fa0;font-size:11px">near neutral. Wrong below 75,900.” One sentence, graded at 00:00 UTC.</text></svg>