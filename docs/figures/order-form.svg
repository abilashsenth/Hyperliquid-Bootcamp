<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="A schematic of the order form: tabs for Market, Limit and Pro; the Buy/Long and Sell/Short toggle; size with a unit toggle; the leverage and margin mode control; reduce-only and TP/SL options; the place-order button and the cost summary" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="640"><rect x="0.5" y="0.5" width="639" height="329" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg21-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg21-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg21-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg21-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg21-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg21-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg21-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><rect x="30" y="16" width="270" height="300" rx="12" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1.3"/><rect x="40" y="26" width="250" height="24" rx="6" style="fill:#3f4041"/><text x="52" y="42" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px;font-weight:700">Market    Limit    Pro ▾</text><rect x="40" y="58" width="123" height="24" rx="6" style="fill:rgba(79,206,143,.20)"/><text x="102.5" y="74" text-anchor="middle" style="fill:#4fce8f;font-size:11.5px;font-weight:800">Buy / Long</text><rect x="167" y="58" width="123" height="24" rx="6" style="fill:#3f4041"/><text x="227.5" y="74" text-anchor="middle" style="fill:#9f9fa0;font-size:11.5px;font-weight:800">Sell / Short</text><text x="44" y="102" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px">Available to trade        1,000.00</text><rect x="40" y="112" width="250" height="26" rx="6" style="fill:#2e2e2e;stroke:#6a6b6b"/><text x="44" y="129" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px">Size                 0.01   BTC ▾</text><line x1="44" y1="152" x2="286" y2="152" style="stroke:#6a6b6b;stroke-width:3;stroke-linecap:round"/><circle cx="100" cy="152" r="6" style="fill:#00b3dd"/><text x="44" y="176" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px">Cross ▾      5x ▾</text><text x="44" y="200" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px">☐ Reduce Only         ☐ TP / SL</text><rect x="40" y="212" width="250" height="30" rx="8" style="fill:#00b3dd"/><text x="165" y="232" text-anchor="middle" style="fill:#2e2e2e;font-size:12.5px;font-weight:800">Place order</text><text x="44" y="262" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px">Order value   $772.50</text><text x="44" y="278" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px">Margin required  $154.50</text><text x="44" y="294" style="fill:#f5f5f7;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px">Slippage  est. 0.01%   Fees  0.045%</text><line x1="306" y1="38" x2="326" y2="38" style="stroke:#9f9fa0;stroke-width:1;stroke-linecap:round"/><text x="332" y="42" style="fill:#9f9fa0;font-size:11px">order type. Pro hides Scale, TWAP, Stop and</text><text x="332" y="56" style="fill:#9f9fa0;font-size:11px">Take, Chase, Trailing</text><line x1="306" y1="68" x2="326" y2="68" style="stroke:#9f9fa0;stroke-width:1;stroke-linecap:round"/><text x="332" y="72" style="fill:#9f9fa0;font-size:11px">direction. Selling while flat opens a short</text><line x1="306" y1="125" x2="326" y2="125" style="stroke:#9f9fa0;stroke-width:1;stroke-linecap:round"/><text x="332" y="129" style="fill:#9f9fa0;font-size:11px">size in coins or in dollars; the slider is a</text><text x="332" y="143" style="fill:#9f9fa0;font-size:11px">share of your margin, not of your risk</text><line x1="306" y1="172" x2="326" y2="172" style="stroke:#9f9fa0;stroke-width:1;stroke-linecap:round"/><text x="332" y="176" style="fill:#9f9fa0;font-size:11px">margin mode and leverage (Layer 4)</text><line x1="306" y1="196" x2="326" y2="196" style="stroke:#9f9fa0;stroke-width:1;stroke-linecap:round"/><text x="332" y="200" style="fill:#9f9fa0;font-size:11px">reduce-only can only shrink a position; TP/SL</text><text x="332" y="214" style="fill:#9f9fa0;font-size:11px">attaches exits to this order</text><line x1="306" y1="228" x2="326" y2="228" style="stroke:#9f9fa0;stroke-width:1;stroke-linecap:round"/><text x="332" y="232" style="fill:#9f9fa0;font-size:11px">a confirm dialog follows, until you tick “don’t</text><text x="332" y="246" style="fill:#9f9fa0;font-size:11px">show again”</text><line x1="306" y1="276" x2="326" y2="276" style="stroke:#9f9fa0;stroke-width:1;stroke-linecap:round"/><text x="332" y="280" style="fill:#9f9fa0;font-size:11px">read this box before every order: value,</text><text x="332" y="294" style="fill:#9f9fa0;font-size:11px">margin, slippage, fee</text></svg>