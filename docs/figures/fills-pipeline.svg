<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 170" role="img" aria-label="A pipeline from the exchange through one POST request to the info endpoint, a ten-line script, a CSV file, and into the journal, where you type only the setup, the grade and the lesson" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="170" rx="12" style="fill:#ffffff"/><defs><marker id="fg71-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg71-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg71-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg71-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg71-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg71-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg71-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><rect x="16" y="40" width="116" height="60" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="74" y="64" text-anchor="middle" style="fill:#0f1a2a;font-size:11.5px;font-weight:800">Hyperliquid</text><text x="74" y="84" text-anchor="middle" style="fill:#5f6f82;font-size:9px">your fills and funding</text><line x1="133" y1="70" x2="143" y2="70" marker-end="url(#fg71-muted)" style="stroke:#5f6f82;stroke-width:1.3;stroke-linecap:round"/><rect x="144" y="40" width="116" height="60" rx="10" style="fill:#ffffff;stroke:#3b5bdb;stroke-width:1.3"/><text x="202" y="64" text-anchor="middle" style="fill:#0f1a2a;font-size:11.5px;font-weight:800">POST /info</text><text x="202" y="84" text-anchor="middle" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:9px">{&quot;type&quot;:&quot;userFills&quot;}</text><line x1="261" y1="70" x2="271" y2="70" marker-end="url(#fg71-muted)" style="stroke:#5f6f82;stroke-width:1.3;stroke-linecap:round"/><rect x="272" y="40" width="116" height="60" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="330" y="64" text-anchor="middle" style="fill:#0f1a2a;font-size:11.5px;font-weight:800">a short script</text><text x="330" y="84" text-anchor="middle" style="fill:#5f6f82;font-size:9px">Python or anything</text><line x1="389" y1="70" x2="399" y2="70" marker-end="url(#fg71-muted)" style="stroke:#5f6f82;stroke-width:1.3;stroke-linecap:round"/><rect x="400" y="40" width="116" height="60" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="458" y="64" text-anchor="middle" style="fill:#0f1a2a;font-size:11.5px;font-weight:800">fills.csv</text><text x="458" y="84" text-anchor="middle" style="fill:#5f6f82;font-size:9px">the journal’s columns</text><line x1="517" y1="70" x2="527" y2="70" marker-end="url(#fg71-muted)" style="stroke:#5f6f82;stroke-width:1.3;stroke-linecap:round"/><rect x="528" y="40" width="116" height="60" rx="10" style="fill:#ffffff;stroke:#15934f;stroke-width:1.3"/><text x="586" y="64" text-anchor="middle" style="fill:#0f1a2a;font-size:11.5px;font-weight:800">the Journal</text><text x="586" y="84" text-anchor="middle" style="fill:#5f6f82;font-size:8.5px">you add setup, grade, lesson</text><text x="16" y="134" style="fill:#0f1a2a;font-size:11px;font-weight:700">read-only. No signing, no private key, no order placement: the info endpoint only answers questions.</text><text x="16" y="154" style="fill:#5f6f82;font-size:10.5px">this is the only API use the course asks for. A bot automates whatever edge you already have, including none.</text></svg>