<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" role="img" aria-label="Two price lines over time, the last trade on Hyperliquid and the mark price; the mark crosses a stop trigger first and fires the stop at a price the Hyperliquid book never traded" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="640"><rect x="0" y="0" width="640" height="276" rx="12" style="fill:#ffffff"/><defs><marker id="fg23-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg23-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg23-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg23-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg23-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg23-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg23-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><line x1="40" y1="140" x2="600" y2="140" style="stroke:#3b5bdb;stroke-width:1.5;stroke-dasharray:6 4;stroke-linecap:round"/><text x="600" y="134" text-anchor="end" style="fill:#3b5bdb;font-size:11px;font-weight:700">your stop trigger</text><path d="M40 72 L120 72 L180 86 L260 100 L320 118 L360 128 L400 136 L460 130 L520 116 L600 110" style="fill:none;stroke:#5f6f82;stroke-width:2;stroke-dasharray:2 4;stroke-linecap:round;stroke-linejoin:round"/><path d="M40 70 C53.33 71.33 93.33 74.33 120 78 C146.67 81.67 176.67 86.67 200 92 C223.33 97.33 241.67 104 260 110 C278.33 116 296.67 122.83 310 128 C323.33 133.17 328.33 137.33 340 141 C351.67 144.67 363.33 149.83 380 150 C396.67 150.17 416.67 147 440 142 C463.33 137 493.33 125 520 120 C546.67 115 586.67 113.33 600 112" style="fill:none;stroke:#0f1a2a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><circle cx="338" cy="141" r="6" style="fill:#3b5bdb"/><line x1="338" y1="141" x2="338" y2="200" style="stroke:#3b5bdb;stroke-width:1;stroke-dasharray:3 3;stroke-linecap:round"/><rect x="271.5" y="203.5" width="133" height="21" rx="10.5" style="fill:#3b5bdb"/><text x="338" y="217.96" text-anchor="middle" style="fill:#ffffff;font-size:11px;font-weight:700">fires here, on mark</text><text x="60" y="56" style="fill:#0f1a2a;font-size:11px;font-weight:700">mark price (built mostly from other exchanges)</text><text x="400" y="92" style="fill:#5f6f82;font-size:11px">last trade on Hyperliquid, lagging</text><text x="40" y="244" style="fill:#5f6f82;font-size:11px">the Hyperliquid book never printed the trigger price, and the stop still fired. A market</text><text x="40" y="258" style="fill:#5f6f82;font-size:11px">TP/SL then fills with up to 10% slippage allowed.</text></svg>