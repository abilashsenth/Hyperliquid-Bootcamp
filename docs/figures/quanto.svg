<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" role="img" aria-label="Two rulers slightly offset: the oracle quotes BTC in USDT at 77,241, your collateral is USDC, and no conversion is applied between them" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="620"><rect x="0.5" y="0.5" width="619" height="149" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg18-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg18-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg18-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg18-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg18-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg18-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg18-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><text x="20" y="26" style="fill:#9f9fa0;font-size:11px;font-weight:700">what the oracle quotes</text><rect x="20" y="34" width="280" height="30" rx="8" style="fill:rgba(227,166,61,.20)"/><text x="160" y="54" text-anchor="middle" style="fill:#e3a63d;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:13px;font-weight:700">BTC = 77,241.0 USDT</text><text x="340" y="26" style="fill:#9f9fa0;font-size:11px;font-weight:700">what you post and receive</text><rect x="340" y="34" width="260" height="30" rx="8" style="fill:rgba(0,179,221,.16)"/><text x="470" y="54" text-anchor="middle" style="fill:#00b3dd;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:13px;font-weight:700">USDC, 1 for 1</text><line x1="300" y1="49" x2="340" y2="49" style="stroke:#9f9fa0;stroke-width:1.2;stroke-dasharray:3 3;stroke-linecap:round"/><text x="20" y="96" style="fill:#9f9fa0;font-size:11.5px">USDT and USDC usually trade within a few hundredths of a percent of each other,</text><text x="20" y="114" style="fill:#9f9fa0;font-size:11.5px">and the exchange does not convert. So the mark can sit a few dollars from the USD price elsewhere.</text><text x="20" y="138" style="fill:#9f9fa0;font-size:11.5px">Normal, permanent, not a signal. HYPE and PURR perps are the exception: quoted in USDC directly.</text></svg>