<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-label="Three estimates feed the mark price: the oracle plus a smoothed Hyperliquid premium, the median of Hyperliquid’s best bid, best ask and last trade, and a weighted median of the big exchanges’ perp prices; the mark is the median of the three" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="299" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg31-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg31-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg31-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg31-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg31-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg31-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg31-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><rect x="20" y="24" width="300" height="50" rx="10" style="fill:#2e2e2e;stroke:#e3a63d;stroke-width:1.4"/><text x="32" y="44" style="fill:#f5f5f7;font-size:12px;font-weight:800">1 · oracle + premium</text><text x="32" y="61" style="fill:#9f9fa0;font-size:10px">oracle price plus a 150-second EMA of</text><text x="32" y="73" style="fill:#9f9fa0;font-size:10px">(Hyperliquid mid − oracle)</text><line x1="320" y1="49" x2="380" y2="118" marker-end="url(#fg31-muted)" style="stroke:#9f9fa0;stroke-width:1.2;stroke-linecap:round"/><rect x="20" y="86" width="300" height="50" rx="10" style="fill:#2e2e2e;stroke:#4fce8f;stroke-width:1.4"/><text x="32" y="106" style="fill:#f5f5f7;font-size:12px;font-weight:800">2 · Hyperliquid’s own book</text><text x="32" y="123" style="fill:#9f9fa0;font-size:10px">median of best bid, best ask and last trade here</text><line x1="320" y1="111" x2="380" y2="118" marker-end="url(#fg31-muted)" style="stroke:#9f9fa0;stroke-width:1.2;stroke-linecap:round"/><rect x="20" y="148" width="300" height="50" rx="10" style="fill:#2e2e2e;stroke:#00b3dd;stroke-width:1.4"/><text x="32" y="168" style="fill:#f5f5f7;font-size:12px;font-weight:800">3 · other exchanges’ perps</text><text x="32" y="185" style="fill:#9f9fa0;font-size:10px">weighted median of Binance 3, OKX 2, Bybit 2,</text><text x="32" y="197" style="fill:#9f9fa0;font-size:10px">Gate 1, MEXC 1</text><line x1="320" y1="173" x2="380" y2="118" marker-end="url(#fg31-muted)" style="stroke:#9f9fa0;stroke-width:1.2;stroke-linecap:round"/><rect x="382" y="86" width="120" height="64" rx="10" style="fill:#2e2e2e;stroke:#f5f5f7;stroke-width:1.2"/><text x="442" y="108" text-anchor="middle" style="fill:#f5f5f7;font-size:13px;font-weight:800">median</text><text x="442" y="126" text-anchor="middle" style="fill:#9f9fa0;font-size:12px">of the three</text><line x1="502" y1="118" x2="540" y2="118" marker-end="url(#fg31-ink)" style="stroke:#f5f5f7;stroke-width:1.6;stroke-linecap:round"/><rect x="542" y="80" width="100" height="76" rx="10" style="fill:rgba(245,245,247,.09);stroke:#f5f5f7;stroke-width:1.2"/><text x="592" y="102" text-anchor="middle" style="fill:#f5f5f7;font-size:13px;font-weight:800">mark price</text><text x="592" y="120" text-anchor="middle" style="fill:#9f9fa0;font-size:12px">every ~3 s</text><text x="382" y="182" style="fill:#f5f5f7;font-size:11px;font-weight:800">used for</text><text x="382" y="200" style="fill:#9f9fa0;font-size:11px">· liquidations</text><text x="382" y="216" style="fill:#9f9fa0;font-size:11px">· TP/SL and stop triggers</text><text x="382" y="232" style="fill:#9f9fa0;font-size:11px">· unrealized PnL</text><text x="382" y="248" style="fill:#9f9fa0;font-size:11px">· margin checks</text><text x="20" y="232" style="fill:#9f9fa0;font-size:10.5px">why a median: a spike in any one input is ignored unless</text><text x="20" y="245" style="fill:#9f9fa0;font-size:10.5px">the other two agree. A wick on Hyperliquid alone barely</text><text x="20" y="258" style="fill:#9f9fa0;font-size:10.5px">moves the mark; a move on Binance and Bybit moves it</text><text x="20" y="271" style="fill:#9f9fa0;font-size:10.5px">within seconds. If only two inputs exist, a 30-second EMA</text><text x="20" y="284" style="fill:#9f9fa0;font-size:10.5px">of the Hyperliquid book median is added as a third.</text></svg>