<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" role="img" aria-label="A HIP-3 stock perp over a weekend: the underlying is closed and the deployer’s oracle holds still while the perp drifts above it, then the stock opens and the oracle and the perp snap together" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="239" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg51-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg51-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg51-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg51-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg51-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg51-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg51-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><rect x="40" y="40" width="359.6" height="150" style="fill:rgba(245,245,247,.09);opacity:0.5"/><text x="219.8" y="56" text-anchor="middle" style="fill:#9f9fa0;font-size:11px;font-weight:700">underlying closed (weekend)</text><text x="509.8" y="56" text-anchor="middle" style="fill:#9f9fa0;font-size:11px;font-weight:700">underlying open</text><line x1="40" y1="130" x2="399.6" y2="130" style="stroke:#e3a63d;stroke-width:2.5;stroke-linecap:round"/><path d="M399.6 130 L411.2 104 L446 108 L504 100 L620 102" style="fill:none;stroke:#e3a63d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/><polyline points="40,126 51.6,128.54 63.2,120.77 74.8,121.58 86.4,125.56 98,118.32 109.6,117.25 121.2,122.26 132.8,116.05 144.4,113.1 156,118.65 167.6,113.86 179.2,109.18 190.8,114.75 202.4,111.68 214,105.55 225.6,110.61 237.2,109.42 248.8,102.23 260.4,106.29 272,106.98 283.6,99.23 295.2,101.87 306.8,104.31 318.4,96.53 330,97.45 341.6,101.35 353.2,94.06 364.8,93.11 376.4,98.07 388,91.78 399.6,88.94 411.2,103 446,107 504,101 620,102" style="fill:none;stroke:#f5f5f7;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><text x="69" y="148" style="fill:#e3a63d;font-size:10.5px;font-weight:700">oracle: frozen at Friday’s close</text><text x="69" y="86" style="fill:#f5f5f7;font-size:10.5px;font-weight:700">perp: drifts on weekend news, premium builds, funding grows</text><circle cx="399.6" cy="130" r="6" style="fill:#00b3dd"/><text x="399.6" y="166" text-anchor="middle" style="fill:#00b3dd;font-size:10.5px;font-weight:700">the open: both snap to the real print</text><text x="40" y="212" style="fill:#9f9fa0;font-size:10.5px">the deployer, not the validators, runs this oracle. Do not hold a HIP-3 stock or index perp</text><text x="40" y="225" style="fill:#9f9fa0;font-size:10.5px">through its underlying’s open unless the open itself is the trade (Layer 8).</text></svg>