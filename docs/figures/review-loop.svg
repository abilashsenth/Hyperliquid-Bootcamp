<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" role="img" aria-label="A loop: twenty journaled trades feed a thirty-minute weekly review that reads expectancy and adherence, names the best and worst trade and changes at most one rule, which feeds the next block; nothing else changes between reviews" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="229" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg63-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg63-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg63-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg63-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg63-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg63-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg63-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><rect x="30" y="70" width="170" height="80" rx="10" style="fill:#2e2e2e;stroke:#00b3dd;stroke-width:1.2"/><text x="115" y="92" text-anchor="middle" style="fill:#f5f5f7;font-size:13px;font-weight:800">20 trades</text><text x="115" y="110" text-anchor="middle" style="fill:#9f9fa0;font-size:12px">every one journaled</text><text x="115" y="126" text-anchor="middle" style="fill:#9f9fa0;font-size:12px">and graded</text><line x1="200" y1="110" x2="240" y2="110" marker-end="url(#fg63-ink)" style="stroke:#f5f5f7;stroke-width:1.6;stroke-linecap:round"/><rect x="242" y="40" width="200" height="140" rx="10" style="fill:#2e2e2e;stroke:#f5f5f7;stroke-width:1.2"/><text x="342" y="62" text-anchor="middle" style="fill:#f5f5f7;font-size:13px;font-weight:800">the review, 30 minutes</text><text x="342" y="80" text-anchor="middle" style="fill:#9f9fa0;font-size:12px">expectancy and adherence</text><text x="342" y="96" text-anchor="middle" style="fill:#9f9fa0;font-size:12px">the best and the worst trade</text><text x="342" y="112" text-anchor="middle" style="fill:#9f9fa0;font-size:12px">why each went the way it did</text><text x="342" y="128" text-anchor="middle" style="fill:#9f9fa0;font-size:12px">one rule to add or remove</text><line x1="442" y1="110" x2="482" y2="110" marker-end="url(#fg63-ink)" style="stroke:#f5f5f7;stroke-width:1.6;stroke-linecap:round"/><rect x="484" y="70" width="150" height="80" rx="10" style="fill:#2e2e2e;stroke:#4fce8f;stroke-width:1.2"/><text x="559" y="92" text-anchor="middle" style="fill:#f5f5f7;font-size:13px;font-weight:800">next block</text><text x="559" y="110" text-anchor="middle" style="fill:#9f9fa0;font-size:12px">same plan, one</text><text x="559" y="126" text-anchor="middle" style="fill:#9f9fa0;font-size:12px">rule different</text><path d="M559 150 C559 215 115 215 115 152" marker-end="url(#fg63-muted)" style="fill:none;stroke:#9f9fa0;stroke-width:1.3;stroke-dasharray:5 4;stroke-linecap:round;stroke-linejoin:round"/><text x="330" y="212" text-anchor="middle" style="fill:#9f9fa0;font-size:11px;font-weight:700">nothing else changes between reviews. Not the risk, not the setups, not the size.</text></svg>