<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" role="img" aria-label="A loop: twenty journaled trades feed a thirty-minute weekly review that reads expectancy and adherence, names the best and worst trade and changes at most one rule, which feeds the next block; nothing else changes between reviews" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="230" rx="12" style="fill:#ffffff"/><defs><marker id="fg63-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg63-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg63-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg63-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg63-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg63-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg63-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><rect x="30" y="70" width="170" height="80" rx="10" style="fill:#ffffff;stroke:#3b5bdb;stroke-width:1.2"/><text x="115" y="92" text-anchor="middle" style="fill:#0f1a2a;font-size:13px;font-weight:800">20 trades</text><text x="115" y="110" text-anchor="middle" style="fill:#5f6f82;font-size:12px">every one journaled</text><text x="115" y="126" text-anchor="middle" style="fill:#5f6f82;font-size:12px">and graded</text><line x1="200" y1="110" x2="240" y2="110" marker-end="url(#fg63-ink)" style="stroke:#0f1a2a;stroke-width:1.6;stroke-linecap:round"/><rect x="242" y="40" width="200" height="140" rx="10" style="fill:#ffffff;stroke:#0f1a2a;stroke-width:1.2"/><text x="342" y="62" text-anchor="middle" style="fill:#0f1a2a;font-size:13px;font-weight:800">the review, 30 minutes</text><text x="342" y="80" text-anchor="middle" style="fill:#5f6f82;font-size:12px">expectancy and adherence</text><text x="342" y="96" text-anchor="middle" style="fill:#5f6f82;font-size:12px">the best and the worst trade</text><text x="342" y="112" text-anchor="middle" style="fill:#5f6f82;font-size:12px">why each went the way it did</text><text x="342" y="128" text-anchor="middle" style="fill:#5f6f82;font-size:12px">one rule to add or remove</text><line x1="442" y1="110" x2="482" y2="110" marker-end="url(#fg63-ink)" style="stroke:#0f1a2a;stroke-width:1.6;stroke-linecap:round"/><rect x="484" y="70" width="150" height="80" rx="10" style="fill:#ffffff;stroke:#15934f;stroke-width:1.2"/><text x="559" y="92" text-anchor="middle" style="fill:#0f1a2a;font-size:13px;font-weight:800">next block</text><text x="559" y="110" text-anchor="middle" style="fill:#5f6f82;font-size:12px">same plan, one</text><text x="559" y="126" text-anchor="middle" style="fill:#5f6f82;font-size:12px">rule different</text><path d="M559 150 C559 215 115 215 115 152" marker-end="url(#fg63-muted)" style="fill:none;stroke:#5f6f82;stroke-width:1.3;stroke-dasharray:5 4;stroke-linecap:round;stroke-linejoin:round"/><text x="330" y="212" text-anchor="middle" style="fill:#5f6f82;font-size:11px;font-weight:700">nothing else changes between reviews. Not the risk, not the setups, not the size.</text></svg>