<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="Margin tiers on mainnet: BTC allows 40x up to 150 million dollars of notional and 20x above; ETH 25x then 15x above 100 million; SOL 20x then 10x above 70 million; most alts 10x then 5x above 20 million" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="640"><rect x="0" y="0" width="640" height="210" rx="12" style="fill:#ffffff"/><defs><marker id="fg44-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg44-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg44-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg44-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg44-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg44-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg44-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><text x="20" y="24" style="fill:#0f1a2a;font-size:12.5px;font-weight:800">max leverage falls for very large positions (mainnet, Nov 2026)</text><text x="20" y="54" style="fill:#0f1a2a;font-size:11.5px;font-weight:700">BTC</text><rect x="200" y="42" width="240" height="18" rx="5" style="fill:rgba(59,91,219,.16)"/><text x="210" y="55" style="fill:#3b5bdb;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">40x up to $150M</text><rect x="446" y="42" width="100" height="18" rx="5" style="fill:rgba(15,26,42,.09)"/><text x="456" y="55" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">20x above</text><text x="20" y="80" style="fill:#0f1a2a;font-size:11.5px;font-weight:700">ETH</text><rect x="200" y="68" width="240" height="18" rx="5" style="fill:rgba(59,91,219,.16)"/><text x="210" y="81" style="fill:#3b5bdb;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">25x up to $100M</text><rect x="446" y="68" width="100" height="18" rx="5" style="fill:rgba(15,26,42,.09)"/><text x="456" y="81" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">15x above</text><text x="20" y="106" style="fill:#0f1a2a;font-size:11.5px;font-weight:700">SOL, XRP</text><rect x="200" y="94" width="240" height="18" rx="5" style="fill:rgba(59,91,219,.16)"/><text x="210" y="107" style="fill:#3b5bdb;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">20x up to $70M / $40M</text><rect x="446" y="94" width="100" height="18" rx="5" style="fill:rgba(15,26,42,.09)"/><text x="456" y="107" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">10x above</text><text x="20" y="132" style="fill:#0f1a2a;font-size:11.5px;font-weight:700">HYPE and most alts</text><rect x="200" y="120" width="240" height="18" rx="5" style="fill:rgba(59,91,219,.16)"/><text x="210" y="133" style="fill:#3b5bdb;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">10x up to $20M</text><rect x="446" y="120" width="100" height="18" rx="5" style="fill:rgba(15,26,42,.09)"/><text x="456" y="133" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">5x above</text><text x="20" y="158" style="fill:#0f1a2a;font-size:11.5px;font-weight:700">ARB, BNB, DOT, PAXG…</text><rect x="200" y="146" width="240" height="18" rx="5" style="fill:rgba(59,91,219,.16)"/><text x="210" y="159" style="fill:#3b5bdb;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">10x up to $3M</text><rect x="446" y="146" width="100" height="18" rx="5" style="fill:rgba(15,26,42,.09)"/><text x="456" y="159" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">5x above</text><text x="20" y="194" style="fill:#5f6f82;font-size:10.5px">at learner size this never applies; it explains why a huge whale shows a lower max leverage than you.</text><text x="20" y="207" style="fill:#5f6f82;font-size:10.5px">Testnet tiers are far lower (BTC 40x only to $10k) so you can see the effect for free.</text></svg>