<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" role="img" aria-label="Eight spot sources with their weights feed each validator, which publishes a weighted median every three seconds; the chain then takes the stake-weighted median across validators to get the oracle price" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="279" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg30-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg30-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg30-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg30-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg30-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg30-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg30-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><rect x="20" y="30" width="72" height="40" rx="8" style="fill:#e3a63d;stroke:#e3a63d;stroke-width:1.2"/><text x="56" y="47" text-anchor="middle" style="fill:#2e2e2e;font-size:10.5px;font-weight:800">Binance</text><text x="56" y="62" text-anchor="middle" style="fill:#2e2e2e;font-size:9.5px">weight 3</text><line x1="56" y1="70" x2="330" y2="108" style="stroke:#6a6b6b;stroke-width:1;stroke-linecap:round"/><rect x="100" y="30" width="72" height="40" rx="8" style="fill:rgba(227,166,61,.20);stroke:#e3a63d;stroke-width:1.2"/><text x="136" y="47" text-anchor="middle" style="fill:#f5f5f7;font-size:10.5px;font-weight:800">OKX</text><text x="136" y="62" text-anchor="middle" style="fill:#9f9fa0;font-size:9.5px">weight 2</text><line x1="136" y1="70" x2="330" y2="108" style="stroke:#6a6b6b;stroke-width:1;stroke-linecap:round"/><rect x="180" y="30" width="72" height="40" rx="8" style="fill:rgba(227,166,61,.20);stroke:#e3a63d;stroke-width:1.2"/><text x="216" y="47" text-anchor="middle" style="fill:#f5f5f7;font-size:10.5px;font-weight:800">Bybit</text><text x="216" y="62" text-anchor="middle" style="fill:#9f9fa0;font-size:9.5px">weight 2</text><line x1="216" y1="70" x2="330" y2="108" style="stroke:#6a6b6b;stroke-width:1;stroke-linecap:round"/><rect x="260" y="30" width="72" height="40" rx="8" style="fill:#2e2e2e;stroke:#e3a63d;stroke-width:1.2"/><text x="296" y="47" text-anchor="middle" style="fill:#f5f5f7;font-size:10.5px;font-weight:800">Kraken</text><text x="296" y="62" text-anchor="middle" style="fill:#9f9fa0;font-size:9.5px">weight 1</text><line x1="296" y1="70" x2="330" y2="108" style="stroke:#6a6b6b;stroke-width:1;stroke-linecap:round"/><rect x="340" y="30" width="72" height="40" rx="8" style="fill:#2e2e2e;stroke:#e3a63d;stroke-width:1.2"/><text x="376" y="47" text-anchor="middle" style="fill:#f5f5f7;font-size:10.5px;font-weight:800">KuCoin</text><text x="376" y="62" text-anchor="middle" style="fill:#9f9fa0;font-size:9.5px">weight 1</text><line x1="376" y1="70" x2="330" y2="108" style="stroke:#6a6b6b;stroke-width:1;stroke-linecap:round"/><rect x="420" y="30" width="72" height="40" rx="8" style="fill:#2e2e2e;stroke:#e3a63d;stroke-width:1.2"/><text x="456" y="47" text-anchor="middle" style="fill:#f5f5f7;font-size:10.5px;font-weight:800">Gate</text><text x="456" y="62" text-anchor="middle" style="fill:#9f9fa0;font-size:9.5px">weight 1</text><line x1="456" y1="70" x2="330" y2="108" style="stroke:#6a6b6b;stroke-width:1;stroke-linecap:round"/><rect x="500" y="30" width="72" height="40" rx="8" style="fill:#2e2e2e;stroke:#e3a63d;stroke-width:1.2"/><text x="536" y="47" text-anchor="middle" style="fill:#f5f5f7;font-size:10.5px;font-weight:800">MEXC</text><text x="536" y="62" text-anchor="middle" style="fill:#9f9fa0;font-size:9.5px">weight 1</text><line x1="536" y1="70" x2="330" y2="108" style="stroke:#6a6b6b;stroke-width:1;stroke-linecap:round"/><rect x="580" y="30" width="72" height="40" rx="8" style="fill:#2e2e2e;stroke:#e3a63d;stroke-width:1.2"/><text x="616" y="47" text-anchor="middle" style="fill:#f5f5f7;font-size:10.5px;font-weight:800">Hyperliquid</text><text x="616" y="62" text-anchor="middle" style="fill:#9f9fa0;font-size:9.5px">weight 1</text><line x1="616" y1="70" x2="330" y2="108" style="stroke:#6a6b6b;stroke-width:1;stroke-linecap:round"/><rect x="200" y="110" width="260" height="48" rx="10" style="fill:#2e2e2e;stroke:#e3a63d;stroke-width:1.2"/><text x="330" y="132" text-anchor="middle" style="fill:#f5f5f7;font-size:12px;font-weight:800">each validator: weighted median of spot mids</text><text x="330" y="149" text-anchor="middle" style="fill:#9f9fa0;font-size:11px">published about every 3 seconds</text><line x1="330" y1="158" x2="330" y2="184" marker-end="url(#fg30-muted)" style="stroke:#9f9fa0;stroke-width:1.4;stroke-linecap:round"/><rect x="170" y="186" width="320" height="46" rx="10" style="fill:rgba(227,166,61,.20);stroke:#e3a63d;stroke-width:1.2"/><text x="330" y="208" text-anchor="middle" style="fill:#f5f5f7;font-size:12px;font-weight:800">the chain: stake-weighted median of the validators’ numbers</text><text x="330" y="225" text-anchor="middle" style="fill:#9f9fa0;font-size:11px">= the oracle price</text><text x="20" y="254" style="fill:#9f9fa0;font-size:10.5px">for assets whose real market is elsewhere (BTC), Hyperliquid’s own spot is left out; for assets born here (HYPE), outside</text><text x="20" y="270" style="fill:#9f9fa0;font-size:10.5px">sources are left out until they are liquid enough. One exchange printing a bad tick cannot move a weighted median.</text></svg>