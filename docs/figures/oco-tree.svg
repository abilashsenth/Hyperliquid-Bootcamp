<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" role="img" aria-label="A parent limit order with two attached children, a take profit and a stop loss that cancel each other; three outcomes below: a full fill places the children, a partial fill leaves them waiting, and cancelling the parent cancels them even if part of it filled" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="289" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg24-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg24-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg24-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg24-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg24-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg24-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg24-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><rect x="230" y="16" width="200" height="50" rx="10" style="fill:#2e2e2e;stroke:#00b3dd;stroke-width:1.2"/><text x="330" y="38" text-anchor="middle" style="fill:#f5f5f7;font-size:12px;font-weight:800">parent: limit buy 0.1 @ 77,000</text><text x="330" y="55" text-anchor="middle" style="fill:#9f9fa0;font-size:11px">the children are sized to it</text><line x1="330" y1="66" x2="180" y2="96" marker-end="url(#fg24-muted)" style="stroke:#9f9fa0;stroke-width:1.3;stroke-linecap:round"/><line x1="330" y1="66" x2="480" y2="96" marker-end="url(#fg24-muted)" style="stroke:#9f9fa0;stroke-width:1.3;stroke-linecap:round"/><rect x="80" y="98" width="200" height="46" rx="10" style="fill:#2e2e2e;stroke:#4fce8f;stroke-width:1.2"/><text x="180" y="120" text-anchor="middle" style="fill:#f5f5f7;font-size:12px;font-weight:800">take profit: sell 0.1 @ 79,000</text><text x="180" y="137" text-anchor="middle" style="fill:#9f9fa0;font-size:11px">market or limit, triggers on mark</text><rect x="380" y="98" width="200" height="46" rx="10" style="fill:#2e2e2e;stroke:#f47067;stroke-width:1.2"/><text x="480" y="120" text-anchor="middle" style="fill:#f5f5f7;font-size:12px;font-weight:800">stop loss: sell 0.1 @ 76,000</text><text x="480" y="137" text-anchor="middle" style="fill:#9f9fa0;font-size:11px">market or limit, triggers on mark</text><line x1="280" y1="121" x2="380" y2="121" style="stroke:#9f9fa0;stroke-width:1.2;stroke-dasharray:3 3;stroke-linecap:round"/><rect x="260.5" y="147.75" width="139" height="20.5" rx="10.25" style="fill:#2e2e2e;stroke:#6a6b6b;stroke-width:1"/><text x="330" y="161.78" text-anchor="middle" style="fill:#9f9fa0;font-size:10.5px;font-weight:700">one cancels the other</text><circle cx="30" cy="186" r="5" style="fill:#4fce8f"/><text x="44" y="190" style="fill:#f5f5f7;font-size:12px;font-weight:800">parent fills completely</text><text x="270" y="190" style="fill:#9f9fa0;font-size:11.5px">both children are placed, each for 0.1</text><circle cx="30" cy="216" r="5" style="fill:#e3a63d"/><text x="44" y="220" style="fill:#f5f5f7;font-size:12px;font-weight:800">parent fills partly, 0.04 of 0.1</text><text x="270" y="220" style="fill:#9f9fa0;font-size:11.5px">children stay unplaced, so the 0.04 has no stop yet</text><circle cx="30" cy="246" r="5" style="fill:#f47067"/><text x="44" y="250" style="fill:#f5f5f7;font-size:12px;font-weight:800">you cancel the parent, filled or not</text><text x="270" y="250" style="fill:#9f9fa0;font-size:11.5px">children are cancelled too; add a new TP/SL for the filled part</text><text x="20" y="282" style="fill:#9f9fa0;font-size:10.5px">one exception: a partly filled parent cancelled by the exchange for insufficient margin does place its children.</text></svg>