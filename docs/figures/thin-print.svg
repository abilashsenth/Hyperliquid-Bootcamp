<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-label="A stock’s pre-market trades as a flat line with one thin print far below it; the HIP-3 oracle takes the print, the perp’s mark follows, and a band of long positions is liquidated while the stock itself barely moves" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="249" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg67-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg67-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg67-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg67-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg67-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg67-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg67-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><line x1="40" y1="100" x2="620" y2="100" style="stroke:#9f9fa0;stroke-width:2;stroke-linecap:round"/><text x="40" y="90" style="fill:#9f9fa0;font-size:11px;font-weight:700">the stock, pre-market: a few thin trades around one price</text><circle cx="359" cy="170" r="5" style="fill:#f47067"/><line x1="359" y1="100" x2="359" y2="164" style="stroke:#f47067;stroke-width:1.2;stroke-dasharray:3 3;stroke-linecap:round"/><text x="369" y="174" style="fill:#f47067;font-size:11px;font-weight:700">one tiny trade, far below</text><polyline points="40,104 353.2,104 364.8,170 399.6,170 411.2,106 620,106" style="fill:none;stroke:#e3a63d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/><text x="620" y="130" text-anchor="end" style="fill:#e3a63d;font-size:11px;font-weight:700">the deployer’s oracle takes the print; mark follows</text><rect x="86.4" y="122" width="243.6" height="14" rx="4" style="fill:rgba(244,112,103,.18)"/><text x="208.2" y="133" text-anchor="middle" style="fill:#f47067;font-size:10px">liquidation prices of ~960 long accounts</text><text x="40" y="212" style="fill:#9f9fa0;font-size:10.5px">July 2026, SK Hynix perp: about $57M of longs liquidated on a pre-market print while the stock</text><text x="40" y="225" style="fill:#9f9fa0;font-size:10.5px">barely moved. No external exchange disagreed, because the oracle was one deployer’s feed. (News</text><text x="40" y="238" style="fill:#9f9fa0;font-size:10.5px">report in the media list; no deployer post-mortem was published.)</text></svg>