<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-label="A stock’s pre-market trades as a flat line with one thin print far below it; the HIP-3 oracle takes the print, the perp’s mark follows, and a band of long positions is liquidated while the stock itself barely moves" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="250" rx="12" style="fill:#ffffff"/><defs><marker id="fg67-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg67-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg67-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg67-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg67-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg67-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg67-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><line x1="40" y1="100" x2="620" y2="100" style="stroke:#5f6f82;stroke-width:2;stroke-linecap:round"/><text x="40" y="90" style="fill:#5f6f82;font-size:11px;font-weight:700">the stock, pre-market: a few thin trades around one price</text><circle cx="359" cy="170" r="5" style="fill:#d0392b"/><line x1="359" y1="100" x2="359" y2="164" style="stroke:#d0392b;stroke-width:1.2;stroke-dasharray:3 3;stroke-linecap:round"/><text x="369" y="174" style="fill:#d0392b;font-size:11px;font-weight:700">one tiny trade, far below</text><polyline points="40,104 353.2,104 364.8,170 399.6,170 411.2,106 620,106" style="fill:none;stroke:#c07a0c;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/><text x="620" y="130" text-anchor="end" style="fill:#c07a0c;font-size:11px;font-weight:700">the deployer’s oracle takes the print; mark follows</text><rect x="86.4" y="122" width="243.6" height="14" rx="4" style="fill:rgba(208,57,43,.18)"/><text x="208.2" y="133" text-anchor="middle" style="fill:#d0392b;font-size:10px">liquidation prices of ~960 long accounts</text><text x="40" y="212" style="fill:#5f6f82;font-size:10.5px">July 2026, SK Hynix perp: about $57M of longs liquidated on a pre-market print while the stock</text><text x="40" y="225" style="fill:#5f6f82;font-size:10.5px">barely moved. No external exchange disagreed, because the oracle was one deployer’s feed. (News</text><text x="40" y="238" style="fill:#5f6f82;font-size:10.5px">report in the media list; no deployer post-mortem was published.)</text></svg>