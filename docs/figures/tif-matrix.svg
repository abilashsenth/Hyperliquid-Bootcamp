<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="A matrix of order options against two situations, when the order could fill right now and when it could not: GTC fills or rests, IOC fills what it can and cancels the rest, Post Only is rejected or rests, reduce-only only ever shrinks a position" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="640"><rect x="0.5" y="0.5" width="639" height="239" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg25-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg25-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg25-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg25-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg25-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg25-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg25-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><text x="150" y="30" style="fill:#f5f5f7;font-size:12px;font-weight:800">if it could fill right now…</text><text x="390" y="30" style="fill:#f5f5f7;font-size:12px;font-weight:800">if it could not fill right now…</text><line x1="20" y1="40" x2="620" y2="40" style="stroke:#3f4041;stroke-width:1;stroke-linecap:round"/><rect x="20" y="50.25" width="35" height="21.5" rx="10.75" style="fill:rgba(245,245,247,.09)"/><text x="37.5" y="65.14" text-anchor="middle" style="fill:#f5f5f7;font-size:11.5px;font-weight:800">GTC</text><text x="150" y="66" style="fill:#f5f5f7;font-size:12px">fills now (taker)</text><text x="390" y="66" style="fill:#f5f5f7;font-size:12px">rests in the book (maker)</text><line x1="20" y1="82" x2="620" y2="82" style="stroke:#3f4041;stroke-width:1;stroke-linecap:round"/><rect x="20" y="92.25" width="35" height="21.5" rx="10.75" style="fill:rgba(245,245,247,.09)"/><text x="37.5" y="107.14" text-anchor="middle" style="fill:#f5f5f7;font-size:11.5px;font-weight:800">IOC</text><text x="150" y="108" style="fill:#f5f5f7;font-size:12px">fills what it can, cancels the rest</text><text x="390" y="108" style="fill:#f5f5f7;font-size:12px">cancelled, nothing rests</text><line x1="20" y1="124" x2="620" y2="124" style="stroke:#3f4041;stroke-width:1;stroke-linecap:round"/><rect x="20" y="134.25" width="113" height="21.5" rx="10.75" style="fill:rgba(245,245,247,.09)"/><text x="76.5" y="149.14" text-anchor="middle" style="fill:#f5f5f7;font-size:11.5px;font-weight:800">Post Only (ALO)</text><text x="150" y="150" style="fill:#f47067;font-size:12px">rejected, never a taker</text><text x="390" y="150" style="fill:#f5f5f7;font-size:12px">rests in the book (maker)</text><line x1="20" y1="166" x2="620" y2="166" style="stroke:#3f4041;stroke-width:1;stroke-linecap:round"/><rect x="20" y="176.25" width="87" height="21.5" rx="10.75" style="fill:rgba(245,245,247,.09)"/><text x="63.5" y="191.14" text-anchor="middle" style="fill:#f5f5f7;font-size:11.5px;font-weight:800">Reduce only</text><text x="150" y="192" style="fill:#f5f5f7;font-size:12px">fills, but only up to your position</text><text x="390" y="192" style="fill:#f5f5f7;font-size:12px">rests; can only shrink the position</text><text x="20" y="232" style="fill:#9f9fa0;font-size:10.5px">GTC is “good till cancelled”, IOC is “immediate or cancel”, ALO is “add liquidity only”, Hyperliquid’s name for Post Only.</text></svg>