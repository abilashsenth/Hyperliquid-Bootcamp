<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-label="Three price lines over the same minutes: the last trade and mid from the Hyperliquid book, the oracle built from other exchanges, and the mark that blends them; each is labelled with what it is used for" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="249" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg29-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg29-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg29-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg29-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg29-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg29-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg29-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><path d="M30 134 C40 132.67 70 125 90 126 C110 127 130 139 150 140 C170 141 190 136.33 210 132 C230 127.67 250 115.67 270 114 C290 112.33 310 122.67 330 122 C350 121.33 375 111.33 390 110 C405 108.67 415 113.33 420 114" style="fill:none;stroke:#e3a63d;stroke-width:2;stroke-dasharray:5 4;stroke-linecap:round;stroke-linejoin:round"/><polyline points="30,104 90,108 150,110 210,114 270,84 330,104 390,80 420,96" style="fill:none;stroke:#9f9fa0;stroke-width:1.8;stroke-dasharray:2 4;stroke-linecap:round;stroke-linejoin:round"/><path d="M30 120 C40 118.67 70 111 90 112 C110 113 130 125 150 126 C170 127 190 122.33 210 118 C230 113.67 250 101.67 270 100 C290 98.33 310 108.67 330 108 C350 107.33 375 97.33 390 96 C405 94.67 415 99.33 420 100" style="fill:none;stroke:#f5f5f7;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"/><line x1="440" y1="50" x2="466" y2="50" style="stroke:#9f9fa0;stroke-width:2.2;stroke-dasharray:2 4;stroke-linecap:round"/><text x="474" y="54" style="fill:#9f9fa0;font-size:12px;font-weight:800">last trade and mid</text><text x="474" y="70" style="fill:#9f9fa0;font-size:10.5px">what the book shows; display</text><text x="474" y="83" style="fill:#9f9fa0;font-size:10.5px">only</text><line x1="440" y1="112" x2="466" y2="112" style="stroke:#e3a63d;stroke-width:2.2;stroke-dasharray:5 4;stroke-linecap:round"/><text x="474" y="116" style="fill:#e3a63d;font-size:12px;font-weight:800">oracle</text><text x="474" y="132" style="fill:#9f9fa0;font-size:10.5px">spot on other exchanges; sets</text><text x="474" y="145" style="fill:#9f9fa0;font-size:10.5px">funding</text><line x1="440" y1="174" x2="466" y2="174" style="stroke:#f5f5f7;stroke-width:2.2;stroke-linecap:round"/><text x="474" y="178" style="fill:#f5f5f7;font-size:12px;font-weight:800">mark</text><text x="474" y="194" style="fill:#9f9fa0;font-size:10.5px">the fair price: liquidations,</text><text x="474" y="207" style="fill:#9f9fa0;font-size:10.5px">TP/SL, PnL</text><text x="30" y="220" style="fill:#9f9fa0;font-size:11.5px">the three can sit a few ticks apart for minutes. Only one of them can liquidate you.</text></svg>