<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" role="img" aria-label="A vertical price axis with the mid in the middle; on the left, the three ways to open a long placed where they sit relative to the mid; on the right, the exits that manage an open long" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="320" rx="12" style="fill:#ffffff"/><defs><marker id="fg22-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg22-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg22-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg22-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg22-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg22-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg22-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><line x1="330" y1="40" x2="330" y2="290" style="stroke:#cbd5e1;stroke-width:2;stroke-linecap:round"/><line x1="60" y1="165" x2="600" y2="165" style="stroke:#0f1a2a;stroke-width:1.2;stroke-dasharray:4 4;stroke-linecap:round"/><rect x="294.5" y="154.5" width="71" height="21" rx="10.5" style="fill:#0f1a2a"/><text x="330" y="168.96" text-anchor="middle" style="fill:#ffffff;font-size:11px;font-weight:700">mid price</text><text x="330" y="26" text-anchor="middle" style="fill:#5f6f82;font-size:11px">higher</text><text x="330" y="308" text-anchor="middle" style="fill:#5f6f82;font-size:11px">lower</text><text x="40" y="24" style="fill:#15934f;font-size:13px;font-weight:800">to open a long</text><text x="620" y="24" text-anchor="end" style="fill:#d0392b;font-size:13px;font-weight:800">to manage an open long</text><rect x="40" y="72" width="250" height="36" rx="9" style="fill:#ffffff;stroke:#3b5bdb;stroke-width:1.4"/><text x="52" y="87" style="fill:#0f1a2a;font-size:12px;font-weight:800">Stop market buy</text><text x="52" y="102" style="fill:#5f6f82;font-size:10.5px">a breakout entry: fires when mark rises to the trigger</text><line x1="290" y1="90" x2="326" y2="90" marker-end="url(#fg22-muted)" style="stroke:#3b5bdb;stroke-width:1.2;stroke-linecap:round"/><rect x="40" y="197" width="250" height="36" rx="9" style="fill:#ffffff;stroke:#15934f;stroke-width:1.4"/><text x="52" y="212" style="fill:#0f1a2a;font-size:12px;font-weight:800">Limit buy</text><text x="52" y="227" style="fill:#5f6f82;font-size:10.5px">rests in the book below the mid; fills as a maker, or never</text><line x1="290" y1="215" x2="326" y2="215" marker-end="url(#fg22-muted)" style="stroke:#15934f;stroke-width:1.2;stroke-linecap:round"/><rect x="40" y="244" width="250" height="36" rx="9" style="fill:#ffffff;stroke:#3b5bdb;stroke-width:1.4"/><text x="52" y="259" style="fill:#0f1a2a;font-size:12px;font-weight:800">Take market buy</text><text x="52" y="274" style="fill:#5f6f82;font-size:10.5px">a dip entry: fires when mark falls to the trigger</text><line x1="290" y1="262" x2="326" y2="262" marker-end="url(#fg22-muted)" style="stroke:#3b5bdb;stroke-width:1.2;stroke-linecap:round"/><rect x="370" y="72" width="250" height="36" rx="9" style="fill:#ffffff;stroke:#3b5bdb;stroke-width:1.4"/><text x="382" y="87" style="fill:#0f1a2a;font-size:12px;font-weight:800">Take profit (sell)</text><text x="382" y="102" style="fill:#5f6f82;font-size:10.5px">fires when mark rises to the trigger; market or limit</text><line x1="370" y1="90" x2="334" y2="90" marker-end="url(#fg22-muted)" style="stroke:#3b5bdb;stroke-width:1.2;stroke-linecap:round"/><rect x="370" y="204" width="250" height="36" rx="9" style="fill:#ffffff;stroke:#d0392b;stroke-width:1.4"/><text x="382" y="219" style="fill:#0f1a2a;font-size:12px;font-weight:800">Stop loss (sell)</text><text x="382" y="234" style="fill:#5f6f82;font-size:10.5px">fires when mark falls to the trigger; market or limit</text><line x1="370" y1="222" x2="334" y2="222" marker-end="url(#fg22-muted)" style="stroke:#d0392b;stroke-width:1.2;stroke-linecap:round"/><rect x="370" y="250" width="250" height="36" rx="9" style="fill:#ffffff;stroke:#d0392b;stroke-width:1.4"/><text x="382" y="265" style="fill:#0f1a2a;font-size:12px;font-weight:800">Trailing stop (sell)</text><text x="382" y="280" style="fill:#5f6f82;font-size:10.5px">trigger follows the highest mark, never moves back down</text><line x1="370" y1="268" x2="334" y2="268" marker-end="url(#fg22-muted)" style="stroke:#d0392b;stroke-width:1.2;stroke-linecap:round"/><text x="40" y="310" style="fill:#5f6f82;font-size:11px">anything with a trigger is a market order in waiting: it fires on the mark price (Layer 3) and then pays the taker fee</text></svg>