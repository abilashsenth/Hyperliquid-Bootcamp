<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" role="img" aria-label="The docs example of a trailing stop closing a long with a retracement of ten: the mark goes 100, 110, 105, 120, 110; the trigger rises with each new high to 90, 100, 110 and never falls; the stop fires at 110" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="270" rx="12" style="fill:#ffffff"/><defs><marker id="fg27-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg27-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg27-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg27-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg27-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg27-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg27-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><polyline points="60,150 150,110 240,110 330,70 420,70" style="fill:none;stroke:#c07a0c;stroke-width:1.5;stroke-dasharray:4 3;stroke-linecap:round;stroke-linejoin:round"/><polyline points="60,190 150,150 240,150 330,110 420,110" style="fill:none;stroke:#d0392b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><polyline points="60,150 150,110 240,130 330,70 420,110" style="fill:none;stroke:#0f1a2a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><circle cx="60" cy="150" r="4.5" style="fill:#0f1a2a"/><text x="60" y="140" text-anchor="middle" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">100</text><text x="60" y="236" text-anchor="middle" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:10.5px">t1</text><circle cx="150" cy="110" r="4.5" style="fill:#0f1a2a"/><text x="150" y="100" text-anchor="middle" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">110</text><text x="150" y="236" text-anchor="middle" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:10.5px">t2</text><circle cx="240" cy="130" r="4.5" style="fill:#0f1a2a"/><text x="240" y="120" text-anchor="middle" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">105</text><text x="240" y="236" text-anchor="middle" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:10.5px">t3</text><circle cx="330" cy="70" r="4.5" style="fill:#0f1a2a"/><text x="330" y="60" text-anchor="middle" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">120</text><text x="330" y="236" text-anchor="middle" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:10.5px">t4</text><circle cx="420" cy="110" r="4.5" style="fill:#0f1a2a"/><text x="420" y="100" text-anchor="middle" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px">110</text><text x="420" y="236" text-anchor="middle" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:10.5px">t5</text><circle cx="420" cy="110" r="8" style="fill:none;stroke:#d0392b;stroke-width:2"/><text x="420" y="136" text-anchor="middle" style="fill:#d0392b;font-size:11.5px;font-weight:700">fires: market sell</text><text x="60" y="30" style="fill:#0f1a2a;font-size:11px;font-weight:700">mark price</text><text x="150" y="30" style="fill:#c07a0c;font-size:11px;font-weight:700">watermark (highest mark so far)</text><text x="360" y="30" style="fill:#d0392b;font-size:11px;font-weight:700">trigger = watermark − 10</text><text x="478" y="62" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:10px">mark  high  trigger</text><text x="478" y="84" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px"> 100   100     90</text><text x="478" y="97" style="fill:#5f6f82;font-size:9px">tracking starts</text><text x="478" y="116" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px"> 110   110    100</text><text x="478" y="129" style="fill:#5f6f82;font-size:9px">new high lifts the trigger</text><text x="478" y="148" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px"> 105   110    100</text><text x="478" y="161" style="fill:#5f6f82;font-size:9px">trigger stays put</text><text x="478" y="180" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px"> 120   120    110</text><text x="478" y="193" style="fill:#5f6f82;font-size:9px">new high lifts it again</text><text x="478" y="212" style="fill:#0f1a2a;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px"> 110   120    110</text><text x="478" y="225" style="fill:#5f6f82;font-size:9px">mark falls to the trigger: fires</text><text x="20" y="262" style="fill:#5f6f82;font-size:10.5px">set the retracement as a distance or a percent; an optional activation price delays the tracking. Perp markets only.</text></svg>