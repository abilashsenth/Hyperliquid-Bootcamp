<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 190" role="img" aria-label="A price ruler marked in R units: the stop at minus one R, the entry at zero, and the target at plus three R; a note says one three-R winner pays for three one-R losers" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="189" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg60-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg60-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg60-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg60-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg60-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg60-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg60-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><line x1="60" y1="90" x2="600" y2="90" style="stroke:#6a6b6b;stroke-width:2;stroke-linecap:round"/><line x1="114" y1="78" x2="114" y2="102" style="stroke:#f47067;stroke-width:2.5;stroke-linecap:round"/><text x="114" y="120" text-anchor="middle" style="fill:#f47067;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">−1R = −$10</text><text x="114" y="70" text-anchor="middle" style="fill:#f47067;font-size:11px;font-weight:800">stop</text><line x1="222" y1="78" x2="222" y2="102" style="stroke:#00b3dd;stroke-width:2.5;stroke-linecap:round"/><text x="222" y="120" text-anchor="middle" style="fill:#00b3dd;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">0</text><text x="222" y="70" text-anchor="middle" style="fill:#00b3dd;font-size:11px;font-weight:800">entry</text><line x1="330" y1="78" x2="330" y2="102" style="stroke:#9f9fa0;stroke-width:1.2;stroke-linecap:round"/><text x="330" y="120" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:500">+1R</text><line x1="438" y1="78" x2="438" y2="102" style="stroke:#9f9fa0;stroke-width:1.2;stroke-linecap:round"/><text x="438" y="120" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:500">+2R</text><line x1="546" y1="78" x2="546" y2="102" style="stroke:#4fce8f;stroke-width:2.5;stroke-linecap:round"/><text x="546" y="120" text-anchor="middle" style="fill:#4fce8f;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">+3R = +$30</text><text x="546" y="70" text-anchor="middle" style="fill:#4fce8f;font-size:11px;font-weight:800">target</text><rect x="114" y="84" width="108" height="12" rx="3" style="fill:rgba(244,112,103,.18)"/><rect x="222" y="84" width="324" height="12" rx="3" style="fill:rgba(79,206,143,.20)"/><text x="60" y="30" style="fill:#f5f5f7;font-size:11.5px;font-weight:700">1R = the dollars you lose if the stop is hit. Every result is written as a multiple of it.</text><text x="60" y="154" style="fill:#9f9fa0;font-size:10.5px">a +3R winner pays for three −1R losers. At $10 of risk that is +$30 against −$30; at $1,000</text><text x="60" y="167" style="fill:#9f9fa0;font-size:10.5px">of risk the same trade is +$3,000 against −$3,000. Same trade, same R.</text></svg>