<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 190" role="img" aria-label="A price ruler marked in R units: the stop at minus one R, the entry at zero, and the target at plus three R; a note says one three-R winner pays for three one-R losers" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="190" rx="12" style="fill:#ffffff"/><defs><marker id="fg60-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg60-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg60-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg60-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg60-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg60-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg60-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><line x1="60" y1="90" x2="600" y2="90" style="stroke:#cbd5e1;stroke-width:2;stroke-linecap:round"/><line x1="114" y1="78" x2="114" y2="102" style="stroke:#d0392b;stroke-width:2.5;stroke-linecap:round"/><text x="114" y="120" text-anchor="middle" style="fill:#d0392b;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">−1R = −$10</text><text x="114" y="70" text-anchor="middle" style="fill:#d0392b;font-size:11px;font-weight:800">stop</text><line x1="222" y1="78" x2="222" y2="102" style="stroke:#3b5bdb;stroke-width:2.5;stroke-linecap:round"/><text x="222" y="120" text-anchor="middle" style="fill:#3b5bdb;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">0</text><text x="222" y="70" text-anchor="middle" style="fill:#3b5bdb;font-size:11px;font-weight:800">entry</text><line x1="330" y1="78" x2="330" y2="102" style="stroke:#5f6f82;stroke-width:1.2;stroke-linecap:round"/><text x="330" y="120" text-anchor="middle" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:500">+1R</text><line x1="438" y1="78" x2="438" y2="102" style="stroke:#5f6f82;stroke-width:1.2;stroke-linecap:round"/><text x="438" y="120" text-anchor="middle" style="fill:#5f6f82;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:500">+2R</text><line x1="546" y1="78" x2="546" y2="102" style="stroke:#15934f;stroke-width:2.5;stroke-linecap:round"/><text x="546" y="120" text-anchor="middle" style="fill:#15934f;font-family:'JetBrains Mono', Consolas, Menlo, monospace;font-size:11px;font-weight:700">+3R = +$30</text><text x="546" y="70" text-anchor="middle" style="fill:#15934f;font-size:11px;font-weight:800">target</text><rect x="114" y="84" width="108" height="12" rx="3" style="fill:rgba(208,57,43,.18)"/><rect x="222" y="84" width="324" height="12" rx="3" style="fill:rgba(21,147,79,.20)"/><text x="60" y="30" style="fill:#0f1a2a;font-size:11.5px;font-weight:700">1R = the dollars you lose if the stop is hit. Every result is written as a multiple of it.</text><text x="60" y="154" style="fill:#5f6f82;font-size:10.5px">a +3R winner pays for three −1R losers. At $10 of risk that is +$30 against −$30; at $1,000</text><text x="60" y="167" style="fill:#5f6f82;font-size:10.5px">of risk the same trade is +$3,000 against −$3,000. Same trade, same R.</text></svg>