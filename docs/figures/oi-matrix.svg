<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-label="A two by two matrix of price direction against open interest direction: price up with open interest up is new longs, price up with open interest down is shorts covering, price down with open interest up is new shorts, price down with open interest down is longs closing or being liquidated" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="300" rx="12" style="fill:#ffffff"/><defs><marker id="fg55-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg55-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg55-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg55-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg55-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg55-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg55-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><rect x="150" y="50" width="230" height="100" rx="10" style="fill:#ffffff;stroke:#15934f;stroke-width:1.5"/><text x="164" y="74" style="fill:#15934f;font-size:12.5px;font-weight:800">new longs opening</text><text x="164" y="94" style="fill:#5f6f82;font-size:10.5px">a trend that is also a crowd</text><text x="164" y="107" style="fill:#5f6f82;font-size:10.5px">forming. Healthy early, fragile</text><text x="164" y="120" style="fill:#5f6f82;font-size:10.5px">late; watch funding climb.</text><rect x="400" y="50" width="230" height="100" rx="10" style="fill:#ffffff;stroke:#c07a0c;stroke-width:1.5"/><text x="414" y="74" style="fill:#c07a0c;font-size:12.5px;font-weight:800">shorts covering</text><text x="414" y="94" style="fill:#5f6f82;font-size:10.5px">price lifted by people leaving,</text><text x="414" y="107" style="fill:#5f6f82;font-size:10.5px">not arriving. Fuel runs out when</text><text x="414" y="120" style="fill:#5f6f82;font-size:10.5px">the covering ends.</text><rect x="150" y="170" width="230" height="100" rx="10" style="fill:#ffffff;stroke:#d0392b;stroke-width:1.5"/><text x="164" y="194" style="fill:#d0392b;font-size:12.5px;font-weight:800">new shorts opening</text><text x="164" y="214" style="fill:#5f6f82;font-size:10.5px">a downtrend with conviction behind</text><text x="164" y="227" style="fill:#5f6f82;font-size:10.5px">it, and a crowd that can be</text><text x="164" y="240" style="fill:#5f6f82;font-size:10.5px">squeezed.</text><rect x="400" y="170" width="230" height="100" rx="10" style="fill:#ffffff;stroke:#5f6f82;stroke-width:1.5"/><text x="414" y="194" style="fill:#5f6f82;font-size:12.5px;font-weight:800">longs closing or liquidated</text><text x="414" y="214" style="fill:#5f6f82;font-size:10.5px">the end of a move, often. Forced</text><text x="414" y="227" style="fill:#5f6f82;font-size:10.5px">sellers finish; then there is</text><text x="414" y="240" style="fill:#5f6f82;font-size:10.5px">nobody left to sell.</text><text x="265" y="38" text-anchor="middle" style="fill:#0f1a2a;font-size:11px;font-weight:700">open interest rising</text><text x="515" y="38" text-anchor="middle" style="fill:#0f1a2a;font-size:11px;font-weight:700">open interest falling</text><text x="20" y="104" style="fill:#15934f;font-size:11px;font-weight:700">price up</text><text x="20" y="224" style="fill:#d0392b;font-size:11px;font-weight:700">price down</text><text x="20" y="282" style="fill:#5f6f82;font-size:10.5px">read with funding: if the crowd is paying a lot to stay, the move is more fragile than it looks.</text><text x="20" y="295" style="fill:#5f6f82;font-size:10.5px">Short-side signals are weaker and the metric lags intraday (see the Glassnode piece in the media list).</text></svg>