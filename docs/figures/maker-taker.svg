<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" role="img" aria-label="On a 1,000 dollar fill the taker pays 45 cents and the maker 15 cents; a table maps each order type to the role it plays" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="270" rx="12" style="fill:#ffffff"/><defs><marker id="fg6-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg6-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg6-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg6-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg6-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg6-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg6-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><text x="20" y="28" style="fill:#0f1a2a;font-size:14px;font-weight:800">Fee on a $1,000 fill, base tier</text><ellipse cx="75" cy="150" rx="14" ry="5" style="fill:#0f1a2a;stroke:#ffffff;stroke-width:1"/><ellipse cx="75" cy="145" rx="14" ry="5" style="fill:#0f1a2a;stroke:#ffffff;stroke-width:1"/><ellipse cx="75" c