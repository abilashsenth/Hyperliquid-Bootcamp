<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" role="img" aria-label="On a 1,000 dollar fill the taker pays 45 cents and the maker 15 cents; a table maps each order type to the role it plays" style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0.5" y="0.5" width="659" height="269" rx="12" style="fill:#090a0b;stroke:rgba(255,255,255,.08);stroke-width:1"/><defs><marker id="fg6-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f5f5f7"/></marker><marker id="fg6-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#9f9fa0"/></marker><marker id="fg6-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#4fce8f"/></marker><marker id="fg6-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#f47067"/></marker><marker id="fg6-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#00b3dd"/></marker><marker id="fg6-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#e3a63d"/></marker><marker id="fg6-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#ffffff"/></marker></defs><text x="20" y="28" style="fill:#f5f5f7;font-size:14px;font-weight:800">Fee on a $1,000 fill, base tier</text><ellipse cx="75" cy="150" rx="14" ry="5" style="fill:#f5f5f7;stroke:#2e2e2e;stroke-width:1"/><ellipse cx="75" cy="145" rx="14" ry="5" style="fill:#f5f5f7;stroke:#2e2e2e;stroke-width:1"/><ellipse cx="75" cy="140" rx="14" ry="5" style="fill:#f5f5f7;stroke:#2e2e2e;stroke-width:1"/><ellipse cx="75" cy="135" rx="14" ry="5" style="fill:#f5f5f7;stroke:#2e2e2e;stroke-width:1"/><ellipse cx="75" cy="130" rx="14" ry="5" style="fill:#f5f5f7;stroke:#2e2e2e;stroke-width:1"/><ellipse cx="75" cy="125" rx="14" ry="5" style="fill:#f5f5f7;stroke:#2e2e2e;stroke-width:1"/><ellipse cx="75" cy="120" rx="14" ry="5" style="fill:#f5f5f7;stroke:#2e2e2e;stroke-width:1"/><ellipse cx="75" cy="115" rx="14" ry="5" style="fill:#f5f5f7;stroke:#2e2e2e;stroke-width:1"/><ellipse cx="75" cy="110" rx="14" ry="5" style="fill:#f5f5f7;stroke:#2e2e2e;stroke-width:1"/><text x="75" y="172" text-anchor="middle" style="fill:#f5f5f7;font-size:13px;font-weight:800">taker</text><text x="75" y="190" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px">$0.45 (0.045%)</text><ellipse cx="215" cy="150" rx="14" ry="5" style="fill:#9f9fa0;stroke:#2e2e2e;stroke-width:1"/><ellipse cx="215" cy="145" rx="14" ry="5" style="fill:#9f9fa0;stroke:#2e2e2e;stroke-width:1"/><ellipse cx="215" cy="140" rx="14" ry="5" style="fill:#9f9fa0;stroke:#2e2e2e;stroke-width:1"/><text x="215" y="172" text-anchor="middle" style="fill:#f5f5f7;font-size:13px;font-weight:800">maker</text><text x="215" y="190" text-anchor="middle" style="fill:#9f9fa0;font-family:'Roboto Mono', Consolas, Menlo, monospace;font-size:11.5px">$0.15 (0.015%)</text><text x="20" y="226" style="fill:#9f9fa0;font-size:11.5px">a round trip is two fills: taker in and out costs $0.90,</text><text x="20" y="242" style="fill:#9f9fa0;font-size:11.5px">maker in and out $0.30. Over 100 round trips: $90 against $30.</text><text x="330" y="28" style="fill:#f5f5f7;font-size:14px;font-weight:800">Which role does each order play?</text><text x="330" y="56" style="fill:#f5f5f7;font-size:12.5px;font-weight:700">Market</text><rect x="554" y="47.5" width="96" height="21" rx="10.5" style="fill:#f5f5f7"/><text x="602" y="61.96" text-anchor="middle" style="fill:#2e2e2e;font-size:11px;font-weight:700">taker, always</text><line x1="330" y1="74" x2="650" y2="74" style="stroke:#3f4041;stroke-width:1;stroke-linecap:round"/><text x="330" y="88" style="fill:#f5f5f7;font-size:12.5px;font-weight:700">IOC</text><rect x="603" y="79.5" width="47" height="21" rx="10.5" style="fill:#f5f5f7"/><text x="626.5" y="93.96" text-anchor="middle" style="fill:#2e2e2e;font-size:11px;font-weight:700">taker</text><line x1="330" y1="106" x2="650" y2="106" style="stroke:#3f4041;stroke-width:1;stroke-linecap:round"/><text x="330" y="120" style="fill:#f5f5f7;font-size:12.5px;font-weight:700">Limit that rests</text><rect x="603" y="111.5" width="47" height="21" rx="10.5" style="fill:rgba(245,245,247,.09)"/><text x="626.5" y="125.96" text-anchor="middle" style="fill:#f5f5f7;font-size:11px;font-weight:700">maker</text><line x1="330" y1="138" x2="650" y2="138" style="stroke:#3f4041;stroke-width:1;stroke-linecap:round"/><text x="330" y="152" style="fill:#f5f5f7;font-size:12.5px;font-weight:700">Limit that crosses</text><rect x="603" y="143.5" width="47" height="21" rx="10.5" style="fill:#f5f5f7"/><text x="626.5" y="157.96" text-anchor="middle" style="fill:#2e2e2e;font-size:11px;font-weight:700">taker</text><line x1="330" y1="170" x2="650" y2="170" style="stroke:#3f4041;stroke-width:1;stroke-linecap:round"/><text x="330" y="184" style="fill:#f5f5f7;font-size:12.5px;font-weight:700">Post Only (ALO)</text><rect x="523" y="175.5" width="127" height="21" rx="10.5" style="fill:rgba(245,245,247,.09)"/><text x="586.5" y="189.96" text-anchor="middle" style="fill:#f5f5f7;font-size:11px;font-weight:700">maker, or rejected</text><line x1="330" y1="202" x2="650" y2="202" style="stroke:#3f4041;stroke-width:1;stroke-linecap:round"/><text x="330" y="216" style="fill:#f5f5f7;font-size:12.5px;font-weight:700">Stop, TP or SL when it fires</text><rect x="449" y="221.5" width="201" height="21" rx="10.5" style="fill:#f5f5f7"/><text x="549.5" y="235.96" text-anchor="middle" style="fill:#2e2e2e;font-size:11px;font-weight:700">taker: it sends a market order</text></svg>