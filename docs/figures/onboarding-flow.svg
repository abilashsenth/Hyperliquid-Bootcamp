<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 210" role="img" aria-label="Five steps in a row: a fresh wallet, a small mainnet deposit that also pays the one-dollar activation, the testnet faucet that only pays an address that has deposited on mainnet, enabling trading with a gas-free signature, then trading on testnet" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="210" rx="12" style="fill:#ffffff"/><defs><marker id="fg20-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg20-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg20-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg20-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg20-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg20-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg20-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><rect x="16" y="30" width="116" height="92" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="26" y="52" style="fill:#0f1a2a;font-size:12px;font-weight:800">1 · Wallet</text><text x="26" y="74" style="fill:#5f6f82;font-size:10.5px">Rabby or MetaMask</text><text x="26" y="90" style="fill:#5f6f82;font-size:10.5px">fresh, seed offline</text><line x1="133" y1="76" x2="143" y2="76" marker-end="url(#fg20-muted)" style="stroke:#5f6f82;stroke-width:1.4;stroke-linecap:round"/><rect x="144" y="30" width="116" height="92" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="154" y="52" style="fill:#0f1a2a;font-size:12px;font-weight:800">2 · Mainnet</text><text x="154" y="74" style="fill:#5f6f82;font-size:10.5px">10 USDC on Arbitrum</text><text x="154" y="90" style="fill:#5f6f82;font-size:10.5px">+1 USDC activation</text><line x1="261" y1="76" x2="271" y2="76" marker-end="url(#fg20-muted)" style="stroke:#5f6f82;stroke-width:1.4;stroke-linecap:round"/><rect x="272" y="30" width="116" height="92" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="282" y="52" style="fill:#0f1a2a;font-size:12px;font-weight:800">3 · Faucet</text><text x="282" y="74" style="fill:#5f6f82;font-size:10.5px">1,000 mock USDC</text><text x="282" y="90" style="fill:#5f6f82;font-size:10.5px">same address</text><line x1="389" y1="76" x2="399" y2="76" marker-end="url(#fg20-muted)" style="stroke:#5f6f82;stroke-width:1.4;stroke-linecap:round"/><rect x="400" y="30" width="116" height="92" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="410" y="52" style="fill:#0f1a2a;font-size:12px;font-weight:800">4 · Enable trading</text><text x="410" y="74" style="fill:#5f6f82;font-size:10.5px">sign once, gas-free</text><text x="410" y="90" style="fill:#5f6f82;font-size:10.5px">per device</text><line x1="517" y1="76" x2="527" y2="76" marker-end="url(#fg20-muted)" style="stroke:#5f6f82;stroke-width:1.4;stroke-linecap:round"/><rect x="528" y="30" width="116" height="92" rx="10" style="fill:rgba(59,91,219,.16);stroke:#3b5bdb;stroke-width:1.3"/><text x="538" y="52" style="fill:#0f1a2a;font-size:12px;font-weight:800">5 · Testnet</text><text x="538" y="74" style="fill:#5f6f82;font-size:10.5px">the testnet app</text><text x="538" y="90" style="fill:#5f6f82;font-size:10.5px">until Layer 7</text><text x="16" y="150" style="fill:#5f6f82;font-size:11.5px">why the mainnet deposit comes first: the faucet pays only an address that has deposited on mainnet.</text><text x="16" y="170" style="fill:#5f6f82;font-size:11.5px">why a wallet and not email: email login creates different addresses on mainnet and testnet.</text><text x="16" y="196" style="fill:#5f6f82;font-size:11.5px">Trading is gas-free. Deposits need a little ETH on Arbitrum for gas; withdrawals cost $1 and take a few minutes.</text></svg>