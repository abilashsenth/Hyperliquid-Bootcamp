<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" role="img" aria-label="A filled-in trade plan card with seven lines: setup, entry, invalidation, target, size from risk, time stop and early exit, using the worked numbers from Layer 4" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="270" rx="12" style="fill:#ffffff"/><defs><marker id="fg59-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg59-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg59-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg59-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg59-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg59-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg59-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><rect x="20" y="16" width="620" height="240" rx="14" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="36" y="42" style="fill:#0f1a2a;font-size:13px;font-weight:800">Trade plan · BTC long · 3 Nov 2026, 19:10 IST</text><text x="36" y="70" style="fill:#3b5bdb;font-size:11.5px;font-weight:800">Setup</text><text x="130" y="70" style="fill:#0f1a2a;font-size:11px">4-hour higher low retest at 76,200 after a daily close above it</text><line x1="36" y1="79" x2="624" y2="79" style="stroke:#e2e8f0;stroke-width:1.5;stroke-linecap:round"/><text x="36" y="96" style="fill:#3b5bdb;font-size:11.5px;font-weight:800">Entry</text><text x="130" y="96" style="fill:#0f1a2a;font-size:11px">limit buy 0.0222 BTC at 76,350 (resting, maker)</text><line x1="36" y1="105" x2="624" y2="105" style="stroke:#e2e8f0;stroke-width:1.5;stroke-linecap:round"/><text x="36" y="122" style="fill:#3b5bdb;font-size:11.5px;font-weight:800">Invalidation</text><text x="130" y="122" style="fill:#0f1a2a;font-size:11px">stop at 75,900: a 4-hour close below the last higher low. Market stop, reduce-only</text><line x1="36" y1="131" x2="624" y2="131" style="stroke:#e2e8f0;stroke-width:1.5;stroke-linecap:round"/><text x="36" y="148" style="fill:#3b5bdb;font-size:11.5px;font-weight:800">Target</text><text x="130" y="148" style="fill:#0f1a2a;font-size:11px">77,700, three times the stop distance; take-profit limit, reduce-only</text><line x1="36" y1="157" x2="624" y2="157" style="stroke:#e2e8f0;stroke-width:1.5;stroke-linecap:round"/><text x="36" y="174" style="fill:#3b5bdb;font-size:11.5px;font-weight:800">Size</text><text x="130" y="174" style="fill:#0f1a2a;font-size:11px">$10 risk (1% of $1,000) ÷ $450 stop = 0.0222 BTC · $1,696 notional · $339 margin at 5x</text><line x1="36" y1="183" x2="624" y2="183" style="stroke:#e2e8f0;stroke-width:1.5;stroke-linecap:round"/><text x="36" y="200" style="fill:#3b5bdb;font-size:11.5px;font-weight:800">Time stop</text><text x="130" y="200" style="fill:#0f1a2a;font-size:11px">out at the next 00:00 UTC close if neither level has been reached</text><line x1="36" y1="209" x2="624" y2="209" style="stroke:#e2e8f0;stroke-width:1.5;stroke-linecap:round"/><text x="36" y="226" style="fill:#3b5bdb;font-size:11.5px;font-weight:800">Early exit</text><text x="130" y="226" style="fill:#0f1a2a;font-size:11px">a 4-hour close back below 76,200 before the target: exit, whatever the PnL</text><line x1="36" y1="235" x2="624" y2="235" style="stroke:#e2e8f0;stroke-width:1.5;stroke-linecap:round"/><text x="36" y="248" style="fill:#5f6f82;font-size:10.5px;font-weight:700">seven lines. If any of them is blank, there is no trade.</text></svg>