<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-label="Two columns comparing who you trust: validator-run perps use an oracle published by the stake-weighted validator set, while a HIP-3 market’s oracle, leverage, fees, halting and settlement are controlled by one deployer who has staked five hundred thousand HYPE" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="340" rx="12" style="fill:#ffffff"/><defs><marker id="fg66-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg66-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg66-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg66-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg66-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg66-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg66-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><rect x="20" y="20" width="300" height="290" rx="12" style="fill:#ffffff;stroke:#3b5bdb;stroke-width:1.5"/><text x="36" y="46" style="fill:#3b5bdb;font-size:13px;font-weight:800">validator-run perps</text><text x="36" y="72" style="fill:#5f6f82;font-size:10.5px;font-weight:700">oracle</text><text x="36" y="87" style="fill:#0f1a2a;font-size:11px">stake-weighted median of many validators,</text><text x="36" y="100" style="fill:#0f1a2a;font-size:11px">from 8 spot sources</text><text x="36" y="120" style="fill:#5f6f82;font-size:10.5px;font-weight:700">leverage and margin</text><text x="36" y="135" style="fill:#0f1a2a;font-size:11px">set by the protocol; cross or isolated</text><text x="36" y="168" style="fill:#5f6f82;font-size:10.5px;font-weight:700">who can halt it</text><text x="36" y="183" style="fill:#0f1a2a;font-size:11px">validators, by vote; delisting settles at a</text><text x="36" y="196" style="fill:#0f1a2a;font-size:11px">1-hour oracle average</text><text x="36" y="216" style="fill:#5f6f82;font-size:10.5px;font-weight:700">fees</text><text x="36" y="231" style="fill:#0f1a2a;font-size:11px">the standard schedule</text><text x="36" y="264" style="fill:#5f6f82;font-size:10.5px;font-weight:700">if the oracle is wrong</text><text x="36" y="279" style="fill:#0f1a2a;font-size:11px">many validators would have to agree on the</text><text x="36" y="292" style="fill:#0f1a2a;font-size:11px">wrong number</text><rect x="340" y="20" width="300" height="290" rx="12" style="fill:#ffffff;stroke:#c07a0c;stroke-width:1.5"/><text x="356" y="46" style="fill:#c07a0c;font-size:13px;font-weight:800">HIP-3 builder perps</text><text x="356" y="72" style="fill:#5f6f82;font-size:10.5px;font-weight:700">oracle</text><text x="356" y="87" style="fill:#0f1a2a;font-size:11px">the deployer’s own feed, from whatever</text><text x="356" y="100" style="fill:#0f1a2a;font-size:11px">source they choose</text><text x="356" y="120" style="fill:#5f6f82;font-size:10.5px;font-weight:700">leverage and margin</text><text x="356" y="135" style="fill:#0f1a2a;font-size:11px">set by the deployer; many markets</text><text x="356" y="148" style="fill:#0f1a2a;font-size:11px">isolated-only</text><text x="356" y="168" style="fill:#5f6f82;font-size:10.5px;font-weight:700">who can halt it</text><text x="356" y="183" style="fill:#0f1a2a;font-size:11px">the deployer, at any time, settling</text><text x="356" y="196" style="fill:#0f1a2a;font-size:11px">positions at the current mark</text><text x="356" y="216" style="fill:#5f6f82;font-size:10.5px;font-weight:700">fees</text><text x="356" y="231" style="fill:#0f1a2a;font-size:11px">the deployer adds a share; growth mode cuts</text><text x="356" y="244" style="fill:#0f1a2a;font-size:11px">the all-in fee 90%</text><text x="356" y="264" style="fill:#5f6f82;font-size:10.5px;font-weight:700">if the oracle is wrong</text><text x="356" y="279" style="fill:#0f1a2a;font-size:11px">one feed, one operator; validators can</text><text x="356" y="292" style="fill:#0f1a2a;font-size:11px">slash their 500k HYPE stake afterwards</text><text x="20" y="332" style="fill:#5f6f82;font-size:10.5px">slashed stake is burned, not paid to the traders who were hurt. The deterrent protects the venue, not your position.</text></svg>