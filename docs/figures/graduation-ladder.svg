<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-label="Four steps up: twenty planned testnet trades, then mainnet at ten-dollar orders with half-percent risk, then risk raised toward one percent after a positive block with over ninety percent adherence, then HIP-3 markets and hyperps only after two such blocks" style="font-family:Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif;font-size:13px" data-w="660"><rect x="0" y="0" width="660" height="250" rx="12" style="fill:#ffffff"/><defs><marker id="fg64-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0f1a2a"/></marker><marker id="fg64-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#5f6f82"/></marker><marker id="fg64-bid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#15934f"/></marker><marker id="fg64-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#d0392b"/></marker><marker id="fg64-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#3b5bdb"/></marker><marker id="fg64-oracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#c07a0c"/></marker><marker id="fg64-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" style="fill:#0e9a86"/></marker></defs><rect x="20" y="150" width="150" height="90" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="30" y="170" style="fill:#0f1a2a;font-size:11.5px;font-weight:800">1 · testnet</text><text x="30" y="188" style="fill:#5f6f82;font-size:10px">20 planned trades,</text><text x="30" y="200" style="fill:#5f6f82;font-size:10px">journaled and graded</text><text x="30" y="216" style="fill:#5f6f82;font-size:10px">expectancy and</text><text x="30" y="228" style="fill:#5f6f82;font-size:10px">adherence computed</text><rect x="178" y="114" width="150" height="126" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="188" y="134" style="fill:#0f1a2a;font-size:11.5px;font-weight:800">2 · mainnet, min size</text><text x="188" y="152" style="fill:#5f6f82;font-size:10px">$10 orders, isolated,</text><text x="188" y="164" style="fill:#5f6f82;font-size:10px">0.5% risk, 20 trades</text><text x="188" y="180" style="fill:#5f6f82;font-size:10px">fees and funding are</text><text x="188" y="192" style="fill:#5f6f82;font-size:10px">real now</text><rect x="336" y="78" width="150" height="162" rx="10" style="fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3"/><text x="346" y="98" style="fill:#0f1a2a;font-size:11.5px;font-weight:800">3 · raise the risk</text><text x="346" y="116" style="fill:#5f6f82;font-size:10px">toward 1% only after a</text><text x="346" y="128" style="fill:#5f6f82;font-size:10px">block that is positive</text><text x="346" y="144" style="fill:#5f6f82;font-size:10px">and above 90% adherence</text><rect x="494" y="42" width="150" height="198" rx="10" style="fill:rgba(59,91,219,.16);stroke:#3b5bdb;stroke-width:1.3"/><text x="504" y="62" style="fill:#0f1a2a;font-size:11.5px;font-weight:800">4 · widen the markets</text><text x="504" y="80" style="fill:#5f6f82;font-size:10px">HIP-3 and hyperps only</text><text x="504" y="92" style="fill:#5f6f82;font-size:10px">after two such blocks</text><text x="504" y="108" style="fill:#5f6f82;font-size:10px">on the main</text><text x="504" y="120" style="fill:#5f6f82;font-size:10px">validator-run perps</text><text x="20" y="30" style="fill:#3b5bdb;font-size:11.5px;font-weight:800">a step is earned by a block, never by a calendar</text></svg>